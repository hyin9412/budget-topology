          </td>
          <td class="aggregate-table-muted">${item.secondLevelNodes.length ? escapeHtml(item.secondLevelNodes.join("；")) : "0"}</td>
        </tr>
      `).join("");
    }

    function getRawDatasetForDrawer() {
      return getActiveDataset(state.mode);
    }

    function getNodeLayerInfo(node, dataset) {
      const layers = dataset?.layers || [];
      const layerIndex = Number.isFinite(node?.layerIndex)
        ? node.layerIndex
        : getNearestLayerIndex(node?.y || 0, layers);
      const layer = layers[layerIndex] || {};
      const layerLabel = formatLayerName(layer.label || "");
      const layerVariant = getSchemeFiveLayerVariant(dataset, layerIndex, layer.label || "");
      return { layerIndex, layerLabel, layerVariant };
    }

    function getBudgetRelationSide(centerNode, connectedNode, edge, dataset) {
      const connectedLayer = getNodeLayerInfo(connectedNode, dataset);
      if (connectedLayer.layerVariant === "demand" || /上游|需求方/.test(connectedLayer.layerLabel)) {
        return "demand";
      }
      if (connectedLayer.layerVariant === "supply" || /下游|供给方/.test(connectedLayer.layerLabel)) {
        return "supply";
      }
      if ((connectedNode?.y || 0) < (centerNode?.y || 0)) {
        return "demand";
      }
      if ((connectedNode?.y || 0) > (centerNode?.y || 0)) {
        return "supply";
      }
      return edge.target === centerNode?.id ? "demand" : "supply";
    }

    function buildNodeDrawerDetail(node) {
      const rawDataset = getRawDatasetForDrawer();
      const rawNodes = rawDataset.nodes || [];
      const rawEdges = rawDataset.edges || [];
      const rawNodeById = new Map(rawNodes.map((item) => [item.id, item]));
      const sourceNode = rawNodeById.get(node.id) || node;
      const rowByKey = new Map();

      rawEdges.forEach((edge) => {
        if (edge.source !== node.id && edge.target !== node.id) {
          return;
        }

        const connectedId = edge.source === node.id ? edge.target : edge.source;
        const connectedNode = rawNodeById.get(connectedId) || state.graph?.nodeMap?.get(connectedId);
        if (!connectedNode || connectedNode.aggregate) {
          return;
        }

        const side = getBudgetRelationSide(sourceNode, connectedNode, edge, rawDataset);
        const key = `${side}:${connectedId}`;
        const amount = parseAmountNumber(edge.amount);
        if (!rowByKey.has(key)) {
          rowByKey.set(key, {
            id: connectedId,
            title: connectedNode.title,
            side,
            sideText: getDrawerNodeTypeLabel(connectedNode, side, rawDataset),
            costAmount: 0,
            incomeAmount: 0
          });
        }

        const row = rowByKey.get(key);
        if (side === "demand") {
          row.costAmount += amount;
        } else {
          row.incomeAmount += amount;
        }
      });

      const items = Array.from(rowByKey.values()).map((item) => {
        const diffAmount = item.incomeAmount - item.costAmount;
        const diffRate = item.costAmount ? (diffAmount / item.costAmount) * 100 : 0;
        return {
          ...item,
          costAmountText: formatAmountNumber(item.costAmount),
          costAmountDisplayText: formatCompactAmountNumber(item.costAmount),
          incomeAmountText: formatAmountNumber(item.incomeAmount),
          incomeAmountDisplayText: formatCompactAmountNumber(item.incomeAmount),
          diffAmount,
          diffAmountText: formatAmountNumber(diffAmount),
          diffAmountDisplayText: formatCompactAmountNumber(diffAmount),
          diffRate,
          diffRateText: formatPercentNumber(diffRate)
        };
      }).sort((a, b) => {
        if (a.side !== b.side) {
          return a.side === "demand" ? -1 : 1;
        }
        return Math.abs(b.costAmount || b.incomeAmount) - Math.abs(a.costAmount || a.incomeAmount);
      });

      const costTotal = items.reduce((sum, item) => sum + item.costAmount, 0);
      const incomeTotal = items.reduce((sum, item) => sum + item.incomeAmount, 0);
      const diffAmount = incomeTotal - costTotal;
      const diffRate = costTotal ? (diffAmount / costTotal) * 100 : 0;

      return {
        title: sourceNode.title || node.title,
        count: items.length,
        costTotalText: formatAmountNumber(costTotal),
        costTotalDisplayText: formatCompactAmountNumber(costTotal),
        incomeTotalText: formatAmountNumber(incomeTotal),
        incomeTotalDisplayText: formatCompactAmountNumber(incomeTotal),
        diffAmountText: formatAmountNumber(diffAmount),
        diffAmountDisplayText: formatCompactAmountNumber(diffAmount),
        diffRateText: formatPercentNumber(diffRate),
        childBudgetFlows: shouldShowChildBudgetFlows(sourceNode, rawDataset) ? getTopChildBudgetFlows(sourceNode, rawDataset) : [],
        childBudgetFlowSigned: shouldUseSignedChildBudgetFlowAmount(rawDataset),
        items
      };
    }

    function buildAggregateDrawerTablePayload(detail) {
      const levelName = getLayerLevelName(detail?.layerLabel || "一级");
      const roleName = getDrawerRoleName(detail?.layerVariant, detail?.layerLabel || "");
      const rows = (detail?.items || []).map((item) => ({
        key: item.id,
        name: item.title,
        costAmount: item.costAmountDisplayText || item.costAmountText,
        incomeAmount: item.incomeAmountDisplayText || item.incomeAmountText,
        upstreamNodes: item.upstreamNodes || [],
        downstreamNodes: item.downstreamNodes || [],
        nextLevelNodes: item.secondLevelNodes || []
      }));
      return {
        mode: "aggregate",
        primaryColumnTitle: `${levelName}${roleName}`,
        showRelationColumns: true,
        rows
      };
    }

    function buildNodeDrawerTablePayload(detail) {
      return {
        mode: "node",
        rows: (detail?.items || []).map((item) => ({
          key: item.id,
          nodeType: item.sideText,
          name: item.title,
          costAmount: item.costAmountDisplayText || item.costAmountText,
          incomeAmount: item.incomeAmountDisplayText || item.incomeAmountText,
          diffAmount: item.diffAmountDisplayText || item.diffAmountText,
          diffRate: item.diffRateText
        }))
      };
    }

    function getBudgetTableChildName(node, index) {
      const title = String(node?.title || "预算单元");
      const codeMatch = title.match(/[（(]([^）)]+)[）)]/);
      const code = codeMatch ? codeMatch[1] : String((index % 9) + 1);
      const nameWithoutCode = title.replace(/\s*[（(][^）)]+[）)]\s*$/, "");
      const shortName = nameWithoutCode.includes("-")
        ? nameWithoutCode.split("-").filter(Boolean).slice(-1)[0]
        : nameWithoutCode;
      return `${shortName || "子预算单元"} (${code})`;
    }

    function getBudgetTableProductName(index) {
      const products = ["视觉服务", "计算服务", "存储服务", "数据分析服务", "内容审核服务", "安全服务"];
      return `${products[index % products.length]} (${5678 + index})`;
    }

    function getBudgetTableBillingUnit(index) {
      const names = ["XXXX", "CPU标准单元", "对象存储包", "审核资源包", "数据加工单元", "带宽计量单元"];
      return `${names[index % names.length]}（${7890 + index}）`;
    }

    const budgetDetailMonths = ["2026-07", "2026-08", "2026-09", "2026-10", "2026-11", "2026-12"];
    const budgetMonthWeights = [0.14, 0.16, 0.17, 0.18, 0.17, 0.18];

    function buildBudgetMonthlyAmounts(amount, rowIndex) {
      const monthlyAmounts = {};
      const rotation = rowIndex % budgetMonthWeights.length;
      const weights = budgetMonthWeights.map((_, index) => budgetMonthWeights[(index + rotation) % budgetMonthWeights.length]);
      let allocated = 0;

      budgetDetailMonths.forEach((month, index) => {
        const monthAmount = index === budgetDetailMonths.length - 1
          ? amount - allocated
          : amount * weights[index];
        allocated += monthAmount;
        monthlyAmounts[month] = formatCompactAmountNumber(monthAmount);
      });

      return monthlyAmounts;
    }

    function buildBudgetTableDetailForNode(node, dataset) {
      const rawNodes = dataset.nodes || [];
      const rawEdges = dataset.edges || [];
      const rawNodeById = new Map(rawNodes.map((item) => [item.id, item]));
      const demandNodeIds = new Set();
      const supplyNodeIds = new Set();
      let costTotal = 0;
      let incomeTotal = 0;

      const rows = rawEdges
        .filter((edge) => edge.source === node.id || edge.target === node.id)
        .map((edge, index) => {
          const connectedId = edge.source === node.id ? edge.target : edge.source;
          const connectedNode = rawNodeById.get(connectedId);
          if (!connectedNode) {
            return null;
          }

          const side = getBudgetRelationSide(node, connectedNode, edge, dataset);
          const amount = parseAmountNumber(edge.amount);
          const isCost = side === "demand";
          const demandNode = isCost ? connectedNode : node;
          const supplyNode = isCost ? node : connectedNode;

          if (isCost) {
            demandNodeIds.add(demandNode.id);
            costTotal += amount;
          } else {
            supplyNodeIds.add(supplyNode.id);
            incomeTotal += amount;
          }

          return {
            key: edge.id,
            demandFirst: demandNode.title,
            demandChild: getBudgetTableChildName(demandNode, index),
            supplyFirst: supplyNode.title,
            supplyChild: getBudgetTableChildName(supplyNode, index + 3),
            product: getBudgetTableProductName(index),
            billingUnit: getBudgetTableBillingUnit(index),
            saleRegion: index % 3 === 0 ? "国内（cn-middle-all）" : index % 3 === 1 ? "海外（sg-all）" : "国内（cn-north-all）",
            amount: formatCompactAmountNumber(amount),
            monthlyAmounts: buildBudgetMonthlyAmounts(amount, index),
            type: isCost ? "cost" : "income"
          };
        })
        .filter(Boolean);

      const role = node.role === "initiator"
        ? "发起方"
        : getDrawerNodeTypeLabel(node, null, dataset);

      return {
        title: node.title,
        role,
        demandCount: demandNodeIds.size,
        supplyCount: supplyNodeIds.size,
        costAmount: formatCompactAmountNumber(costTotal),
        incomeAmount: formatCompactAmountNumber(incomeTotal),
        rows
      };
    }

    function buildBudgetTablePayload() {
      const dataset = getRawDatasetForDrawer();
      const nodes = (dataset.nodes || []).filter((node) => !node.aggregate);
      const selectedNode = nodes.find((node) => node.role === "initiator") || nodes[0];
      const focusedNode = state.budgetTableFocus?.unitKey
        ? nodes.find((node) => node.id === state.budgetTableFocus.unitKey)
        : null;
      const detailsByUnit = {};

      nodes.forEach((node) => {
        detailsByUnit[node.id] = buildBudgetTableDetailForNode(node, dataset);
      });

      return {
        title: dataset.label || "预算调整明细",
        selectedKey: focusedNode?.id || selectedNode?.id || "",
        activeTab: focusedNode ? state.budgetTableFocus?.tab || "cost" : "cost",
        options: nodes.map((node) => ({
          key: node.id,
          label: node.title,
          role: detailsByUnit[node.id]?.role || "预算单元"
        })),
        detailsByUnit
      };
    }

    function renderBudgetTableFallback(payload) {
      if (!budgetTableView) {
        return;
      }

      const selectedKey = payload.selectedKey || payload.options?.[0]?.key || "";
      const detail = payload.detailsByUnit?.[selectedKey];
      if (!detail) {
        budgetTableView.innerHTML = `<div class="budget-table-empty">暂无预算调整明细</div>`;
        return;
      }

      const activeTab = payload.activeTab === "income" ? "income" : "cost";
      const visibleRows = (detail.rows || []).filter((row) => row.type === activeTab);
      const roleVariant = getRoleTagVariant(detail.role);
      const optionHtml = (payload.options || []).map((option) => `
        <option value="${escapeHtml(option.key)}"${option.key === selectedKey ? " selected" : ""}>${escapeHtml(option.label)}</option>
      `).join("");
      const rowsHtml = visibleRows.length
        ? visibleRows.map((row) => `
          <tr>
            <td>${escapeHtml(row.demandFirst)}</td>
            <td>${escapeHtml(row.demandChild)}</td>
            <td>${escapeHtml(row.supplyFirst)}</td>
            <td>${escapeHtml(row.supplyChild)}</td>
            <td>${escapeHtml(row.product)}</td>
            <td>${escapeHtml(row.billingUnit)}</td>
            <td style="text-align: right;">${escapeHtml(row.amount)}</td>
            ${budgetDetailMonths.map((month) => `<td style="text-align: right;">${escapeHtml(row.monthlyAmounts?.[month] || "0元")}</td>`).join("")}
          </tr>
        `).join("")
        : `<tr><td colspan="${7 + budgetDetailMonths.length}" class="aggregate-table-muted">暂无${activeTab === "income" ? "收入" : "成本"}调整明细</td></tr>`;

      budgetTableView.innerHTML = `
        <div class="budget-table-view">
          <div class="budget-table-selector-card">
            <span class="budget-table-selector-label">预算单元</span>
            <select class="budget-table-main-select" data-budget-table-select>${optionHtml}</select>
          </div>
          <div class="budget-table-detail-card">
            <div class="budget-table-detail-head">
              <div>
                <div class="budget-table-title-row">
                  <span class="budget-table-title">${escapeHtml(detail.title)}</span>
                  <span class="budget-table-role-tag is-${roleVariant}"><span class="arco-tag-content">${escapeHtml(detail.role)}</span></span>
                </div>
                <div class="budget-table-description">
                  <span>一级需求方 ${detail.demandCount} 个</span>
                  <span class="budget-table-desc-divider"></span>
                  <span>一级供给方 ${detail.supplyCount} 个</span>
                  <span class="budget-table-desc-divider"></span>
                  <span>成本调整总金额 ${escapeHtml(detail.costAmount)}</span>
                  <span class="budget-table-desc-divider"></span>
                  <span>收入调整总金额 ${escapeHtml(detail.incomeAmount)}</span>
                </div>
              </div>
            </div>
            <div class="budget-table-tabs-row">
              <div class="budget-table-tabs">
                <button class="arco-tabs-header-title ${activeTab === "cost" ? "arco-tabs-header-title-active" : ""}" type="button" data-budget-table-tab="cost">成本明细</button>
                <button class="arco-tabs-header-title ${activeTab === "income" ? "arco-tabs-header-title-active" : ""}" type="button" data-budget-table-tab="income">收入明细</button>
              </div>
              <div class="budget-table-tip"><span class="budget-table-info-icon">i</span><span>点击侧边栏金额后自动定位到对应预算单元和页签</span></div>
            </div>
            <div class="aggregate-table-wrap budget-table-detail-table">
              <table class="aggregate-table">
                <thead>
                  <tr>
                    <th>一级需求方</th>
                    <th>二级需求方</th>
                    <th>一级供给方</th>
                    <th>二级供给方</th>
                    <th>售卖产品</th>
                    <th>计费单元</th>
                    <th style="text-align: right;">调整金额</th>
                    ${budgetDetailMonths.map((month) => `<th style="text-align: right;">${escapeHtml(month)}</th>`).join("")}
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
      budgetTableView.classList.add("is-tod-rendered");
    }

    function syncViewTabs(view) {
      const nextView = view === "table" ? "table" : "topology";
      viewTabButtons.forEach((button) => {
        const isActive = button.dataset.viewKey === nextView;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });
    }

    function updateBudgetTableView() {
      if (!budgetTableView) {
        return;
      }

      const payload = buildBudgetTablePayload();
      budgetTableView.dataset.todBudgetTableView = JSON.stringify(payload);
      if (typeof window.renderTodBudgetTableViews === "function") {
        window.renderTodBudgetTableViews();
      } else {
        renderBudgetTableFallback(payload);
      }
    }

    function syncTopologyView(view) {
      const nextView = view === "table" ? "table" : "topology";
      state.view = nextView;
      card?.classList.toggle("is-table-view", nextView === "table");
      syncViewTabs(nextView);
      syncDrawerResizeState();

      if (nextView === "table") {
        updateBudgetTableView();
        destroyDrawerTooltips();
      } else if (state.graph) {
        requestAnimationFrame(fitView);
      }
    }

    function buildNodeDrawerTableRows(items) {
      if (!items.length) {
        return `
          <tr>
            <td colspan="4" class="aggregate-table-muted">暂无一级供给方或一级需求方</td>
          </tr>
        `;
      }

      return items.map((item) => `
        <tr>
          <td class="aggregate-table-muted">${escapeHtml(item.sideText)}</td>
          <td><div class="aggregate-table-node" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div></td>
          <td>
            ${renderLegacyDrawerAmountCell(item.costAmountDisplayText || item.costAmountText, "去表格视图查看明细")}
          </td>
          <td>
            ${renderLegacyDrawerAmountCell(item.incomeAmountDisplayText || item.incomeAmountText, "去表格视图查看明细")}
          </td>
        </tr>
      `).join("");
    }

    function initDrawerTooltips() {
      if (typeof window.tippy !== "function") {
        return;
      }

      destroyDrawerTooltips();
      const targets = Array.from(aggregateDrawerBody.querySelectorAll("[data-drawer-tooltip]"));
      state.drawerTooltipInstances = targets.map((target) => window.tippy(target, {
        content: target.getAttribute("data-drawer-tooltip"),
        trigger: "click",
        arrow: true,
        theme: "topology",
        placement: "top",
        duration: [120, 80],
        interactive: false,
        appendTo: () => document.body,
        onShow(instanceRef) {
          state.drawerTooltipInstances.forEach((instance) => {
            if (instance !== instanceRef) {
              instance.hide();
            }
          });
        }
      }));
    }

    function activateNodeById(nodeId) {
      const node = state.graph?.nodeMap?.get(nodeId);
      if (!node) {
        return;
      }

      const now = Date.now();
      if (state.lastNodeActivation
        && state.lastNodeActivation.nodeId === nodeId
        && now - state.lastNodeActivation.time < 120) {
        return;
      }

      state.lastNodeActivation = { nodeId, time: now };
      if (state.mode === "migrationCase3") {
        setSelectedNode(node.id);
        if (node.role === "initiator" && isMigrationCase3GlobalView()) {
          state.migrationCase3FocusId = node.id;
          hideAggregateDrawerForDataSwitch();
          render({ resetDrawer: false });
          return;
        }

        if (node.role === "initiator" && node.id !== state.migrationCase3FocusId) {
          state.migrationCase3FocusId = node.id;
          hideAggregateDrawerForDataSwitch();
          render({ resetDrawer: false });
          return;
        }

        if (node.role !== "initiator" && !node.aggregate) {
          return;
        }
      }
      setSelectedNode(node.id);
      if (node.aggregate) {
        openAggregateDrawer(node.aggregate);
      } else {
        openNodeDrawer(node);
      }
    }

    function revealAggregateDrawer() {
      requestAnimationFrame(() => {
        fitView();

        requestAnimationFrame(() => {
          if (state.view !== "topology" || aggregateDrawer.classList.contains("is-collapsed")) {
            return;
          }

          const rect = aggregateDrawer.getBoundingClientRect();
          const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
          const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
          const isFullyVisible = rect.top >= 0
            && rect.left >= 0
            && rect.bottom <= viewportHeight
            && rect.right <= viewportWidth;

          if (!isFullyVisible) {
            aggregateDrawer.scrollIntoView({ block: "nearest", inline: "nearest" });
          }
        });
      });
    }

    function openAggregateDrawer(detail) {
      if (!detail) {
        return;
      }

      destroyDrawerTooltips();
      const drawerTitle = getAggregatePanelTitle(detail);
      setDrawerTitle(drawerTitle);
      aggregateDrawerSubtitle.textContent = `共 ${detail.count} 个节点`;
      aggregateDrawerBody.innerHTML = `
        ${renderAggregateSummary(detail.costTotalDisplayText || detail.costTotalText, detail.incomeTotalDisplayText || detail.incomeTotalText)}
        <div class="aggregate-section-title">${escapeHtml(drawerTitle)}</div>
        ${renderDrawerTable(buildAggregateDrawerTablePayload(detail))}
      `;
      requestTodDrawerSummaryRender();
      aggregateDrawer.classList.remove("is-collapsed");
      aggregateDrawer.classList.add("is-open");
      aggregateDrawer.setAttribute("aria-hidden", "false");
      syncDrawerResizeState();
      revealAggregateDrawer();
      initDrawerTooltips();
    }

    function openNodeDrawer(node) {
      if (!node || node.aggregate) {
        return;
      }

      destroyDrawerTooltips();
      const detail = buildNodeDrawerDetail(node);
      const hasChildFlowTabs = detail.childBudgetFlows?.length > 0;
      setDrawerTitle(detail.title, getDrawerTitleTagText(node));
      aggregateDrawerSubtitle.textContent = "";
      aggregateDrawerBody.innerHTML = `
        ${renderSummaryCards([
          { label: "成本调整总金额", value: detail.costTotalDisplayText || detail.costTotalText },
          { label: "收入调整总金额", value: detail.incomeTotalDisplayText || detail.incomeTotalText },
          {
            label: "收支偏差",
            value: detail.diffAmountDisplayText || detail.diffAmountText,
            subtext: detail.diffRateText
          }
        ])}
        ${hasChildFlowTabs ? renderNodeDrawerDetailTabs(detail) : `
          <div class="aggregate-section-title">需求方和供给方明细</div>
          ${renderDrawerTable(buildNodeDrawerTablePayload(detail))}
        `}
      `;
      requestTodDrawerSummaryRender();
      aggregateDrawer.classList.remove("is-collapsed");
      aggregateDrawer.classList.add("is-open");
      aggregateDrawer.setAttribute("aria-hidden", "false");
      syncDrawerResizeState();
      revealAggregateDrawer();
      initDrawerTooltips();
    }

    function closeAggregateDrawer() {
      collapseAggregateDrawer();
    }

    function collapseAggregateDrawer() {
      destroyDrawerTooltips();
      aggregateDrawer.classList.remove("is-open");
      aggregateDrawer.classList.add("is-collapsed");
      aggregateDrawer.setAttribute("aria-hidden", "true");
      clearSelectedState();
      syncDrawerResizeState();
      requestAnimationFrame(fitView);
    }

    function hideAggregateDrawerForDataSwitch() {
      destroyDrawerTooltips();
      aggregateDrawer.classList.remove("is-open");
      aggregateDrawer.classList.add("is-collapsed");
      aggregateDrawer.setAttribute("aria-hidden", "true");
      syncDrawerResizeState();
    }

    function syncMigrationCase3DrillControls() {
      if (!topologyBackGlobal) {
        return;
      }

      const isDrilling = state.mode === "migrationCase3" && Boolean(state.migrationCase3FocusId);
      topologyBackGlobal.hidden = !isDrilling;
      const currentNode = isDrilling
        ? state.graph?.nodeMap?.get(state.migrationCase3FocusId)
        : null;
      topologyBackGlobal.dataset.currentTitle = currentNode?.title || "当前发起方";
      const currentTitleElement = topologyBackGlobal.querySelector("[data-topology-back-current]");
      if (currentTitleElement) {
        currentTitleElement.textContent = topologyBackGlobal.dataset.currentTitle;
      }
      window.renderTodBackBreadcrumb?.();
      window.dispatchEvent(new CustomEvent("tod-back-breadcrumb:render"));
    }

    function applyActiveState() {
      const edgeGroups = viewportLayer.querySelectorAll(".edge-group");
      const tagGroups = viewportLayer.querySelectorAll(".tag-group");
      const nodeGroups = viewportLayer.querySelectorAll(".node-group");
      const backdropGroup = viewportLayer.querySelector('[data-layer="backdrop-group"]');
      const edgeLayer = viewportLayer.querySelector('[data-layer="edge-base"]');
      const tagLayer = viewportLayer.querySelector('[data-layer="tag-base"]');
      const nodeLayer = viewportLayer.querySelector('[data-layer="node-base"]');
      const activeEdgeLayer = viewportLayer.querySelector('[data-layer="edge-active"]');
      const activeTagLayer = viewportLayer.querySelector('[data-layer="tag-active"]');
      const activeNodeLayer = viewportLayer.querySelector('[data-layer="node-active"]');

      if (!state.active) {
        if (backdropGroup) {
          backdropGroup.style.opacity = "1";
        }
        edgeGroups.forEach((group) => {
          group.classList.remove("is-active");
          if (edgeLayer) {
            edgeLayer.appendChild(group);
          }
        });
        tagGroups.forEach((group) => {
          group.classList.remove("is-active");
          group.style.opacity = "1";
          if (tagLayer) {
            tagLayer.appendChild(group);
          }
        });
        nodeGroups.forEach((group) => {
          group.classList.remove("is-selected");
          group.classList.remove("is-active");
          if (nodeLayer) {
            nodeLayer.appendChild(group);
          }
        });
        return;
      }

      if (backdropGroup) {
        backdropGroup.style.opacity = String(getComputedStyle(document.documentElement).getPropertyValue("--dim-opacity").trim() || 0.3);
      }

      edgeGroups.forEach((group) => {
        const edgeId = group.getAttribute("data-edge-id");
        const isActive = state.active.edgeIds.has(edgeId);
        group.classList.toggle("is-active", isActive);
        if (isActive && activeEdgeLayer) {
          activeEdgeLayer.appendChild(group);
        } else if (edgeLayer) {
          edgeLayer.appendChild(group);
        }
      });

      tagGroups.forEach((group) => {
        const edgeIds = (group.getAttribute("data-edge-ids") || group.getAttribute("data-edge-id") || "")
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
        const isActive = edgeIds.some((edgeId) => state.active.edgeIds.has(edgeId));
        group.classList.toggle("is-active", isActive);
        group.style.opacity = isActive ? "1" : "0.3";
      });
      // #region debug-point C:active-state
      if (state.scheme === "scheme3" && state.active) {
        reportDebugEvent("C", "applyActiveState", "applied active state", {
          activeEdgeCount: state.active.edgeIds.size,
          activeNodeCount: state.active.nodeIds.size
        });
      }
      // #endregion

      nodeGroups.forEach((group) => {
        const nodeId = group.getAttribute("data-node-id");
        const isActive = state.active.nodeIds.has(nodeId);
        const isSelected = state.selectedActive?.kind === "node" && state.selectedActive.key === nodeId;
        group.classList.toggle("is-selected", isSelected);
        group.classList.toggle("is-active", isActive);
        if (isActive && activeNodeLayer) {
          activeNodeLayer.appendChild(group);
        } else if (nodeLayer) {
          nodeLayer.appendChild(group);
        }
      });
    }

    function render(options = {}) {
      const { resetDrawer = true } = options;
      if (resetDrawer) {
        closeAggregateDrawer();
      }
      schemeSelect.value = state.scheme === "scheme5" ? "scheme5" : "scheme2";
      pastSchemeSelect.value = ["scheme1", "scheme3", "scheme4"].includes(state.scheme) ? state.scheme : "";
      svg.dataset.scheme = state.scheme;
      svg.dataset.nodeDefaultShadow = String(state.nodeOptions.defaultShadow);
      svg.dataset.nodeHoverEffect = String(state.nodeOptions.hoverEffect);
      syncNodeOptionPanel();
      state.graph = buildGraph(state.mode);
      syncMigrationCase3DrillControls();
      syncSvgSize();
      destroyTooltips();
      clearElement(viewportLayer);
      state.active = null;
      state.hoverActive = null;
      state.selectedActive = null;

      const graphRoot = createSvg("g");
      viewportLayer.appendChild(graphRoot);

      const labelLayer = createSvg("g");
      const backdropGroup = createSvg("g", { "data-layer": "backdrop-group", class: "layer-backdrop" });
      const foregroundGroup = createSvg("g", { "data-layer": "foreground-group" });
      const edgeLayer = createSvg("g", { "data-layer": "edge-base" });
      const tagLayer = createSvg("g", { "data-layer": "tag-base" });
      const nodeLayer = createSvg("g", { "data-layer": "node-base" });
      const activeEdgeLayer = createSvg("g", { "data-layer": "edge-active" });
      const activeTagLayer = createSvg("g", { "data-layer": "tag-active" });
      const activeNodeLayer = createSvg("g", { "data-layer": "node-active" });

      graphRoot.appendChild(labelLayer);
      graphRoot.appendChild(backdropGroup);
      graphRoot.appendChild(foregroundGroup);
      backdropGroup.appendChild(edgeLayer);
      backdropGroup.appendChild(nodeLayer);
      foregroundGroup.appendChild(activeEdgeLayer);
      foregroundGroup.appendChild(tagLayer);
      foregroundGroup.appendChild(activeTagLayer);
      foregroundGroup.appendChild(activeNodeLayer);

      renderLayerLabels(labelLayer, state.graph.dataset.layers, state.graph.dataset.canvas.width);
      renderOrbitRing(labelLayer, state.graph.orbitRing);
      state.graph.edges.forEach((edge) => renderEdge(edgeLayer, tagLayer, edge));
      state.graph.nodeMap.forEach((node) => renderNode(nodeLayer, node));
      layoutTagsOnEdges(graphRoot, state.graph.edges);
      initTagTooltips(graphRoot);

      updateBudgetTableView();
      syncTopologyView(state.view);
      fitView();
      syncActiveState();
    }

    function switchMode(modeKey) {
      clearSelectedState();
      hideAggregateDrawerForDataSwitch();
      state.budgetTableFocus = null;
      state.migrationCase3FocusId = null;
      state.mode = modeKey;
      if (["migrationCase1", "migrationCase2", "migrationCase3"].includes(modeKey)) {
        state.scheme = "scheme5";
      }
      Object.entries(modeButtons).forEach(([key, button]) => {
        if (!button) {
          return;
        }
        button.classList.toggle("is-active", key === modeKey);
      });
      render({ resetDrawer: false });
    }

    topologyBackGlobal?.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
    });

    topologyBackGlobal?.addEventListener("click", (event) => {
      event.stopPropagation();
      state.migrationCase3FocusId = null;
      state.budgetTableFocus = null;
      clearSelectedState();
      hideAggregateDrawerForDataSwitch();
      render({ resetDrawer: false });
    });

    Object.entries(modeButtons).forEach(([modeKey, button]) => {
      if (!button) {
        return;
      }
      button.addEventListener("click", () => switchMode(modeKey));
    });

    dataConfigInputs.forEach((input) => {
      input.addEventListener("change", () => {
        syncDataConfigFromInputs();
        syncDataConfigVisibility();
        clearSelectedState();
        hideAggregateDrawerForDataSwitch();
        state.budgetTableFocus = null;
        state.migrationCase3FocusId = null;
        state.mode = getModeFromDataConfig();
        state.scheme = "scheme5";
        render({ resetDrawer: false });
      });
    });

    viewTabButtons.forEach((button) => {
      button.addEventListener("click", () => {
        state.budgetTableFocus = null;
        syncTopologyView(button.dataset.viewKey);
      });
    });

    schemeSelect.addEventListener("change", (event) => {
      state.scheme = event.target.value;
      render();
    });

    pastSchemeSelect.addEventListener("change", (event) => {
      if (!event.target.value) {
        return;
      }
      state.scheme = event.target.value;
      render();
    });

    nodeOptionInputs.forEach((input) => {
      input.addEventListener("change", () => {
        state.nodeOptions[input.dataset.nodeOption] = input.checked;
        render();
      });
    });

    nodeOptionPanel.addEventListener("pointerdown", (event) => {
      event.stopPropagation();
    });

    nodeOptionPanel.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    aggregateDrawerClose.addEventListener("click", collapseAggregateDrawer);

    drawerResizer?.addEventListener("pointerenter", () => {
      drawerResizer.classList.add("is-hovering");
    });

    drawerResizer?.addEventListener("pointerleave", () => {
      drawerResizer.classList.remove("is-hovering");
    });

    drawerResizer?.addEventListener("pointerdown", (event) => {
      if (aggregateDrawer.classList.contains("is-collapsed")) {
        return;
      }

      event.preventDefault();
      state.drawerResizing = true;
      state.drawerResizeOrigin = {
        x: event.clientX,
        ratio: state.drawerRatio
      };
      drawerResizer.setPointerCapture?.(event.pointerId);
      drawerResizer.classList.add("is-dragging");
      card?.classList.add("is-resizing-drawer");
    });

    drawerResizer?.addEventListener("keydown", (event) => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) {
        return;
      }

      event.preventDefault();
      if (event.key === "Home") {
        applyDrawerWidthRatio(1 / 3);
        return;
      }
      if (event.key === "End") {
        applyDrawerWidthRatio(2 / 3);
        return;
      }
      applyDrawerWidthRatio(state.drawerRatio + (event.key === "ArrowLeft" ? 0.02 : -0.02));
    });

    aggregateDrawer.addEventListener("click", (event) => {
      const detailTab = event.target.closest("[data-drawer-detail-tab]");
      if (detailTab) {
        const tabsRoot = detailTab.closest("[data-drawer-detail-tabs]");
        const nextTab = detailTab.dataset.drawerDetailTab;
        tabsRoot?.querySelectorAll("[data-drawer-detail-tab]").forEach((tab) => {
          const isActive = tab.dataset.drawerDetailTab === nextTab;
          tab.classList.toggle("is-active", isActive);
          tab.setAttribute("aria-selected", String(isActive));
        });
        tabsRoot?.querySelectorAll("[data-drawer-detail-panel]").forEach((panel) => {
          panel.classList.toggle("is-active", panel.dataset.drawerDetailPanel === nextTab);
        });
        return;
      }

      const amountTarget = event.target.closest(".aggregate-table-amount, .tod-drawer-table-amount");
      if (amountTarget) {
        const unitKey = amountTarget.dataset.budgetUnitKey || "";
        const tab = amountTarget.dataset.budgetTab === "income" ? "income" : "cost";
        state.budgetTableFocus = unitKey ? { unitKey, tab } : null;
        syncTopologyView("table");
        window.dispatchEvent(new CustomEvent("topology-view:set", { detail: { view: "table" } }));
        return;
      }

      if (event.target === aggregateDrawer) {
        closeAggregateDrawer();
      }
    });

    budgetTableView?.addEventListener("change", (event) => {
      const select = event.target.closest("[data-budget-table-select]");
      if (!select) {
        return;
      }
      state.budgetTableFocus = { unitKey: select.value, tab: state.budgetTableFocus?.tab || "cost" };
      updateBudgetTableView();
    });

    budgetTableView?.addEventListener("click", (event) => {
      const tabButton = event.target.closest("[data-budget-table-tab]");
      if (!tabButton) {
        return;
      }
      const payload = buildBudgetTablePayload();
      const unitKey = payload.selectedKey || payload.options?.[0]?.key || "";
      state.budgetTableFocus = { unitKey, tab: tabButton.dataset.budgetTableTab === "income" ? "income" : "cost" };
      updateBudgetTableView();
    });

    window.addEventListener("topology-view:set", (event) => {
      syncTopologyView(event.detail?.view);
    });

    window.addEventListener("topology-view:change", (event) => {
      syncTopologyView(event.detail?.view);
    });

    document.getElementById("zoom-in").addEventListener("click", () => {
      const rect = svg.getBoundingClientRect();
      zoomAt(1.15, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    document.getElementById("zoom-out").addEventListener("click", () => {
      const rect = svg.getBoundingClientRect();
      zoomAt(0.87, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    document.getElementById("zoom-fit").addEventListener("click", fitView);

    svg.addEventListener("wheel", (event) => {
      event.preventDefault();
      const factor = event.deltaY < 0 ? 1.1 : 0.9;
      zoomAt(factor, event.clientX, event.clientY);
    }, { passive: false });

    svg.addEventListener("pointerdown", (event) => {
      const nodeGroup = event.target.closest("[data-node-id]");
      if (nodeGroup) {
        state.nodePointerOrigin = {
          nodeId: nodeGroup.dataset.nodeId,
          x: event.clientX,
          y: event.clientY
        };
        return;
      }

      if (event.target.closest("[data-edge-id]")) {
        return;
      }

      state.nodePointerOrigin = null;
      clearSelectedState();
      state.dragging = true;
      state.dragOrigin = {
        x: event.clientX,
        y: event.clientY,
        cameraX: state.camera.x,
        cameraY: state.camera.y
      };
      svg.classList.add("is-dragging");
    });

    window.addEventListener("pointermove", (event) => {
      if (state.drawerResizing && state.drawerResizeOrigin) {
        const availableWidth = getDrawerResizableAreaWidth();
        if (availableWidth > 0) {
          const deltaX = event.clientX - state.drawerResizeOrigin.x;
          applyDrawerWidthRatio(state.drawerResizeOrigin.ratio - deltaX / availableWidth);
        }
        return;
      }

      if (!state.dragging || !state.dragOrigin) {
        return;
      }

      state.camera.x = state.dragOrigin.cameraX + (event.clientX - state.dragOrigin.x);
      state.camera.y = state.dragOrigin.cameraY + (event.clientY - state.dragOrigin.y);
      applyCamera();
    });

    window.addEventListener("pointerup", (event) => {
      if (state.drawerResizing) {
        state.drawerResizing = false;
        state.drawerResizeOrigin = null;
        drawerResizer?.releasePointerCapture?.(event.pointerId);
        drawerResizer?.classList.remove("is-dragging");
        card?.classList.remove("is-resizing-drawer");
        return;
      }

      if (state.nodePointerOrigin) {
        const nodePointerOrigin = state.nodePointerOrigin;
        state.nodePointerOrigin = null;
        const upNodeGroup = event.target.closest("[data-node-id]");
        const moveDistance = Math.hypot(
          event.clientX - nodePointerOrigin.x,
          event.clientY - nodePointerOrigin.y
        );

        if (upNodeGroup?.dataset.nodeId === nodePointerOrigin.nodeId && moveDistance <= 8) {
          activateNodeById(nodePointerOrigin.nodeId);
        }
      }

      state.dragging = false;
      state.dragOrigin = null;
      svg.classList.remove("is-dragging");
    });

    svg.addEventListener("mouseleave", () => {
      if (!state.dragging) {
        clearHoverState();
      }
    });

    window.addEventListener("resize", () => {
      if (card?.classList.contains("has-open-drawer")) {
        applyDrawerWidthRatio(state.drawerRatio);
      } else {
        fitView();
      }
    });

    syncDataConfigFromInputs();
    syncDataConfigVisibility();
    state.mode = getModeFromDataConfig();
    render();
  </script>
</body>
</html>
