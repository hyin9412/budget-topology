<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topology Routing Demo</title>
  <link rel="stylesheet" href="./vendor/tippy.css" />
  <script type="module" src="/src/tod-styles.ts"></script>
  <script type="module" src="/src/tod-drawer-summary.tsx"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-border: #e5e8ef;
      --header-bg: #0b0e13;
      --header-text: #f5f7fa;
      --text: #1f2329;
      --muted: #6b7280;
      --line: #d6dde8;
      --line-hover: #c2ccd9;
      --line-active: #1890ff;
      --node-border: #cfd7e3;
      --node-fill: #ffffff;
      --node-start: #1664ff;
      --node-accent: #1890ff;
      --tag-positive-bg: #fff1f0;
      --tag-positive-border: #ffb5ad;
      --tag-positive-text: #cf4d40;
      --tag-negative-bg: #edf8ee;
      --tag-negative-border: #a9d7b4;
      --tag-negative-text: #2d8d52;
      --dim-opacity: 0.3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: var(--text);
      font-family: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    .page {
      display: flex;
      justify-content: center;
      background: #ffffff;
      padding: 24px;
    }

    .page-shell {
      width: min(1260px, calc(100vw - 48px));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .page-topbar {
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .scheme-switch {
      display: inline-flex;
      align-items: stretch;
      min-width: 320px;
      height: 32px;
      border-radius: 4px;
      background: #ffffff;
      box-shadow: 0 0 0 1px #dde2e9;
      overflow: hidden;
    }

    .scheme-label {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      align-self: stretch;
      border-right: 1px solid #dde2e9;
      background: #ffffff;
      padding: 5px 12px;
      color: #42464e;
      font-size: 13px;
      line-height: 22px;
      letter-spacing: 0.04px;
    }

    .scheme-select-wrap {
      position: relative;
      display: flex;
      flex: 1;
      align-items: center;
      background: #ffffff;
    }

    .scheme-select {
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      padding: 5px 32px 5px 12px;
      color: #42464e;
      font-size: 13px;
      line-height: 22px;
      letter-spacing: 0.04px;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .scheme-select:focus {
      box-shadow: inset 0 0 0 1px #1664ff;
    }

    .scheme-select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      width: 12px;
      height: 12px;
      transform: translateY(-50%);
      color: #737a87;
      font-size: 12px;
      line-height: 12px;
      pointer-events: none;
    }

    .card {
      --drawer-divider-width: 1px;
      --drawer-resizer-hit-width: 17px;
      --topology-pane-width: calc((100% - var(--drawer-divider-width)) / 2);
      --drawer-width: calc((100% - var(--drawer-divider-width)) / 2);
      width: 100%;
      display: flex;
      align-items: stretch;
      height: 600px;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
    }

    .topology-pane {
      display: flex;
      flex: 1 1 0;
      min-width: 0;
      flex-direction: column;
      align-self: stretch;
    }

    .card.has-open-drawer .topology-pane {
      flex: 0 0 var(--topology-pane-width);
    }

    .drawer-resizer {
      position: relative;
      display: none;
      z-index: 2;
      flex: 0 0 var(--drawer-resizer-hit-width);
      align-self: stretch;
      border: 0;
      margin: 0 -8px;
      background: transparent;
      padding: 0;
      cursor: col-resize;
      touch-action: none;
    }

    .card.has-open-drawer .drawer-resizer {
      display: block;
    }

    .drawer-resizer::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: #eaedf1;
      transform: translateX(-50%);
      transition: width 0.14s ease, background 0.14s ease;
    }

    .drawer-resizer:hover,
    .drawer-resizer:focus-visible,
    .drawer-resizer.is-hovering,
    .drawer-resizer.is-dragging {
      outline: none;
    }

    .drawer-resizer:hover::before,
    .drawer-resizer:focus-visible::before,
    .drawer-resizer.is-hovering::before,
    .drawer-resizer.is-dragging::before {
      width: 2px;
      background: #1664ff;
    }

    .card.is-resizing-drawer,
    .card.is-resizing-drawer * {
      cursor: col-resize !important;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid #eaedf1;
      padding: 7px 15px 8px;
      min-height: 40px;
      background: #ffffff;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .title {
      color: #020814;
      font-size: 14px;
      line-height: 22px;
      font-weight: 500;
      letter-spacing: 0.04px;
      white-space: nowrap;
    }

    .subtitle {
      display: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 16px;
    }

    .topbar-control-row {
      display: flex;
      order: 1;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .demo-config-panel {
      display: flex;
      order: 3;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #dde2e9;
      border-radius: 8px;
      background: #ffffff;
      padding: 12px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    .demo-config-head {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }

    .demo-config-title {
      color: #020814;
      font-size: 14px;
      line-height: 22px;
      font-weight: 500;
      letter-spacing: 0.04px;
    }

    .demo-config-hint {
      color: #737a87;
      font-size: 12px;
      line-height: 20px;
    }

    .demo-config-groups {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
    }

    .demo-config-group {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 32px;
      border-radius: 6px;
      background: #f7f8fa;
      padding: 6px 8px;
    }

    .demo-config-group[hidden] {
      display: none;
    }

    .demo-config-label {
      flex-shrink: 0;
      color: #42464e;
      font-size: 12px;
      line-height: 20px;
      font-weight: 500;
      white-space: nowrap;
    }

    .demo-config-options {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .demo-config-choice {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-width: 48px;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      padding: 2px 9px;
      color: #42464e;
      font-size: 12px;
      line-height: 20px;
      cursor: pointer;
      user-select: none;
      transition: 0.16s ease;
    }

    .demo-config-choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .demo-config-choice:has(input:checked) {
      border-color: rgba(22, 100, 255, 0.18);
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      color: #1664ff;
      font-weight: 500;
    }

    .topology-section-bar {
      display: flex;
      align-items: center;
      column-gap: 16px;
      width: 100%;
      height: 32px;
      padding: 5px 0;
    }

    .topology-section-heading {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      column-gap: 8px;
      height: 19px;
    }

    .topology-section-marker {
      flex-shrink: 0;
      width: 3px;
      height: 16px;
    }

    .topology-section-title {
      flex-shrink: 0;
      color: var(--Fill-color-fill-4, #020814);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 22px;
      letter-spacing: 0.04px;
    }

    .topology-view-tabs {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      min-width: 0;
      height: 19px;
    }

    .topology-view-fallback {
      display: inline-flex;
      align-items: center;
      column-gap: 12px;
      height: 19px;
    }

    .topology-view-tab {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      padding: 0;
      color: #42464e;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 22px;
      letter-spacing: 0.04px;
      cursor: pointer;
    }

    .topology-view-tab.is-active {
      color: #1664ff;
    }

    .topology-view-tab-icon {
      width: 14px;
      height: 14px;
      color: currentColor;
    }

    .topology-view-subordinates-icon {
      display: inline-block;
      flex-shrink: 0;
      background: currentColor;
      -webkit-mask: url("/icon/subordinates.svg") center / contain no-repeat;
      mask: url("/icon/subordinates.svg") center / contain no-repeat;
    }

    .topology-view-separator {
      width: 1px;
      height: 14px;
      background: #d8dce6;
    }

    .topology-view-tab-title {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      line-height: 22px;
      letter-spacing: 0.04px;
    }

    .topology-view-tab-title.is-topology {
      margin: 0;
      border-left: 0;
      padding-left: 0;
    }

    .topology-back-global {
      position: absolute;
      top: 12px;
      left: 15px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
      font-size: 12px;
      line-height: 20px;
      letter-spacing: 0.04px;
    }

    .topology-back-global[hidden] {
      display: none;
    }

    .topology-back-breadcrumb-wrap {
      display: inline-flex;
      align-items: center;
    }

    .topology-back-breadcrumb {
      display: inline-flex;
      align-items: center;
      height: 24px;
      color: #42464e;
    }

    .topology-back-breadcrumb-action {
      border: 0;
      background: transparent;
      padding: 0;
      color: #42464e;
      font: inherit;
      font-weight: 500;
      line-height: inherit;
      cursor: pointer;
    }

    .topology-back-breadcrumb-action:hover {
      color: #1664ff;
    }

    .topology-back-breadcrumb-current {
      color: #737a87;
    }

    .topology-back-breadcrumb-separator {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      padding: 6px 12px 6px 11px;
      overflow: hidden;
    }

    .topology-back-breadcrumb-separator-line {
      display: block;
      border-radius: 1px;
      background: #42464e;
      width: 1px;
      height: 12px;
      transform: rotate(30deg);
    }

    .node-option-panel[hidden] {
      display: none;
    }

    .node-option-panel {
      display: inline-flex;
      order: 2;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 32px;
      border-radius: 4px;
      background: #ffffff;
      box-shadow: 0 0 0 1px #dde2e9;
      padding: 5px 10px;
    }

    .node-option-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #42464e;
      font-size: 12px;
      line-height: 20px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .node-option-item input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: #1664ff;
      cursor: pointer;
    }

    .legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      color: #42464e;
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .legend-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      padding: 0 7px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .legend-chip.positive {
      background: rgba(255, 241, 240, 0.96);
      border-color: rgba(255, 181, 173, 0.9);
      color: var(--tag-positive-text);
    }

    .legend-chip.negative {
      background: rgba(237, 248, 238, 0.96);
      border-color: rgba(169, 215, 180, 0.95);
      color: var(--tag-negative-text);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 1px #cfd7e3;
    }

    .legend-dot.start {
      background: #ffffff;
      box-shadow: inset 0 0 0 1px #3d7dfe, 0 0 0 1px rgba(61, 125, 254, 0.2);
    }

    .legend-dot.start::after {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffffff;
    }

    .legend-node {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 8px;
      height: 8px;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
    }

    .legend-node.start {
      background-image: url("./icon/发起方图例.svg");
    }

    .legend-node.start::after {
      content: none;
    }

    .legend-node.regular {
      background-image: url("./icon/上下游图例.svg");
    }

    .legend-node.regular::after {
      content: none;
    }

    .aggregate-drawer {
      display: flex;
      flex: 1 1 0;
      min-width: 360px;
      align-self: stretch;
      border-left: 1px solid #eaedf1;
      background: #ffffff;
      scroll-margin-block: 16px;
    }

    .card.has-open-drawer .aggregate-drawer {
      flex: 0 0 var(--drawer-width);
      min-width: 0;
      border-left: 0;
    }

    .aggregate-drawer.is-open {
      display: flex;
    }

    .aggregate-drawer.is-collapsed {
      display: none;
    }

    .aggregate-drawer-panel {
      display: flex;
      width: 100%;
      min-width: 0;
      height: auto;
      background: #ffffff;
      flex-direction: column;
    }

    .aggregate-drawer-header {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 40px;
      border-bottom: 1px solid #eaedf1;
      padding: 8px 16px;
      min-height: 40px;
    }

    .aggregate-drawer-heading {
      display: flex;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 8px;
    }

    .aggregate-drawer-title {
      display: inline-flex;
      min-width: 0;
      flex-shrink: 0;
      align-items: center;
      gap: 6px;
      color: #020814;
      font-size: 14px;
      font-weight: 500;
      line-height: 22px;
      letter-spacing: 0.04px;
    }

    .aggregate-drawer-title-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .aggregate-drawer-title-tag {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      height: 20px;
      border: 1px solid rgba(57, 115, 229, 0.2);
      border-radius: 4px;
      background: #ffffff;
      padding: 0 6px;
      color: #3973e5;
      font-size: 12px;
      font-weight: 500;
      line-height: 18px;
    }

    .aggregate-drawer-title-tag.is-demand {
      border-color: rgba(102, 110, 124, 0.2);
      color: #666e7c;
    }

    .aggregate-drawer-title-tag.is-supply {
      border-color: rgba(84, 91, 241, 0.2);
      color: #545bf1;
    }

    .aggregate-drawer-title-tag.is-initiator {
      border-color: rgba(57, 115, 229, 0.2);
      color: #3973e5;
    }

    .aggregate-drawer-subtitle {
      min-width: 0;
      color: #42464e;
      font-size: 13px;
      line-height: 22px;
      letter-spacing: 0.04px;
      white-space: nowrap;
    }

    .aggregate-drawer-close {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #737a87;
      padding: 0;
      cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
    }

    .aggregate-drawer-close:hover {
      background: #f1f3f5;
      color: #42464e;
    }

    .aggregate-drawer-close-icon {
      display: block;
      width: 24px;
      height: 24px;
    }

    .aggregate-drawer-body {
      flex: 1;
      overflow: auto;
      padding: 15px 16px 16px;
    }

    .aggregate-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 0;
      margin-bottom: 16px;
      min-height: 85px;
      overflow: hidden;
      border: 1px solid var(--Line-color-border-2, #eaedf1);
      border-radius: 8px;
      background: var(--Background-color-bg-2, #fcfdfe);
    }

    .aggregate-summary-grid.has-diff {
      grid-template-columns: minmax(0, 172fr) minmax(0, 172fr) minmax(0, 254fr);
    }

    .aggregate-drawer.is-summary-narrow .aggregate-summary-grid,
    .aggregate-drawer.is-summary-narrow .aggregate-summary-grid.has-diff {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

    .aggregate-summary-card {
      border: 0;
      background: transparent;
      padding: 12px 16px;
    }

    .tod-summary-card {
      min-width: 0;
    }

    .tod-summary-card .arco-statistic {
      display: block;
      width: 100%;
    }

    .tod-summary-card .arco-statistic-title {
      margin-bottom: 8px;
      color: var(--Text-color-text-3, #737a87);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.04px;
      white-space: nowrap;
    }

    .tod-summary-card .arco-statistic-content {
      display: flex;
      align-items: flex-start;
      min-width: 0;
      white-space: nowrap;
    }

    .tod-summary-card .arco-statistic-content .arco-statistic-value,
    .tod-summary-card .arco-statistic-content .arco-statistic-value-int,
    .tod-summary-card .arco-statistic-content .arco-statistic-value-decimal {
      color: var(--Text-color-text-1, #0c0d0e);
      font-family: Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 600;
      line-height: 28px;
      letter-spacing: 0;
    }

    .tod-summary-card .arco-statistic-content .arco-statistic-value-suffix {
      margin-left: 2px;
      padding: 7px 0 1px;
      color: var(--Text-color-text-3, #737a87);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.04px;
      white-space: nowrap;
    }

    .aggregate-summary-label {
      color: var(--Text-color-text-3, #737a87);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.04px;
    }

    .aggregate-summary-value {
      display: flex;
      align-items: flex-start;
      gap: 2px;
      color: var(--Text-color-text-1, #0c0d0e);
      font-family: Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 600;
      line-height: 28px;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .aggregate-summary-metric-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 8px;
      min-width: 0;
      white-space: nowrap;
    }

    .aggregate-summary-unit {
      padding: 7px 0 6px;
      color: var(--Text-color-text-3, #737a87);

      justify-content: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 0;
      background: #ffffff;
      color: #4e5969;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .zoom-btn:hover {
      color: var(--line-active);
      background: #f7f9fc;
    }

    .zoom-btn:active {
      background: #f1f3f5;
    }

    .zoom-icon {
      width: 16px;
      height: 16px;
      display: block;
    }

    .grid-line {
      stroke: rgba(15, 23, 42, 0.04);
      stroke-width: 1;
    }

    .grid-line.major {
      stroke: rgba(15, 23, 42, 0.06);
    }

    .edge-group,
    .node-group,
    .tag-group {
      transition: opacity 0.14s ease;
    }

    .layer-backdrop {
      transition: opacity 0.14s ease;
    }

    .edge-route {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.14s ease, stroke-width 0.14s ease, opacity 0.14s ease;
      marker-end: url(#arrow-default);
    }

    .edge-group.is-active .edge-route {
      stroke: var(--line-hover);
      marker-end: url(#arrow-hover);
    }

    .edge-group.is-migration-core .edge-route,
    .edge-group.is-migration-core.is-active .edge-route {
      stroke: #1664ff;
      marker-end: url(#arrow-migration);
    }

    .edge-group.is-migration-core .tag-bg {
      stroke: rgba(22, 100, 255, 0.18);
      fill: #eef4ff;
    }

    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
    }

    .tag-bg {
      fill: #ebf1ff;
      stroke: #6e9fff;
      stroke-width: 1;
      transition: fill 0.14s ease, stroke 0.14s ease, opacity 0.14s ease;
    }

    .tag-underlay {
      fill: #ffffff;
      stroke: none;
    }

    .tag-value {
      fill: #1664ff;
      font-size: 10px;
      font-weight: 500;
      dominant-baseline: middle;
      text-anchor: middle;
      pointer-events: none;
      transition: fill 0.14s ease, opacity 0.14s ease;
    }

    .tag-unit {
      fill: #737a87;
      font-size: 10px;
      font-weight: 400;
      dominant-baseline: middle;
      text-anchor: middle;
      pointer-events: none;
      transition: fill 0.14s ease, opacity 0.14s ease;
    }

    .tag-group.is-error .tag-bg {
      fill: #ffecec;
      stroke: #ff706d;
    }

    .tag-group.is-error .tag-value {
      fill: #d7312a;
    }

    .tag-hit {
      fill: rgba(255, 255, 255, 0.01);
      pointer-events: auto;
      cursor: pointer;
    }

    .tippy-box[data-theme~='topology'] {
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #dbe3ee;
      border-radius: 4px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
      font-size: 12px;
      line-height: 1.5;
    }

    .tippy-box[data-theme~='topology'] .tippy-content {
      padding: 8px 12px;
      white-space: normal;
    }

    .tippy-box[data-theme~='topology'] > .tippy-arrow {
      color: #ffffff;
    }

    .tooltip-lines {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tooltip-line {
      white-space: nowrap;
    }

    .tooltip-amount {
      font-weight: 700;
    }

    .node-tooltip {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .node-tooltip-title {
      color: #42464e;
      font-size: 12px;
      line-height: 20px;
      letter-spacing: 0.04px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
    }

    .node-tooltip-hint {
      color: #737a87;
      font-size: 12px;
      line-height: 20px;
      letter-spacing: 0.04px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
    }

    .node-shadow {
      fill: rgba(24, 144, 255, 0.08);
      opacity: 0;
      transition: opacity 0.14s ease;
      pointer-events: none;
    }

    .node-selection-glow {
      fill: none;
      stroke: rgba(22, 100, 255, 0.2);
      stroke-width: 4;
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(22, 100, 255, 0.2));
      transition: opacity 0.14s ease;
      pointer-events: none;
    }

    .node-group {
      cursor: pointer;
    }

    .node-card {
      fill: var(--node-fill);
      stroke: #dde2e9;
      stroke-width: 1;
      transition: stroke 0.14s ease, stroke-width 0.14s ease, fill 0.14s ease, transform 0.14s ease, filter 0.14s ease;
    }

    .node-group.is-start .node-card {
      stroke: #8eb6ff;
    }

    .node-group.is-initiator .node-card {
      stroke: #1664ff;
      stroke-width: 1.2;
    }

    .node-group.is-initiator .node-title {
      fill: #1664ff;
      font-weight: 500;
    }

    .node-group.is-selected .node-selection-glow {
      opacity: 1;
    }

    .node-group.is-selected .node-card,
    svg[data-scheme="scheme5"] .node-group.is-selected .node-card,
    svg[data-scheme="scheme5"] .node-group.is-migration-aggregate.is-selected .node-card,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-demand.is-selected .node-card,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-supply.is-selected .node-card,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-initiator.is-selected .node-card {
      stroke: #1664ff;
      stroke-width: 2;
    }

    svg[data-scheme="scheme2"][data-node-default-shadow="true"] .node-card,
    svg[data-scheme="scheme4"][data-node-default-shadow="true"] .node-card,
    svg[data-scheme="scheme5"][data-node-default-shadow="true"] .node-card {
      filter: drop-shadow(0px 2px 6px rgba(0, 0, 0, 0.05));
    }

    svg[data-scheme="scheme2"][data-node-hover-effect="true"] .node-group,
    svg[data-scheme="scheme4"][data-node-hover-effect="true"] .node-group,
    svg[data-scheme="scheme5"][data-node-hover-effect="true"] .node-group {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    svg[data-scheme="scheme2"][data-node-hover-effect="true"] .node-card,
    svg[data-scheme="scheme4"][data-node-hover-effect="true"] .node-card,
    svg[data-scheme="scheme5"][data-node-hover-effect="true"] .node-card {
      transition:
        stroke 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        stroke-width 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        fill 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        filter 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    svg[data-scheme="scheme2"][data-node-hover-effect="true"] .node-group.is-active,
    svg[data-scheme="scheme4"][data-node-hover-effect="true"] .node-group.is-active,
    svg[data-scheme="scheme5"][data-node-hover-effect="true"] .node-group.is-active {
      transform: translateY(-2px);
    }

    svg[data-scheme="scheme2"][data-node-hover-effect="true"] .node-group.is-active .node-card,
    svg[data-scheme="scheme4"][data-node-hover-effect="true"] .node-group.is-active .node-card,
    svg[data-scheme="scheme5"][data-node-hover-effect="true"] .node-group.is-active .node-card {
      filter:
        drop-shadow(0px 15px 35px rgba(0, 0, 0, 0.05))
        drop-shadow(0px 5px 15px rgba(0, 0, 0, 0.05));
    }

    .node-title {
      fill: #0c0d0e;
      font-size: 12px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-detail-icon {
      pointer-events: none;
    }

    .node-detail-icon-path {
      fill: #737a87;
      transition: fill 0.14s ease;
    }

    .node-group.is-active .node-detail-icon-path {
      fill: #1664ff;
    }

    .node-meta-label {
      fill: #42464e;
      font-size: 10px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-meta-value {
      fill: #42464e;
      font-size: 10px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-meta-unit {
      fill: #737a87;
      font-size: 10px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-meta-divider,
    .node-meta-strike {
      stroke: #c7ccd6;
      stroke-width: 1;
      shape-rendering: crispEdges;
    }

    .node-meta-divider {
      stroke: #eaedf1;
    }

    .node-meta-tooltip-hit {
      fill: transparent;
      pointer-events: all;
    }

    .node-group.is-aggregate .node-card {
      fill: #f8fbff;
      stroke: #91b9ff;
      stroke-width: 1.2;
    }

    svg[data-scheme="scheme5"] .node-group.is-scheme5-demand .node-card,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-supply .node-card,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-initiator .node-card {
      fill: #ffffff;
      stroke: #dde2e9;
      stroke-width: 1;
    }

    svg[data-scheme="scheme5"] .node-group.is-scheme5-initiator .node-card {
      stroke: #1664ff;
    }

    svg[data-scheme="scheme5"] .node-group.is-scheme5-demand .node-title,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-supply .node-title,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-initiator .node-title {
      fill: #0c0d0e;
      font-weight: 500;
      text-anchor: start;
    }

    svg[data-scheme="scheme5"] .node-group.is-scheme5-demand .node-meta-label,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-supply .node-meta-label,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-initiator .node-meta-label {
      fill: #737a87;
      font-size: 12px;
      text-anchor: start;
    }

    svg[data-scheme="scheme5"] .node-group.is-scheme5-demand .node-meta-value,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-supply .node-meta-value,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-initiator .node-meta-value {
      fill: #42464e;
      font-size: 12px;
    }

    svg[data-scheme="scheme5"] .node-group.is-scheme5-demand .node-meta-strike,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-supply .node-meta-strike,
    svg[data-scheme="scheme5"] .node-group.is-scheme5-initiator .node-meta-strike {
      stroke-dasharray: 2 2;
      stroke-linecap: round;
      shape-rendering: auto;
    }

    .node-role-tag-rect {
      stroke-width: 0;
    }

    .node-role-tag-text {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", SimHei, Arial, Helvetica, sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.03px;
      dominant-baseline: middle;
      text-anchor: middle;
    }

    .node-role-tag.is-demand .node-role-tag-rect {
      fill: #e4f3fc;
    }

    .node-role-tag.is-demand .node-role-tag-text {
      fill: #24758e;
    }

    .node-role-tag.is-initiator .node-role-tag-rect {
      fill: #ebf1ff;
    }

    .node-role-tag.is-initiator .node-role-tag-text {
      fill: #1664ff;
    }

    .node-role-tag.is-supply .node-role-tag-rect {
      fill: #f2eafb;
    }

    .node-role-tag.is-supply .node-role-tag-text {
      fill: #6e4c9f;
    }

    .node-aggregate-title {
      fill: #1664ff;
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-aggregate-total {
      fill: #42464e;
      font-size: 11px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-aggregate-item {
      fill: #42464e;
      font-size: 10px;
      text-anchor: start;
      dominant-baseline: middle;
    }

    .node-aggregate-link {
      fill: #1664ff;
      font-size: 10px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: middle;
      text-decoration: underline;
    }

    svg[data-scheme="scheme5"] .node-group.is-migration-aggregate .node-card {
      fill: #ffffff;
      stroke: #dde2e9;
      stroke-width: 1;
    }

    .node-aggregate-count-rect {
      fill: #eceded;
    }

    .node-aggregate-count-text {
      fill: #42464e;
      font-size: 10px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-aggregate-action {
      fill: #737a87;
      font-size: 12px;
      text-anchor: start;
      dominant-baseline: middle;
      transition: fill 0.14s ease;
    }

    .node-group.is-active .node-aggregate-action {
      fill: #1664ff;
    }

    .node-aggregate-summary-label,
    .node-aggregate-top-title,
    .node-aggregate-top-name,
    .node-aggregate-summary-unit,
    .node-aggregate-top-unit {
      fill: #737a87;
      font-size: 12px;
      text-anchor: start;
      dominant-baseline: middle;
    }

    .node-aggregate-top-title {
      font-weight: 500;
    }

    .node-child-flow-title,
    .node-child-flow-name,
    .node-child-flow-arrow,
    .node-child-flow-unit {
      fill: #737a87;
      font-size: 12px;
      text-anchor: start;
      dominant-baseline: middle;
    }

    .node-child-flow-title {
      font-weight: 500;
    }

    .node-child-flow-arrow {
      fill: #42464e;
      text-anchor: middle;
    }

    .node-aggregate-summary-value,
    .node-aggregate-top-value,
    .node-child-flow-value {
      fill: #42464e;
      font-size: 12px;
      font-weight: 500;
      text-anchor: start;
      dominant-baseline: middle;
    }

    .node-aggregate-top-value,
    .node-aggregate-top-unit,
    .node-child-flow-value,
    .node-child-flow-unit {
      text-anchor: end;
    }

    .node-aggregate-divider {
      stroke: #eaedf1;
      stroke-width: 1;
      shape-rendering: crispEdges;
    }

    .node-aggregate-divider.is-dashed {
      stroke-dasharray: 4 4;
      shape-rendering: auto;
    }

    .orbit-ring {
      fill: none;
      stroke: rgba(24, 144, 255, 0.16);
      stroke-width: 1;
      stroke-dasharray: 6 8;
    }

    @media (max-width: 860px) {
      .page {
        padding: 16px;
      }

      .page-shell,
      .card {
        width: 100%;
      }

      .card {
        height: auto;
        min-height: 600px;
        flex-direction: column;
      }

      .topology-pane {
        min-height: 480px;
      }

      .card.has-open-drawer .topology-pane {
        flex: 1 1 auto;
      }

      .drawer-resizer,
      .card.has-open-drawer .drawer-resizer {
        display: none;
      }

      .aggregate-drawer {
        min-width: 0;
        flex: 1 1 auto;
        border-left: 0;
        border-top: 1px solid #eaedf1;
      }

      .page-topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .scheme-switch,
      .past-scheme-switch {
        width: 100%;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        width: 100%;
        justify-content: flex-start;
      }

      .zoom-panel {
        align-self: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-shell">
      <div class="page-topbar">
          <div class="topbar-control-row">
            <div class="scheme-switch">
              <div class="scheme-label">方案</div>
              <div class="scheme-select-wrap">
                <select id="scheme-select" class="scheme-select" aria-label="选择方案">
                  <option value="scheme2">方案二：弧线连接+高亮</option>
                  <option value="scheme5" selected>方案五：层级聚合+高亮</option>
                </select>
                <span class="scheme-select-arrow">⌄</span>
              </div>
            </div>

            <div class="scheme-switch past-scheme-switch">
              <div class="scheme-label">过往方案</div>
              <div class="scheme-select-wrap">
                <select id="past-scheme-select" class="scheme-select" aria-label="选择过往方案">
                  <option value="">选择过往方案</option>
                  <option value="scheme1">方案一：线上方案+高亮</option>
                  <option value="scheme3">方案三：合计展示重叠金额+高亮</option>
                  <option value="scheme4">方案四：横向层级+高亮</option>
                </select>
                <span class="scheme-select-arrow">⌄</span>
              </div>
            </div>
          </div>

          <section class="demo-config-panel" aria-label="拓扑演示数据配置">
            <div class="demo-config-head">
              <span class="demo-config-title">数据来源配置</span>
              <span class="demo-config-hint">按业务特征生成拓扑图演示数据</span>
            </div>
            <div class="demo-config-groups">
              <div class="demo-config-group">
                <span class="demo-config-label">是否平移场景</span>
                <div class="demo-config-options">
                  <label class="demo-config-choice">
                    <input type="radio" name="config-migration-scene" data-data-config="migrationScene" value="true" />
                    <span>是</span>
                  </label>
                  <label class="demo-config-choice">
                    <input type="radio" name="config-migration-scene" data-data-config="migrationScene" value="false" checked />
                    <span>否</span>
                  </label>
                </div>
              </div>

              <div class="demo-config-group" data-config-scope="migration">
                <span class="demo-config-label">是否多个发起方</span>
                <div class="demo-config-options">
                  <label class="demo-config-choice">
                    <input type="radio" name="config-multiple-initiators" data-data-config="multipleInitiators" value="true" />
                    <span>是</span>
                  </label>
                  <label class="demo-config-choice">
                    <input type="radio" name="config-multiple-initiators" data-data-config="multipleInitiators" value="false" checked />
                    <span>否</span>
                  </label>
                </div>
              </div>

              <div class="demo-config-group" data-config-scope="regular">
                <span class="demo-config-label">是否有二级需求方</span>
                <div class="demo-config-options">
                  <label class="demo-config-choice">
                    <input type="radio" name="config-second-level-demand" data-data-config="hasSecondLevelDemand" value="true" checked />
                    <span>是</span>
                  </label>
                  <label class="demo-config-choice">
                    <input type="radio" name="config-second-level-demand" data-data-config="hasSecondLevelDemand" value="false" />
                    <span>否</span>
                  </label>
                </div>
              </div>

              <div class="demo-config-group" data-config-scope="regular" data-config-show-for-single-migration>
                <span class="demo-config-label">一级需求方个数是否 &gt; 5</span>
                <div class="demo-config-options">
                  <label class="demo-config-choice">
                    <input type="radio" name="config-first-demand-count" data-data-config="firstDemandMoreThan5" value="true" />
                    <span>是</span>
                  </label>
                  <label class="demo-config-choice">
                    <input type="radio" name="config-first-demand-count" data-data-config="firstDemandMoreThan5" value="false" checked />
                    <span>否</span>
                  </label>
                </div>
              </div>

              <div class="demo-config-group" data-config-scope="regular" data-config-requires-second-demand>
                <span class="demo-config-label">二级需求方个数是否 &gt; 5</span>
                <div class="demo-config-options">
                  <label class="demo-config-choice">
                    <input type="radio" name="config-second-demand-count" data-data-config="secondDemandMoreThan5" value="true" checked />
                    <span>是</span>
                  </label>
                  <label class="demo-config-choice">
                    <input type="radio" name="config-second-demand-count" data-data-config="secondDemandMoreThan5" value="false" />
                    <span>否</span>
                  </label>
                </div>
              </div>

              <div class="demo-config-group" data-config-scope="regular" data-config-show-for-single-migration>
                <span class="demo-config-label">一级供给方个数是否 &gt; 5</span>
                <div class="demo-config-options">
                  <label class="demo-config-choice">
                    <input type="radio" name="config-first-supply-count" data-data-config="firstSupplyMoreThan5" value="true" checked />
                    <span>是</span>
                  </label>
                  <label class="demo-config-choice">
                    <input type="radio" name="config-first-supply-count" data-data-config="firstSupplyMoreThan5" value="false" />
                    <span>否</span>
                  </label>
                </div>
              </div>
            </div>
          </section>

          <div id="node-option-panel" class="node-option-panel" hidden>
            <label class="node-option-item">
              <input type="checkbox" id="node-option-detail-icon" data-node-option="detailIcon" checked />
              <span>节点加详情icon</span>
            </label>
            <label class="node-option-item">
              <input type="checkbox" id="node-option-tooltip" data-node-option="tooltip" />
              <span>节点hover出tooltip</span>
            </label>
            <label class="node-option-item">
              <input type="checkbox" id="node-option-default-shadow" data-node-option="defaultShadow" checked />
              <span>节点默认加轻微投影</span>
            </label>
            <label class="node-option-item">
              <input type="checkbox" id="node-option-hover-effect" data-node-option="hoverEffect" checked />
              <span>节点hover后上浮+扩大投影</span>
            </label>
          </div>
      </div>

      <div class="topology-section-bar" aria-label="调整明细视图切换">
        <div class="topology-section-heading">

    function measureTextWidth(text, font = "700 12px Inter") {
      measureContext.font = font;
      return measureContext.measureText(text).width;
    }

    function truncateTextToWidth(text, maxWidth, font = "500 12px Inter") {
      const safeText = String(text || "");
      if (measureTextWidth(safeText, font) <= maxWidth) {
        return safeText;
      }

      const ellipsis = "...";
      const ellipsisWidth = measureTextWidth(ellipsis, font);
      if (ellipsisWidth >= maxWidth) {
        return ellipsis;
      }

      let low = 0;
      let high = safeText.length;

      while (low < high) {
        const middle = Math.ceil((low + high) / 2);
        const candidate = `${safeText.slice(0, middle)}${ellipsis}`;
        if (measureTextWidth(candidate, font) <= maxWidth) {
          low = middle;
        } else {
          high = middle - 1;
        }
      }

      return `${safeText.slice(0, low)}${ellipsis}`;
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    function buildTooltipHtml(rawText) {
      const lines = String(rawText || "")

      const formatTooltipLine = (line) => {

        if (!match) {

        return `${escapeHtml(match[1])}<span class="tooltip-amount">${escapeHtml(match[2])}</span>`;
      };

      return `<div class="tooltip-lines">${lines
        .map((line) => `<div class="tooltip-line">${formatTooltipLine(line)}</div>`)
        .join("")}</div>`;
    }

    function buildPortX(node, count, index) {
      if (count <= 1) {
        return node.x;
      }

      const usable = Math.max(node.width - PORT_INSET * 2, 24);
      const step = usable / (count - 1);
      return node.x - usable / 2 + step * index;
    }

    function buildSidePortY(node, count, index) {
      if (count <= 1) {
        return node.y;
      }

      const gap = 9;
      return node.y + (index - (count - 1) / 2) * gap;
    }

    function buildBiasedPortX(node, side) {
      if (side === "left") {
        return node.x - node.width / 2 + PORT_INSET;
      }

      if (side === "right") {
        return node.x + node.width / 2 - PORT_INSET;
      }

      return node.x;
    }

    function buildPortClearance(node, count) {
      if (count <= 1) {
        return node.width - PORT_INSET * 2;
      }
      return Math.max((node.width - PORT_INSET * 2) / (count - 1), 24);
    }

    function smoothCurvePath(points) {
      const filtered = points.filter((point, index) => {
        if (index === 0) {
          return true;
        }
        const prev = points[index - 1];
        return prev.x !== point.x || prev.y !== point.y;
      });

      if (filtered.length < 2) {
        return "";
      }

      let d = `M ${filtered[0].x} ${filtered[0].y}`;

      if (filtered.length === 2) {
        d += ` L ${filtered[1].x} ${filtered[1].y}`;
        return d;
      }

      const start = filtered[0];
      const end = filtered[filtered.length - 1];
      const next = filtered[1];
      const prev = filtered[filtered.length - 2];

      const startDx = next.x - start.x;
      const startDy = next.y - start.y;
      const endDx = end.x - prev.x;
      const endDy = end.y - prev.y;

      const startLength = Math.hypot(startDx, startDy) || 1;
      const endLength = Math.hypot(endDx, endDy) || 1;
      const totalLength = Math.hypot(end.x - start.x, end.y - start.y);
      const handle = Math.max(22, Math.min(72, totalLength * 0.22));

      const cp1x = start.x + (startDx / startLength) * handle;
      const cp1y = start.y + (startDy / startLength) * handle;
      const cp2x = end.x - (endDx / endLength) * handle;
      const cp2y = end.y - (endDy / endLength) * handle;

      d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${end.x} ${end.y}`;

      return d;
    }

    function buildRoundedOrthogonalPath(points, radius = CORNER_RADIUS) {
      const filtered = points.filter((point, index) => {
        if (index === 0) {
          return true;
        }
        const prev = points[index - 1];
        return prev.x !== point.x || prev.y !== point.y;
      });

      if (filtered.length < 2) {
        return "";
      }

      let d = `M ${filtered[0].x} ${filtered[0].y}`;

      for (let index = 1; index < filtered.length - 1; index += 1) {
        const prev = filtered[index - 1];
        const current = filtered[index];
        const next = filtered[index + 1];
        const inDx = current.x - prev.x;
        const inDy = current.y - prev.y;
        const outDx = next.x - current.x;
        const outDy = next.y - current.y;
        const inLength = Math.hypot(inDx, inDy);
        const outLength = Math.hypot(outDx, outDy);

        if (!inLength || !outLength) {
          continue;
        }

        const sameDirection = (inDx === 0 && outDx === 0) || (inDy === 0 && outDy === 0);
        if (sameDirection) {
          d += ` L ${current.x} ${current.y}`;
          continue;
        }

        const cornerRadius = Math.min(radius, inLength / 2, outLength / 2);
        const before = {
          x: current.x - (inDx / inLength) * cornerRadius,
          y: current.y - (inDy / inLength) * cornerRadius
        };
        const after = {
          x: current.x + (outDx / outLength) * cornerRadius,
          y: current.y + (outDy / outLength) * cornerRadius
        };

        d += ` L ${before.x} ${before.y}`;
        d += ` Q ${current.x} ${current.y} ${after.x} ${after.y}`;
      }

      const end = filtered[filtered.length - 1];
      d += ` L ${end.x} ${end.y}`;

      return d;
    }

      return {

      };
    }

    function parsePlainNumber(rawValue) {

    function getBudgetAdjustmentBreakdown(node, parsedMeta, dataset = state.graph?.dataset) {
      const diffAmount = parsePlainNumber(parsedMeta?.amount);

      if (isMigrationDataset(dataset) && node?.role === "initiator") {
        const sign = node.migrationRole === "out" || node.id === "left-core" ? -1 : 1;
        const cost = (dataset.edges || [])
          .filter((edge) => edge.source === node.id && /-(up|demand)-/.test(edge.target))
          .reduce((sum, edge) => sum + parseAmountNumber(edge.amount), 0);
        const income = (dataset.edges || [])
          .filter((edge) => edge.source === node.id && /-(down|supply)-/.test(edge.target))
          .reduce((sum, edge) => sum + parseAmountNumber(edge.amount), 0);

        return {
          income,
          cost,
          diff: income - cost,
          rate: parsePlainNumber(parsedMeta?.rate),
          sign
        };
      }

      return {
        income: Math.max(diffAmount, 0),
        cost: Math.max(-diffAmount, 0),
        diff: diffAmount,
        rate: parsePlainNumber(parsedMeta?.rate),
        sign: diffAmount < 0 ? -1 : 1
      };
    }

    function buildMetaAmountFormulaTooltip(node, parsedMeta, dataset = state.graph?.dataset) {

    function useSchemeFiveAggregateCardStyle(dataset) {

    function getSchemeFiveAggregateNodeHeight(dataset, detail, useNewAggregateCardStyle) {
      if (!useNewAggregateCardStyle) {
        return 168;
      }

      if (dataset?.label !== "平移情况3") {
        return SCHEME5_MIGRATION_AGGREGATE_HEIGHT;
      }

      const rowCount = Math.min(detail?.topItems?.length || 0, AGGREGATE_TOP_COUNT);
      if (!rowCount) {

      return 120 + (rowCount - 1) * 24;

    function getSchemeFiveAggregateThreshold(dataset) {
      return Number.isFinite(dataset?.aggregateLayerThreshold)
        ? dataset.aggregateLayerThreshold
        : AGGREGATE_LAYER_THRESHOLD;
