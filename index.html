    function renderEdge(edgeLayer, tagLayer, edge) {
      const group = createSvg("g", {
        class: "edge-group",
        "data-edge-id": edge.id
      });

      const route = createSvg("path", {
        d: edge.path,
        class: "edge-route"
      });
      const hit = createSvg("path", {
        d: edge.path,
        class: "edge-hit"
      });

      group.appendChild(route);
      group.appendChild(hit);

      const activate = () => setActiveEdge(edge.id);
      const deactivate = () => clearActiveState();

      group.addEventListener("mouseenter", activate);
      group.addEventListener("mouseleave", deactivate);

      edgeLayer.appendChild(group);

      if (edge.renderTag === false) {
        return;
      }

      const tagGroup = createSvg("g", {
        class: `tag-group ${edge.tagVariant === "error" ? "is-error" : ""}`,
        "data-edge-id": edge.id,
        "data-edge-ids": (edge.tagInteractiveEdgeIds || [edge.id]).join(",")
      });

      const tagX = edge.tagCenter.x - edge.tagWidth / 2;
      const tagY = edge.tagCenter.y - edge.tagHeight / 2;
      const tagUnderlay = createSvg("rect", {
        x: tagX - 2,
        y: tagY - 2,
        width: edge.tagWidth + 4,
        height: edge.tagHeight + 4,
        rx: 5,
        ry: 5,
        "data-tag-part": "underlay",
        class: "tag-underlay"
      });
      const tagRect = createSvg("rect", {
        x: tagX,
        y: tagY,
        width: edge.tagWidth,
        height: edge.tagHeight,
        rx: 3,
        ry: 3,
        "data-tag-part": "body",
        class: "tag-bg"
      });
      const tagValue = createSvg("text", {
        x: edge.tagCenter.x,
        y: edge.tagCenter.y + 0.5,
        "data-tag-part": "value",
        class: "tag-value"
      });
      tagValue.textContent = edge.tagPresentation.valueText;
      const tagHit = createSvg("rect", {
        x: tagX - 4,
        y: tagY - 4,
        width: edge.tagWidth + 8,
        height: edge.tagHeight + 8,
        rx: 6,
        ry: 6,
        class: "tag-hit",
        "data-tag-part": "hit"
      });
      if (edge.tagTooltip) {
        tagHit.setAttribute("data-tooltip-html", buildTooltipHtml(edge.tagTooltip));
      }
      if (state.scheme === "scheme3") {
        tagHit.setAttribute("data-debug-tag", edge.id);
      }

      tagGroup.appendChild(tagUnderlay);
      tagGroup.appendChild(tagRect);
      tagGroup.appendChild(tagValue);

      if (edge.tagPresentation.unitText) {
        const tagUnit = createSvg("text", {
          x: edge.tagCenter.x,
          y: edge.tagCenter.y + 0.5,
          "data-tag-part": "unit",
          class: "tag-unit"
        });
        tagUnit.textContent = edge.tagPresentation.unitText;
        tagGroup.appendChild(tagUnit);
      }
      tagGroup.appendChild(tagHit);

      // #region debug-point B:scheme3-tag-render
      if (state.scheme === "scheme3" && edge.tagTooltip) {
        reportDebugEvent("B", "renderEdge", "rendered scheme3 tooltip tag", {
          edgeId: edge.id,
          targetEdgeIds: edge.tagInteractiveEdgeIds || [edge.id],
          x: Math.round(edge.tagCenter.x),
          y: Math.round(edge.tagCenter.y),
          width: Math.round(edge.tagWidth),
          height: Math.round(edge.tagHeight)
        });
      }
      // #endregion

      const tagActivate = () => {
        // #region debug-point C:tag-hover
        reportDebugEvent("C", "renderEdge:tagActivate", "tag hover entered", {
          edgeId: edge.id,
          hasTooltip: Boolean(edge.tagTooltip),
          hasTippyInstance: Boolean(tagHit._tippy),
          debugTag: tagHit.getAttribute("data-debug-tag") || "",
          rect: {
            x: Math.round(tagHit.getBoundingClientRect().x),
            y: Math.round(tagHit.getBoundingClientRect().y),
            width: Math.round(tagHit.getBoundingClientRect().width),
            height: Math.round(tagHit.getBoundingClientRect().height)
          }
        });
        // #endregion
        const edgeIds = edge.tagInteractiveEdgeIds || [edge.id];
        const nodeIds = new Set();
        edgeIds.forEach((edgeId) => {
          const matchedEdge = state.graph.edges.find((item) => item.id === edgeId);
          if (!matchedEdge) {
            return;
          }
          nodeIds.add(matchedEdge.source);
          nodeIds.add(matchedEdge.target);
        });
        state.active = { edgeIds: new Set(edgeIds), nodeIds };
        applyActiveState();
      };

      const tagDeactivate = () => {
        deactivate();
      };

      tagHit.addEventListener("mouseenter", tagActivate);
      tagHit.addEventListener("mouseleave", tagDeactivate);
      tagLayer.appendChild(tagGroup);
    }

    function renderNode(graphRoot, node) {
      const roleClass = node.role === "start"
        ? "is-start"
        : node.role === "initiator"
          ? "is-initiator"
          : "";
      const group = createSvg("g", {
        class: `node-group ${roleClass}`.trim(),
        "data-node-id": node.id
      });
      const tooltip = createSvg("title");
      tooltip.textContent = node.title;
      group.appendChild(tooltip);

      const shadow = createSvg("rect", {
        x: node.x - node.width / 2 - 4,
        y: node.y - node.height / 2 - 4,
        width: node.width + 8,
        height: node.height + 8,
        rx: 10,
        ry: 10,
        class: "node-shadow"
      });

      const rect = createSvg("rect", {
        x: node.x - node.width / 2,
        y: node.y - node.height / 2,
        width: node.width,
        height: node.height,
        rx: 4,
        ry: 4,
        class: "node-card"
      });

      group.appendChild(shadow);
      group.appendChild(rect);

      const title = createSvg("text", {
        x: node.x,
        y: node.meta ? node.y - 10 : node.y,
        class: "node-title"
      });
      title.textContent = truncateTextToWidth(
        node.title,
        node.width - NODE_TITLE_HORIZONTAL_PADDING * 2,
        '500 12px Inter'
      );
      group.appendChild(title);

      if (node.meta) {
        const parsedMeta = parseNodeMeta(node.meta);

        if (!parsedMeta?.structured) {
          const meta = createSvg("text", {
            x: node.x,
            y: node.y + 10,
            class: "node-meta-label"
          });
          meta.textContent = node.meta;
          group.appendChild(meta);
        } else {
          const labelWidth = measureTextWidth(parsedMeta.label, '400 10px "PingFang SC"');
          const amountWidth = measureTextWidth(parsedMeta.amount, '500 10px Roboto');
          const unitWidth = measureTextWidth("元", '400 10px "PingFang SC"');
          const rateWidth = measureTextWidth(parsedMeta.rate, '500 10px Roboto');
          const percentWidth = measureTextWidth("%", '400 10px "PingFang SC"');
          const dividerGap = 6;
          const inlineGap = 1;
          const prefixGap = 4;
          const suffixGap = 4;
          const totalWidth = labelWidth
            + prefixGap
            + amountWidth
            + unitWidth
            + dividerGap
            + rateWidth
            + percentWidth
            + suffixGap;
          const startX = node.x - totalWidth / 2;
          const rowY = node.y + 10;
          const labelX = startX + labelWidth / 2;
          const amountX = startX + labelWidth + prefixGap + amountWidth / 2;
          const amountUnitX = startX + labelWidth + prefixGap + amountWidth + inlineGap + unitWidth / 2;
          const dividerX = startX + labelWidth + prefixGap + amountWidth + unitWidth + dividerGap / 2;
          const rateX = dividerX + dividerGap / 2 + rateWidth / 2;
          const percentX = dividerX + dividerGap / 2 + rateWidth + inlineGap + percentWidth / 2;

          const label = createSvg("text", {
            x: labelX,
            y: rowY,
            class: "node-meta-label"
          });
          label.textContent = parsedMeta.label;
          group.appendChild(label);

          const amount = createSvg("text", {
            x: amountX,
            y: rowY,
            class: "node-meta-value"
          });
          amount.textContent = parsedMeta.amount;
          group.appendChild(amount);

          const amountUnit = createSvg("text", {
            x: amountUnitX,
            y: rowY,
            class: "node-meta-unit"
          });
          amountUnit.textContent = "元";
          group.appendChild(amountUnit);

          group.appendChild(createSvg("line", {
            x1: amountX - amountWidth / 2 + 1,
            y1: rowY + 6,
            x2: amountUnitX + unitWidth / 2 - 1,
            y2: rowY + 6,
            class: "node-meta-strike"
          }));

          group.appendChild(createSvg("line", {
            x1: dividerX,
            y1: rowY - 5,
            x2: dividerX,
            y2: rowY + 5,
            class: "node-meta-divider"
          }));

          const rate = createSvg("text", {
            x: rateX,
            y: rowY,
            class: "node-meta-value"
          });
          rate.textContent = parsedMeta.rate;
          group.appendChild(rate);

          const percent = createSvg("text", {
            x: percentX,
            y: rowY,
            class: "node-meta-unit"
          });
          percent.textContent = "%";
          group.appendChild(percent);

          group.appendChild(createSvg("line", {
            x1: rateX - rateWidth / 2 + 1,
            y1: rowY + 6,
            x2: percentX + percentWidth / 2 - 1,
            y2: rowY + 6,
            class: "node-meta-strike"
          }));
        }
      }

      group.addEventListener("mouseenter", () => setActiveNode(node.id));
      group.addEventListener("mouseleave", () => clearActiveState());

      graphRoot.appendChild(group);
    }

    function fitView() {
      if (!state.graph) {
        return;
      }

      syncSvgSize();
      const rect = stage.getBoundingClientRect();
      const bounds = state.graph.bounds;
      const padding = 24;
      const width = bounds.maxX - bounds.minX;
      const height = bounds.maxY - bounds.minY;
      const scale = Math.min(
        (rect.width - padding * 2) / width,
        (rect.height - padding * 2) / height
      );

      state.camera.scale = Math.max(0.45, Math.min(scale, 1.12));
      state.camera.x = (rect.width - width * state.camera.scale) / 2 - bounds.minX * state.camera.scale;
      state.camera.y = (rect.height - height * state.camera.scale) / 2 - bounds.minY * state.camera.scale;
      applyCamera();
    }

    function applyCamera() {
      viewportLayer.setAttribute(
        "transform",
        `translate(${state.camera.x} ${state.camera.y}) scale(${state.camera.scale})`
      );
    }

    function syncSvgSize() {
      svg.setAttribute("width", Math.round(stage.clientWidth));
      svg.setAttribute("height", Math.round(stage.clientHeight));
    }

    function zoomAt(factor, clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const anchorX = clientX - rect.left;
      const anchorY = clientY - rect.top;
      const prevScale = state.camera.scale;
      const nextScale = Math.max(0.35, Math.min(prevScale * factor, 2.4));
      const graphX = (anchorX - state.camera.x) / prevScale;
      const graphY = (anchorY - state.camera.y) / prevScale;

      state.camera.scale = nextScale;
      state.camera.x = anchorX - graphX * nextScale;
      state.camera.y = anchorY - graphY * nextScale;
      applyCamera();
    }

    function setActiveEdge(edgeId) {
      const edge = state.graph.edges.find((item) => item.id === edgeId);
      if (!edge) {
        return;
      }

      state.active = {
        edgeIds: new Set([edgeId]),
        nodeIds: new Set([edge.source, edge.target])
      };
      applyActiveState();
    }

    function setActiveNode(nodeId) {
      const nodeIds = new Set([nodeId]);
      const edgeIds = new Set();

      state.graph.edges.forEach((edge) => {
        if (edge.source === nodeId || edge.target === nodeId) {
          edgeIds.add(edge.id);
          nodeIds.add(edge.source);
          nodeIds.add(edge.target);
        }
      });

      state.active = { edgeIds, nodeIds };
      applyActiveState();
    }

    function clearActiveState() {
      if (!state.active) {
        return;
      }
      state.active = null;
      applyActiveState();
    }

    function applyActiveState() {
      const edgeGroups = viewportLayer.querySelectorAll(".edge-group");
      const tagGroups = viewportLayer.querySelectorAll(".tag-group");
      const nodeGroups = viewportLayer.querySelectorAll(".node-group");
      const backdropGroup = viewportLayer.querySelector('[data-layer="backdrop-group"]');
      const edgeLayer = viewportLayer.querySelector('[data-layer="edge-base"]');
      const tagLayer = viewportLayer.querySelector('[data-layer="tag-base"]');
      const nodeLayer = viewportLayer.querySelector('[data-layer="node-base"]');
      const activeEdgeLayer = viewportLayer.querySelector('[data-layer="edge-active"]');
      const activeTagLayer = viewportLayer.querySelector('[data-layer="tag-active"]');
      const activeNodeLayer = viewportLayer.querySelector('[data-layer="node-active"]');

      if (!state.active) {
        if (backdropGroup) {
          backdropGroup.style.opacity = "1";
        }
        edgeGroups.forEach((group) => {
          group.classList.remove("is-active");
          if (edgeLayer) {
            edgeLayer.appendChild(group);
          }
        });
        tagGroups.forEach((group) => {
          group.classList.remove("is-active");
          if (tagLayer) {
            tagLayer.appendChild(group);
          }
        });
        nodeGroups.forEach((group) => {
          group.classList.remove("is-active");
          if (nodeLayer) {
            nodeLayer.appendChild(group);
          }
        });
        return;
      }

      if (backdropGroup) {
        backdropGroup.style.opacity = String(getComputedStyle(document.documentElement).getPropertyValue("--dim-opacity").trim() || 0.3);
      }

      edgeGroups.forEach((group) => {
        const edgeId = group.getAttribute("data-edge-id");
        const isActive = state.active.edgeIds.has(edgeId);
        group.classList.toggle("is-active", isActive);
        if (isActive && activeEdgeLayer) {
          activeEdgeLayer.appendChild(group);
        } else if (edgeLayer) {
          edgeLayer.appendChild(group);
        }
      });

      tagGroups.forEach((group) => {
        const edgeIds = (group.getAttribute("data-edge-ids") || group.getAttribute("data-edge-id") || "")
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
        const isActive = edgeIds.some((edgeId) => state.active.edgeIds.has(edgeId));
        group.classList.toggle("is-active", isActive);
      });
      // #region debug-point C:active-state
      if (state.scheme === "scheme3" && state.active) {
        reportDebugEvent("C", "applyActiveState", "applied active state", {
          activeEdgeCount: state.active.edgeIds.size,
          activeNodeCount: state.active.nodeIds.size
        });
      }
      // #endregion

      nodeGroups.forEach((group) => {
        const nodeId = group.getAttribute("data-node-id");
        const isActive = state.active.nodeIds.has(nodeId);
        group.classList.toggle("is-active", isActive);
        if (isActive && activeNodeLayer) {
          activeNodeLayer.appendChild(group);
        } else if (nodeLayer) {
          nodeLayer.appendChild(group);
        }
      });
    }

    function render() {
      schemeSelect.value = state.scheme;
      state.graph = buildGraph(state.mode);
      syncSvgSize();
      destroyTooltips();
      clearElement(viewportLayer);

      const graphRoot = createSvg("g");
      viewportLayer.appendChild(graphRoot);

      const labelLayer = createSvg("g");
      const backdropGroup = createSvg("g", { "data-layer": "backdrop-group", class: "layer-backdrop" });
      const foregroundGroup = createSvg("g", { "data-layer": "foreground-group" });
      const edgeLayer = createSvg("g", { "data-layer": "edge-base" });
      const tagLayer = createSvg("g", { "data-layer": "tag-base" });
      const nodeLayer = createSvg("g", { "data-layer": "node-base" });
      const activeEdgeLayer = createSvg("g", { "data-layer": "edge-active" });
      const activeTagLayer = createSvg("g", { "data-layer": "tag-active" });
      const activeNodeLayer = createSvg("g", { "data-layer": "node-active" });

      graphRoot.appendChild(labelLayer);
      graphRoot.appendChild(backdropGroup);
      graphRoot.appendChild(foregroundGroup);
      backdropGroup.appendChild(edgeLayer);
      backdropGroup.appendChild(nodeLayer);
      foregroundGroup.appendChild(activeEdgeLayer);
      foregroundGroup.appendChild(tagLayer);
      foregroundGroup.appendChild(activeTagLayer);
      foregroundGroup.appendChild(activeNodeLayer);

      renderLayerLabels(labelLayer, state.graph.dataset.layers, state.graph.dataset.canvas.width);
      renderOrbitRing(labelLayer, state.graph.orbitRing);
      state.graph.edges.forEach((edge) => renderEdge(edgeLayer, tagLayer, edge));
      state.graph.nodeMap.forEach((node) => renderNode(nodeLayer, node));
      layoutTagsOnEdges(graphRoot, state.graph.edges);
      initTagTooltips(graphRoot);

      fitView();
      clearActiveState();
    }

    modeButtons.tree.addEventListener("click", () => {
      state.mode = "tree";
      modeButtons.tree.classList.add("is-active");
      modeButtons.mesh.classList.remove("is-active");
      render();
    });

    modeButtons.mesh.addEventListener("click", () => {
      state.mode = "mesh";
      modeButtons.mesh.classList.add("is-active");
      modeButtons.tree.classList.remove("is-active");
      render();
    });

    schemeSelect.addEventListener("change", (event) => {
      state.scheme = event.target.value;
      render();
    });

    document.getElementById("zoom-in").addEventListener("click", () => {
      const rect = svg.getBoundingClientRect();
      zoomAt(1.15, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    document.getElementById("zoom-out").addEventListener("click", () => {
      const rect = svg.getBoundingClientRect();
      zoomAt(0.87, rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    document.getElementById("zoom-fit").addEventListener("click", fitView);

    svg.addEventListener("wheel", (event) => {
      event.preventDefault();
      const factor = event.deltaY < 0 ? 1.1 : 0.9;
      zoomAt(factor, event.clientX, event.clientY);
    }, { passive: false });

    svg.addEventListener("pointerdown", (event) => {
      if (event.target.closest("[data-edge-id]") || event.target.closest("[data-node-id]")) {
        return;
      }

      state.dragging = true;
      state.dragOrigin = {
        x: event.clientX,
        y: event.clientY,
        cameraX: state.camera.x,
        cameraY: state.camera.y
      };
      svg.classList.add("is-dragging");
    });

    window.addEventListener("pointermove", (event) => {
      if (!state.dragging || !state.dragOrigin) {
        return;
      }

      state.camera.x = state.dragOrigin.cameraX + (event.clientX - state.dragOrigin.x);
      state.camera.y = state.dragOrigin.cameraY + (event.clientY - state.dragOrigin.y);
      applyCamera();
    });

    window.addEventListener("pointerup", () => {
      state.dragging = false;
      state.dragOrigin = null;
      svg.classList.remove("is-dragging");
    });

    svg.addEventListener("mouseleave", () => {
      if (!state.dragging) {
        clearActiveState();
      }
    });

    window.addEventListener("resize", fitView);

    render();
  </script>
</body>
</html>
