          incomingByTarget.get(edge.target).push(edge.source);
          outgoingBySource.get(edge.source).push(edge.target);
        });

        const levelByNodeId = new Map([[initiator.id, 0]]);
        const visit = (startId, adjacency, levelDirection) => {
          const queue = [{ id: startId, depth: 0 }];
          const visited = new Set([startId]);
          while (queue.length) {
            const current = queue.shift();
            (adjacency.get(current.id) || []).forEach((nextId) => {
              if (visited.has(nextId)) {
                return;
              }
              visited.add(nextId);
              const depth = current.depth + 1;
              levelByNodeId.set(nextId, levelDirection * depth);
              queue.push({ id: nextId, depth });
            });
          }
        };

        visit(initiator.id, outgoingBySource, -1);
        visit(initiator.id, incomingByTarget, 1);

        const buckets = new Map();
        nodes.forEach((node) => {
          const level = levelByNodeId.get(node.id) ?? 1;
          if (!buckets.has(level)) {
            buckets.set(level, []);
          }
          buckets.get(level).push(node);
        });

        const levels = Array.from(buckets.keys()).sort((a, b) => a - b);
        const minLevel = levels[0] || 0;
        const layerGap = 430;
        const rowGap = 70;
        const leftPadding = 180;
        const topPadding = 120;
        let maxRows = 1;

        levels.forEach((level) => {
          const bucket = buckets.get(level).sort((a, b) => a.x - b.x || a.y - b.y);
          maxRows = Math.max(maxRows, bucket.length);
          bucket.forEach((node, index) => {
            node.x = leftPadding + (level - minLevel) * layerGap;
            node.y = topPadding + index * rowGap;
          });
        });

        dataset.canvas = {
          width: Math.max(1200, leftPadding * 2 + (levels.length - 1) * layerGap + NODE_WIDTH),
          height: Math.max(760, topPadding * 2 + Math.max(0, maxRows - 1) * rowGap + NODE_WIDTH)
        };
        return;
      }

      const minOriginalX = Math.min(...nodes.map((node) => node.x));
      const maxOriginalX = Math.max(...nodes.map((node) => node.x));
      const minOriginalY = Math.min(...nodes.map((node) => node.y));
      const maxOriginalY = Math.max(...nodes.map((node) => node.y));
      const layerScale = 1.65;
      const crossScale = 0.24;
      const leftPadding = 180;
      const topPadding = 120;

      nodes.forEach((node) => {
        const originalX = node.x;
        const originalY = node.y;
        node.x = leftPadding + (originalY - minOriginalY) * layerScale;
        node.y = topPadding + (originalX - minOriginalX) * crossScale;
      });

      dataset.canvas = {
        width: Math.max(1200, leftPadding * 2 + (maxOriginalY - minOriginalY) * layerScale + NODE_WIDTH),
        height: Math.max(760, topPadding * 2 + (maxOriginalX - minOriginalX) * crossScale + NODE_WIDTH)
      };
    }

    function buildRegularGraphLayoutSchemeFour(dataset, nodeMap, edges) {
      const outgoingMap = new Map();
      const incomingMap = new Map();

      nodeMap.forEach((node) => {
        outgoingMap.set(node.id, []);
        incomingMap.set(node.id, []);
      });

      edges.forEach((edge) => {
        outgoingMap.get(edge.source).push(edge);
        incomingMap.get(edge.target).push(edge);
      });

      outgoingMap.forEach((list, nodeId) => {
        list.sort((a, b) => {
          const nodeA = nodeMap.get(a.target);
          const nodeB = nodeMap.get(b.target);
          if (nodeA.x !== nodeB.x) {
            return nodeA.x - nodeB.x;
          }
          return nodeA.y - nodeB.y;
        });
        nodeMap.get(nodeId).outgoing = list;
      });

      incomingMap.forEach((list, nodeId) => {
        list.sort((a, b) => {
          const nodeA = nodeMap.get(a.source);
          const nodeB = nodeMap.get(b.source);
          if (nodeA.x !== nodeB.x) {
            return nodeA.x - nodeB.x;
          }
          return nodeA.y - nodeB.y;
        });
        nodeMap.get(nodeId).incoming = list;
      });

      const laneGroups = new Map();

      edges.forEach((edge) => {
        const source = nodeMap.get(edge.source);
        const target = nodeMap.get(edge.target);
        const sourceIndex = source.outgoing.findIndex((item) => item.id === edge.id);
        const targetIndex = target.incoming.findIndex((item) => item.id === edge.id);
        const sourcePortCount = source.outgoing.length || 1;
        const targetPortCount = target.incoming.length || 1;
        const isLeftwardFlow = target.x < source.x;
        const sourcePortSide = isLeftwardFlow ? "left" : "right";
        const targetPortSide = isLeftwardFlow ? "right" : "left";

        edge.sourcePortIndex = Math.max(sourceIndex, 0);
        edge.targetPortIndex = Math.max(targetIndex, 0);
        edge.sourcePortCount = sourcePortCount;
        edge.targetPortCount = targetPortCount;
        edge.isLeftwardFlow = isLeftwardFlow;
        edge.sourcePortSide = sourcePortSide;
        edge.targetPortSide = targetPortSide;
        edge.sourcePortX = sourcePortSide === "left"
          ? source.x - source.width / 2
          : source.x + source.width / 2;
        edge.targetPortX = targetPortSide === "left"
          ? target.x - target.width / 2
          : target.x + target.width / 2;
        edge.sourcePortY = source.y;
        edge.targetPortY = target.y;

        const sourceExitX = sourcePortSide === "left"
          ? edge.sourcePortX - EXCLUSIVE_SEGMENT
          : edge.sourcePortX + EXCLUSIVE_SEGMENT;
        const targetEntryX = targetPortSide === "left"
          ? edge.targetPortX - EXCLUSIVE_SEGMENT
          : edge.targetPortX + EXCLUSIVE_SEGMENT;

        edge.sourceExitX = sourceExitX;
        edge.targetEntryX = targetEntryX;

        const corridorKey = [
          Math.round(sourceExitX),
          Math.round(targetEntryX),
          Math.round(Math.min(sourceExitX, targetEntryX)),
          Math.round(Math.max(sourceExitX, targetEntryX))
        ].join(":");

        if (!laneGroups.has(corridorKey)) {
          laneGroups.set(corridorKey, []);
        }
        laneGroups.get(corridorKey).push(edge);
      });

      laneGroups.forEach((group) => {
        group.sort((a, b) => {
          if (a.sourcePortY !== b.sourcePortY) {
            return a.sourcePortY - b.sourcePortY;
          }
          return a.targetPortY - b.targetPortY;
        });

        const laneCount = group.length;

        group.forEach((edge, index) => {
          const sourceExitX = edge.sourceExitX;
          const targetEntryX = edge.targetEntryX;
          const middle = (sourceExitX + targetEntryX) / 2;
          const spread = (index - (laneCount - 1) / 2) * LANE_GAP;
          const laneLeft = Math.min(sourceExitX, targetEntryX) + 10;
          const laneRight = Math.max(sourceExitX, targetEntryX) - 10;

          let laneX = middle + spread;
          if (laneRight >= laneLeft) {
            laneX = Math.max(laneLeft, Math.min(laneRight, laneX));
          } else {
            laneX = middle;
          }

          edge.laneX = laneX;
        });
      });

      edges.forEach((edge) => {
        const source = nodeMap.get(edge.source);
        const target = nodeMap.get(edge.target);

        edge.points = [
          { x: edge.sourcePortX, y: edge.sourcePortY },
          { x: edge.sourceExitX, y: edge.sourcePortY },
          { x: edge.laneX, y: edge.sourcePortY },
          { x: edge.laneX, y: edge.targetPortY },
          { x: edge.targetEntryX, y: edge.targetPortY },
          { x: edge.targetPortX, y: edge.targetPortY }
        ];
        edge.path = smoothCurvePath(edge.points);
        edge.tagPresentation = resolveEdgeTagPresentation(edge);
        edge.tagVariant = edge.tagPresentation.variant;
        edge.tagWidth = edge.tagPresentation.width;
        edge.tagHeight = edge.tagPresentation.height;
        edge.sourceNode = source;
        edge.targetNode = target;
      });

      const tagBoxes = computeEdgeTagBoxes(edges, buildNodeAvoidanceBoxes(nodeMap));

      const bounds = {
        minX: Infinity,
        minY: Infinity,
        maxX: -Infinity,
        maxY: -Infinity
      };

      nodeMap.forEach((node) => {
        bounds.minX = Math.min(bounds.minX, node.x - node.width / 2 - NODE_PADDING_X);
        bounds.minY = Math.min(bounds.minY, node.y - node.height / 2 - NODE_PADDING_X);
        bounds.maxX = Math.max(bounds.maxX, node.x + node.width / 2 + NODE_PADDING_X);
        bounds.maxY = Math.max(bounds.maxY, node.y + node.height / 2 + NODE_PADDING_X);
      });

      edges.forEach((edge) => {
        edge.points.forEach((point) => {
          bounds.minX = Math.min(bounds.minX, point.x);
          bounds.minY = Math.min(bounds.minY, point.y);
          bounds.maxX = Math.max(bounds.maxX, point.x);
          bounds.maxY = Math.max(bounds.maxY, point.y);
        });
      });

      tagBoxes.forEach((box) => {
        bounds.minX = Math.min(bounds.minX, box.left - 8);
        bounds.minY = Math.min(bounds.minY, box.top - 8);
        bounds.maxX = Math.max(bounds.maxX, box.right + 8);
        bounds.maxY = Math.max(bounds.maxY, box.bottom + 8);
      });

      return {
        edges,
        bounds,
        tagBoxes
      };
    }

    function buildSchemeFourGraph(dataset) {
      const schemeDataset = {
        ...dataset,
        canvas: { ...dataset.canvas },
        layers: (dataset.layers || []).map((layer) => ({ ...layer }))
      };
      const nodeMap = normalizeNodes(dataset.nodes);
      const edgeSeed = dataset.edges.map((edge) => ({ ...edge }));

      transformNodeMapForSchemeFour(schemeDataset, nodeMap, edgeSeed);
      const layoutResult = buildRegularGraphLayoutSchemeFour(
        schemeDataset,
        nodeMap,
        edgeSeed.map((edge) => ({ ...edge }))
      );

      return {
        dataset: schemeDataset,
        nodeMap,
        edges: layoutResult.edges,
        bounds: layoutResult.bounds
      };
    }

    function formatLayerName(label) {
      return String(label || "同层级").replace(/\s+/g, "").replace("1级", "一级").replace("2级", "二级");
    }

    function getLayerLevelName(label) {
      const normalized = formatLayerName(label);
      return normalized.includes("二级") ? "二级" : "一级";
    }

    function getSchemeFiveLayerLevelName(dataset, layerIndex, layerLabel, variant) {
      const normalized = formatLayerName(layerLabel);
      if (normalized.includes("二级")) {
        return "二级";
      }
      if (normalized.includes("一级")) {
        return "一级";
      }

      const initiatorLayerIndex = getSchemeFiveInitiatorLayerIndex(dataset);
      if (initiatorLayerIndex < 0) {
        return "一级";
      }

      if (variant === "demand" && layerIndex < initiatorLayerIndex) {
        return initiatorLayerIndex - layerIndex >= 2 ? "二级" : "一级";
      }
      if (variant === "supply" && layerIndex > initiatorLayerIndex) {
        return layerIndex - initiatorLayerIndex >= 2 ? "二级" : "一级";
      }

      return "一级";
    }

    function getSchemeFiveInitiatorLayerIndex(dataset) {
      const initiator = (dataset?.nodes || []).find((node) => node.role === "initiator");
      return initiator ? getNearestLayerIndex(initiator.y, dataset?.layers || []) : -1;
    }

    function getSchemeFiveLayerVariant(dataset, layerIndex, layerLabel) {
      const normalized = formatLayerName(layerLabel);
      if (normalized.includes("上游") || normalized.includes("需求方")) {
        return "demand";
      }
      if (normalized.includes("下游") || normalized.includes("供给方")) {
        return "supply";
      }

      const initiatorLayerIndex = getSchemeFiveInitiatorLayerIndex(dataset);
      if (initiatorLayerIndex >= 0) {
        if (layerIndex < initiatorLayerIndex) {
          return "demand";
        }
        if (layerIndex > initiatorLayerIndex) {
          return "supply";
        }
      }

      return "";
    }

    function getSchemeFiveInitiatorTagText(node, dataset) {
      if (!isMigrationDataset(dataset)) {
        return "发起方";
      }

      if (node.id === "left-core") {
        return "发起方（迁出）";
      }

      if (node.id === "right-core") {
        return "发起方（迁入）";
      }

      if (node.migrationRole === "out") {
        return "发起方（迁出）";
      }

      if (node.migrationRole === "in") {
        return "发起方（迁入）";
      }

      return "发起方";
    }

    function getSchemeFiveNodeVisual(node, dataset) {
      if (!node || node.aggregate) {
        return null;
      }

      if (node.role === "initiator") {
        return {
          variant: "initiator",
          className: "is-scheme5-initiator",
          tagText: getSchemeFiveInitiatorTagText(node, dataset)
        };
      }

      const layers = dataset?.layers || [];
      const layerIndex = node.layerIndex ?? getNearestLayerIndex(node.y, layers);
      const layer = layers[layerIndex] || {};
      const layerVariant = getSchemeFiveLayerVariant(dataset, layerIndex, layer.label);
      const levelName = getSchemeFiveLayerLevelName(dataset, layerIndex, layer.label, layerVariant);

      if (layerVariant === "demand") {
        return {
          variant: "demand",
          className: "is-scheme5-demand",
          tagText: `${levelName}需求方`
        };
      }

      if (layerVariant === "supply") {
        return {
          variant: "supply",
          className: "is-scheme5-supply",
          tagText: `${levelName}供给方`
        };
      }

      return null;
    }

    function getSchemeFiveNodeLayerIndex(node, dataset) {
      if (Number.isFinite(node?.layerIndex)) {
        return node.layerIndex;
      }

      return getNearestLayerIndex(node?.y || 0, dataset?.layers || []);
    }

    function isSchemeFiveEndpointMetaHidden(node, visual, dataset = state.graph?.dataset) {
      if (!visual || !["demand", "supply"].includes(visual.variant) || !dataset) {
        return false;
      }

      const semanticLayerIndexes = (dataset.nodes || [])
        .filter((item) => {
          const itemVisual = getSchemeFiveNodeVisual(item, dataset);
          return itemVisual && ["demand", "supply"].includes(itemVisual.variant);
        })
        .map((item) => getSchemeFiveNodeLayerIndex(item, dataset))
        .filter((layerIndex) => Number.isFinite(layerIndex));

      if (!semanticLayerIndexes.length) {
        return false;
      }

      const minLayerIndex = Math.min(...semanticLayerIndexes);
      const maxLayerIndex = Math.max(...semanticLayerIndexes);
      const nodeLayerIndex = getSchemeFiveNodeLayerIndex(node, dataset);

      return (visual.variant === "demand" && nodeLayerIndex === minLayerIndex)
        || (visual.variant === "supply" && nodeLayerIndex === maxLayerIndex);
    }

    function hasChildBudgetFlows(node) {
      return Array.isArray(node?.childBudgetFlows) && node.childBudgetFlows.length > 0;
    }

    function isChildBudgetFlowDataset(dataset = state.graph?.dataset) {
      return /^平移情况/.test(dataset?.label || "");
    }

    function shouldShowChildBudgetFlows(node, dataset = state.graph?.dataset) {
      return isChildBudgetFlowDataset(dataset) && hasChildBudgetFlows(node);
    }

    function isSingleInitiatorMigrationDataset(dataset = state.graph?.dataset) {
      return dataset?.label === "平移情况1"
        && (dataset?.nodes || []).filter((item) => item.role === "initiator").length === 1;
    }

    function getChildBudgetFlowTopCount(dataset = state.graph?.dataset) {
      return isSingleInitiatorMigrationDataset(dataset)
        ? SINGLE_MIGRATION_CHILD_FLOW_TOP_COUNT
        : CHILD_FLOW_TOP_COUNT;
    }

    function shouldUseSignedChildBudgetFlowAmount(dataset = state.graph?.dataset) {
      return isSingleInitiatorMigrationDataset(dataset);
    }

    function getTopChildBudgetFlows(node, dataset = state.graph?.dataset) {
      return (node?.childBudgetFlows || [])
        .map((flow) => ({
          ...flow,
          amount: Number(flow.amount) || 0
        }))
        .sort((flowA, flowB) => Math.abs(flowB.amount) - Math.abs(flowA.amount))
        .slice(0, getChildBudgetFlowTopCount(dataset));
    }

    function formatChildBudgetFlowAmount(amount, signed = false) {
      const value = Number(amount) || 0;
      const sign = signed && value !== 0 ? (value > 0 ? "+" : "-") : "";
      return `${sign}${Math.abs(value).toFixed(2)}元`;
    }

    function getChildFlowNodeSectionHeight(node, dataset = state.graph?.dataset) {
      const rowCount = getTopChildBudgetFlows(node, dataset).length;
      if (!rowCount) {
        return 0;
      }
      const rowStartOffset = 46;
      const rowGap = 20;
      const bottomPadding = 14;
      return rowStartOffset + (rowCount - 1) * rowGap + bottomPadding;
    }

    function getSchemeFiveNodeLayout(node, visual, showMeta, dataset = state.graph?.dataset) {
      if (!visual) {
        return null;
      }

      const top = node.y - node.height / 2;
      const left = node.x - node.width / 2;
      let cursorY = top + SCHEME5_NODE_PADDING_Y;
      const layout = {
        left,
        top,
        contentX: left + SCHEME5_NODE_PADDING_X,
        contentWidth: node.width - SCHEME5_NODE_PADDING_X * 2,
        tagX: left + SCHEME5_NODE_PADDING_X,
        tagY: cursorY,
        tagHeight: SCHEME5_NODE_TAG_HEIGHT,
        iconX: left + node.width - SCHEME5_NODE_PADDING_X - SCHEME5_NODE_DETAIL_ICON_SIZE,
        iconY: cursorY + (SCHEME5_NODE_TAG_HEIGHT - SCHEME5_NODE_DETAIL_ICON_SIZE) / 2,
        titleY: cursorY + SCHEME5_NODE_TEXT_ROW_HEIGHT / 2,
        metaY: null,
        childFlowStartY: null
      };

      if (visual.tagText) {
        cursorY += SCHEME5_NODE_TAG_HEIGHT + SCHEME5_NODE_ROW_GAP;
      }

      layout.titleY = cursorY + SCHEME5_NODE_TEXT_ROW_HEIGHT / 2;
      cursorY += SCHEME5_NODE_TEXT_ROW_HEIGHT;

      if (showMeta) {
        cursorY += SCHEME5_NODE_ROW_GAP;
        layout.metaY = cursorY + SCHEME5_NODE_TEXT_ROW_HEIGHT / 2;
        cursorY += SCHEME5_NODE_TEXT_ROW_HEIGHT;
      }

      if (shouldShowChildBudgetFlows(node, dataset)) {
        cursorY += CHILD_FLOW_NODE_EXTRA_TOP_GAP;
        layout.childFlowStartY = cursorY;
      }

      return layout;
    }

    function getSchemeFiveNodeHeight(node, visual, showMeta, dataset = state.graph?.dataset) {
      if (!visual) {
        return null;
      }

      let height = SCHEME5_NODE_PADDING_Y * 2 + SCHEME5_NODE_TEXT_ROW_HEIGHT;
      if (visual.tagText) {
        height += SCHEME5_NODE_TAG_HEIGHT + SCHEME5_NODE_ROW_GAP;
      }
      if (showMeta) {
        height += SCHEME5_NODE_ROW_GAP + SCHEME5_NODE_TEXT_ROW_HEIGHT;
      }
      if (shouldShowChildBudgetFlows(node, dataset)) {
        height += CHILD_FLOW_NODE_EXTRA_TOP_GAP + getChildFlowNodeSectionHeight(node, dataset);
      }
      return height;
    }

    function applySchemeFiveNodeMetrics(dataset) {
      dataset.nodes.forEach((node) => {
        const visual = getSchemeFiveNodeVisual(node, dataset);
        if (!visual) {
          return;
        }

        const showMeta = Boolean(node.meta) && !isSchemeFiveEndpointMetaHidden(node, visual, dataset);
        node.width = NODE_WIDTH;
        node.height = getSchemeFiveNodeHeight(node, visual, showMeta, dataset);
        node.__autoHeight = true;
      });
    }

    function alignSchemeFiveLayersByGap(dataset, nodeMap) {
      if (!dataset.layers?.length) {
        return;
      }

      const buckets = dataset.layers.map(() => []);
      nodeMap.forEach((node) => {
        const layerIndex = getNearestLayerIndex(node.y, dataset.layers);
        node.layerIndex = layerIndex;
        buckets[layerIndex].push(node);
      });

      let previousCenterY = null;
      let previousLayerHeight = 0;

      dataset.layers.forEach((layer, layerIndex) => {
        const nodes = buckets[layerIndex];
        const layerHeight = nodes.length
          ? Math.max(...nodes.map((node) => node.height))
          : 0;
        const centerY = previousCenterY === null
          ? layer.y
          : previousCenterY + previousLayerHeight / 2 + SCHEME5_LAYER_VERTICAL_GAP + layerHeight / 2;

        layer.y = centerY;
        nodes.forEach((node) => {
          node.y = centerY;
        });

        previousCenterY = centerY;
        previousLayerHeight = layerHeight;
      });
    }

    function alignSchemeFiveOddNodeLayersToInitiator(dataset, nodeMap) {
      if (!dataset.layers?.length) {
        return;
      }

      const initiator = Array.from(nodeMap.values()).find((node) => node.role === "initiator");
      if (!initiator) {
        return;
      }

      const buckets = dataset.layers.map(() => []);
      nodeMap.forEach((node) => {
        const layerIndex = getNearestLayerIndex(node.y, dataset.layers);
        node.layerIndex = layerIndex;
        buckets[layerIndex].push(node);
      });

      buckets.forEach((nodes, layerIndex) => {
        if (!nodes.length || nodes.length % 2 === 0 || nodes.length > 5) {
          return;
        }

        const layer = dataset.layers[layerIndex] || {};
        const layerVariant = getSchemeFiveLayerVariant(dataset, layerIndex, layer.label || "");
        if (!["demand", "supply"].includes(layerVariant)) {
          return;
        }

        nodes.sort((nodeA, nodeB) => nodeA.x - nodeB.x);
        const anchorIndex = Math.floor(nodes.length / 2);
        const nextXs = resolveLayerPositionsForAnchor(
          nodes,
          anchorIndex,
          initiator.x,
          dataset.canvas.width
        );

        if (!nextXs) {
          return;
        }

        nodes.forEach((node, index) => {
          node.x = nextXs[index];
        });
      });
    }

    function alignMigrationCase2TreeGap(dataset, nodeMap) {
      if (!isMigrationDataset(dataset)) {
        return;
      }

      const leftCore = nodeMap.get("left-core");
      const rightCore = nodeMap.get("right-core");
      if (!leftCore || !rightCore) {
        return;
      }

      const centerX = ((dataset.canvas?.width || 0) / 2) || (leftCore.x + rightCore.x) / 2;
      const centerDistance = NODE_WIDTH + MIGRATION_CASE2_GROUP_GAP;
      const leftX = centerX - centerDistance / 2;
      const rightX = centerX + centerDistance / 2;

      nodeMap.forEach((node) => {
        if (node.id === "left-core" || node.aggregateGroup?.startsWith("left-")) {
          node.x = leftX;
        }
        if (node.id === "right-core" || node.aggregateGroup?.startsWith("right-")) {
          node.x = rightX;
        }
      });
    }

    function renderNodeRoleTag(group, node, visual, layout) {
      if (!visual?.tagText) {
        return;
      }

      const tagWidth = measureTextWidth(visual.tagText, NODE_ROLE_TAG_FONT) + NODE_ROLE_TAG_HORIZONTAL_PADDING * 2;
      const tag = createSvg("g", {
        class: `node-role-tag is-${visual.variant}`
      });

      tag.appendChild(createSvg("rect", {
        x: layout.tagX,
        y: layout.tagY,
        width: tagWidth,
        height: layout.tagHeight,
        rx: 4,
        ry: 4,
        class: "node-role-tag-rect"
      }));

      const text = createSvg("text", {
        x: layout.tagX + tagWidth / 2,
        y: layout.tagY + layout.tagHeight / 2 + 0.5,
        class: "node-role-tag-text"
      });
      text.textContent = visual.tagText;
      tag.appendChild(text);
      group.appendChild(tag);
    }

    function renderSchemeFiveDetailIcon(group, layout) {
      if (!layout) {
        return;
      }

      renderDetailIcon(group, layout.iconX, layout.iconY, SCHEME5_NODE_DETAIL_ICON_SIZE);
    }

    function getAggregateNodeAmount(nodeId, edges) {
      return edges.reduce((sum, edge) => {
        if (edge.source !== nodeId && edge.target !== nodeId) {
          return sum;
        }
        return sum + parseAmountNumber(edge.amount);
      }, 0);
    }

    function getAggregateDirectRelations(nodeId, aggregateNodeIds, rawEdges, rawNodeById, dataset) {
      const upstreamTitles = [];
      const downstreamTitles = [];
      const layers = dataset?.layers || [];
      const currentNode = rawNodeById.get(nodeId);
      const currentLayerIndex = currentNode && layers.length
        ? getNearestLayerIndex(currentNode.y || 0, layers)
        : -1;

      rawEdges.forEach((edge) => {
        const relatedId = edge.source === nodeId
          ? edge.target
          : edge.target === nodeId
            ? edge.source
            : "";

        if (!relatedId || aggregateNodeIds.has(relatedId)) {
          return;
        }

        const relatedNode = rawNodeById.get(relatedId);
        if (!relatedNode) {
          return;
        }

        if (currentLayerIndex >= 0 && layers.length) {
          const relatedLayerIndex = getNearestLayerIndex(relatedNode.y || 0, layers);
          if (relatedLayerIndex < currentLayerIndex) {
            upstreamTitles.push(relatedNode.title);
            return;
          }
          if (relatedLayerIndex > currentLayerIndex) {
            downstreamTitles.push(relatedNode.title);
            return;
          }
        }

        if (edge.target === nodeId) {
          upstreamTitles.push(relatedNode.title);
          return;
        }
        if (edge.source === nodeId) {
          downstreamTitles.push(relatedNode.title);
          return;
        }
      });

      const uniqueUpstreamTitles = Array.from(new Set(upstreamTitles));
      const uniqueDownstreamTitles = Array.from(new Set(downstreamTitles));

      return {
        upstreamNodes: uniqueUpstreamTitles,
        downstreamNodes: uniqueDownstreamTitles
      };
    }

    function buildAggregateDetail(layerLabel, nodes, rawEdges, options = {}) {
      const aggregateNodeIds = new Set(nodes.map((node) => node.id));
      const rawNodeById = new Map();
      (options.dataset?.nodes || []).forEach((node) => {
        rawNodeById.set(node.id, node);
      });
      const useLayerRoleAmounts = Boolean(options.useLayerRoleAmounts);
      const isDemandLayer = options.layerVariant === "demand" || /上游|需求方/.test(layerLabel);
      const isSupplyLayer = options.layerVariant === "supply" || /下游|供给方/.test(layerLabel);
      const items = nodes.map((node) => {
        const amount = getAggregateNodeAmount(node.id, rawEdges);
        const costAmount = useLayerRoleAmounts && isDemandLayer
          ? amount
          : useLayerRoleAmounts && isSupplyLayer
            ? 0
            : Math.max(amount, 0);
        const incomeAmount = useLayerRoleAmounts && isSupplyLayer
          ? amount
          : useLayerRoleAmounts && isDemandLayer
            ? 0
            : Math.max(-amount, 0);
        const directRelations = getAggregateDirectRelations(
          node.id,
          aggregateNodeIds,
          rawEdges,
          rawNodeById,
          options.dataset
        );
        return {
          id: node.id,
          title: node.title,
          amount,
          amountText: formatAmountNumber(amount),
          amountDisplayText: formatCompactAmountNumber(amount),
          costAmount,
          costAmountText: formatAmountNumber(costAmount),
          costAmountDisplayText: formatCompactAmountNumber(costAmount),
          incomeAmount,
          incomeAmountText: formatAmountNumber(incomeAmount),
          incomeAmountDisplayText: formatCompactAmountNumber(incomeAmount),
          upstreamNodes: directRelations.upstreamNodes,
          downstreamNodes: directRelations.downstreamNodes,
          secondLevelNodes: [
            ...directRelations.upstreamNodes,
            ...directRelations.downstreamNodes
          ]
        };
      }).sort((a, b) => {
        if (useLayerRoleAmounts) {
          return Math.abs(b.amount) - Math.abs(a.amount);
        }
        return b.costAmount - a.costAmount || Math.abs(b.amount) - Math.abs(a.amount);
      });
      const total = items.reduce((sum, item) => sum + item.amount, 0);
      const costTotal = items.reduce((sum, item) => sum + item.costAmount, 0);
      const incomeTotal = items.reduce((sum, item) => sum + item.incomeAmount, 0);

      return {
        layerLabel,
        layerVariant: options.layerVariant || "",
        count: items.length,
        total,
        totalText: formatAmountNumber(total),
        totalDisplayText: formatCompactAmountNumber(total),
        incomeTotal,
        incomeTotalText: formatAmountNumber(incomeTotal),
        incomeTotalDisplayText: formatCompactAmountNumber(incomeTotal),
        costTotal,
        costTotalText: formatAmountNumber(costTotal),
        costTotalDisplayText: formatCompactAmountNumber(costTotal),
        topItems: items.slice(0, AGGREGATE_TOP_COUNT),
        items,
        incomeItems: items.filter((item) => item.incomeAmount !== 0)
      };
    }

    function applyFirstDemandMetaForCompactSecondDemand(dataset) {
      const layers = dataset?.layers || [];
      const hasSecondDemandLayer = layers.some((layer) => /二级需求方/.test(layer.label || ""));
      const firstDemandLayerIndex = layers.findIndex((layer, index) => {
        return /一级需求方/.test(layer.label || "")
          && getSchemeFiveLayerVariant(dataset, index, layer.label) === "demand";
      });

      if (!hasSecondDemandLayer || firstDemandLayerIndex < 0) {
        return;
      }

      const firstDemandNodes = (dataset.nodes || []).filter((node) => {
        return !node.aggregate
          && node.role !== "initiator"
          && getNearestLayerIndex(node.y, layers) === firstDemandLayerIndex;
      });

      if (!firstDemandNodes.length || firstDemandNodes.length >= 5) {
        return;
      }

      const initiatorIds = new Set(
        (dataset.nodes || [])
          .filter((node) => node.role === "initiator")
          .map((node) => node.id)
      );

      firstDemandNodes.forEach((node) => {
        const amount = (dataset.edges || []).reduce((sum, edge) => {
          const isConnectedToNode = edge.source === node.id || edge.target === node.id;
          const isConnectedToInitiator = initiatorIds.has(edge.source) || initiatorIds.has(edge.target);
          return isConnectedToNode && isConnectedToInitiator
            ? sum + parseAmountNumber(edge.amount)
            : sum;
        }, 0);

        node.meta = `收支偏差  ${formatAmountNumber(amount)}   ${formatPercentNumber(amount)}`;
      });
    }

    function buildSchemeFiveGraph(dataset) {
      const rawNodes = dataset.nodes.map((node) => ({ ...node }));
      const rawEdges = dataset.edges.map((edge) => ({ ...edge }));
      const rawNodeById = new Map(rawNodes.map((node) => [node.id, node]));
      const aggregateThreshold = getSchemeFiveAggregateThreshold(dataset);
      const buckets = new Map();

      rawNodes.forEach((node) => {
        if (node.role === "initiator") {
          return;
        }
        const layerIndex = getNearestLayerIndex(node.y, dataset.layers || []);
        const bucketKey = `${layerIndex}:${node.aggregateGroup || "default"}`;
        if (!buckets.has(bucketKey)) {
          buckets.set(bucketKey, {
            layerIndex,
            aggregateGroup: node.aggregateGroup || "",
            nodes: []
          });
        }
        buckets.get(bucketKey).nodes.push(node);
      });

      const aggregateByNodeId = new Map();
      const aggregateNodes = [];
      const nextNodes = [];

      rawNodes.forEach((node) => {
        const layerIndex = getNearestLayerIndex(node.y, dataset.layers || []);
        const bucketKey = `${layerIndex}:${node.aggregateGroup || "default"}`;
        const bucket = buckets.get(bucketKey);
        const shouldAggregate = bucket
          && node.role !== "initiator"
          && (dataset.aggregateAllGroupsInScheme5 || bucket.nodes.length > aggregateThreshold);
        if (shouldAggregate) {
          return;
        }
        nextNodes.push(node);
      });

      buckets.forEach(({ nodes, layerIndex, aggregateGroup }) => {
        if (!dataset.aggregateAllGroupsInScheme5 && nodes.length <= aggregateThreshold) {
          return;
        }

        const layer = (dataset.layers || [])[layerIndex] || {};
        const layerLabel = formatLayerName(layer.label);
        const useMigrationAggregateStyle = isMigrationDataset(dataset);
        const useNewAggregateCardStyle = useSchemeFiveAggregateCardStyle(dataset);
        const aggregateVariant = useNewAggregateCardStyle
          ? getSchemeFiveLayerVariant(dataset, layerIndex, layer.label)
          : "";
        const detail = buildAggregateDetail(layerLabel, nodes, rawEdges, {
          useLayerRoleAmounts: useNewAggregateCardStyle,
          layerVariant: aggregateVariant,
          dataset
        });
        const aggregatedNodeIds = new Set(nodes.map((node) => node.id));
        const connectedInitiator = useMigrationAggregateStyle
          ? rawEdges.map((edge) => {
            if (aggregatedNodeIds.has(edge.source)) {
              return rawNodeById.get(edge.target);
            }
            if (aggregatedNodeIds.has(edge.target)) {
              return rawNodeById.get(edge.source);
            }
            return null;
          }).find((node) => node?.role === "initiator")
          : null;
        const aggregateNode = {
          id: `agg-layer-${layerIndex}-${aggregateGroup || "default"}`,
          x: connectedInitiator
            ? connectedInitiator.x
            : nodes.reduce((sum, node) => sum + node.x, 0) / nodes.length,
          y: layer.y ?? nodes.reduce((sum, node) => sum + node.y, 0) / nodes.length,
          width: NODE_WIDTH,
          height: getSchemeFiveAggregateNodeHeight(dataset, detail, useNewAggregateCardStyle),
          title: `${layerLabel}，共${nodes.length}个`,
          role: "aggregate",
          layerIndex,
          aggregateGroup,
          aggregateVariant,
          aggregate: detail
        };

        nodes.forEach((node) => {
          aggregateByNodeId.set(node.id, aggregateNode.id);
        });
        aggregateNodes.push(aggregateNode);
      });

      const edgeGroups = new Map();
      rawEdges.forEach((edge) => {
        const source = aggregateByNodeId.get(edge.source) || edge.source;
        const target = aggregateByNodeId.get(edge.target) || edge.target;
        if (source === target) {
          return;
        }

        const key = `${source}->${target}`;
        if (!edgeGroups.has(key)) {
          edgeGroups.set(key, {
            id: `agg-e-${edgeGroups.size + 1}`,
            source,
            target,
            amountValue: 0,
            flow: edge.flow || "",
            renderTag: edge.flow === "horizontal-right" ? false : undefined,
            rawEdgeIds: []
          });
        }
        const group = edgeGroups.get(key);
        group.amountValue += parseAmountNumber(edge.amount);
        if (edge.flow) {
          group.flow = edge.flow;
        }
        if (edge.flow === "horizontal-right") {
          group.renderTag = false;
        }
        group.rawEdgeIds.push(edge.id);
      });

      const schemeDataset = {
        ...dataset,
        canvas: { ...dataset.canvas },
        layers: (dataset.layers || []).map((layer) => ({ ...layer })),
        nodes: [...nextNodes, ...aggregateNodes],
        edges: Array.from(edgeGroups.values()).map((edge) => ({
          id: edge.id,
          source: edge.source,
          target: edge.target,
          amount: formatAmountNumber(edge.amountValue),
          flow: edge.flow,
          renderTag: edge.renderTag,
          rawEdgeIds: edge.rawEdgeIds
        }))
      };
      applyFirstDemandMetaForCompactSecondDemand(schemeDataset);
      applySchemeFiveNodeMetrics(schemeDataset);
      const nodeMap = normalizeNodes(schemeDataset.nodes);
      const edgeSeed = schemeDataset.edges.map((edge) => ({ ...edge }));
      const layerGapByLayer = (schemeDataset.layers || []).map(() => 0);
      if (!schemeDataset.preserveNodePositions) {
        alignSchemeFiveLayersByGap(schemeDataset, nodeMap);
        compactNodesByLayer(schemeDataset, nodeMap, layerGapByLayer);
        alignSchemeFiveOddNodeLayersToInitiator(schemeDataset, nodeMap);
        alignMigrationCase2TreeGap(schemeDataset, nodeMap);
      } else {
        nodeMap.forEach((node) => {
          node.layerIndex = getNearestLayerIndex(node.y, schemeDataset.layers || []);
        });
      }
      const layoutResult = buildRegularGraphLayoutLegacy(schemeDataset, nodeMap, edgeSeed);

      return {
        dataset: schemeDataset,
        nodeMap,
        edges: layoutResult.edges,
        bounds: layoutResult.bounds
      };
    }

    function buildRegularGraphLayout(dataset, nodeMap, edges) {
      if (state.scheme === "scheme1") {
        return buildRegularGraphLayoutSchemeOne(dataset, nodeMap, edges);
      }

      if (state.scheme === "scheme3") {
        return buildRegularGraphLayoutSchemeThree(dataset, nodeMap, edges);
      }

      return buildRegularGraphLayoutLegacy(dataset, nodeMap, edges);
    }

    function positionTagGroup(tagGroup, edge, centerX, centerY, width, height) {
      const underlay = tagGroup.querySelector('[data-tag-part="underlay"]');
      const body = tagGroup.querySelector('[data-tag-part="body"]');
      const value = tagGroup.querySelector('[data-tag-part="value"]');
      const unit = tagGroup.querySelector('[data-tag-part="unit"]');
      const hit = tagGroup.querySelector('[data-tag-part="hit"]');
      const left = centerX - width / 2;
      const top = centerY - height / 2;

      if (underlay) {
        underlay.setAttribute("x", left - 2);
        underlay.setAttribute("y", top - 2);
      }

      if (body) {
        body.setAttribute("x", left);
        body.setAttribute("y", top);
      }

      if (hit) {
        hit.setAttribute("x", left - 4);
        hit.setAttribute("y", top - 4);
      }

      if (value) {
        if (edge.tagPresentation.unitText) {
          const totalWidth = edge.tagPresentation.valueWidth + edge.tagPresentation.unitWidth + 1;
          value.setAttribute("x", centerX - totalWidth / 2 + edge.tagPresentation.valueWidth / 2);
        } else {
          value.setAttribute("x", centerX);
        }
        value.setAttribute("y", centerY + 0.5);
      }

      if (unit) {
        const totalWidth = edge.tagPresentation.valueWidth + edge.tagPresentation.unitWidth + 1;
        unit.setAttribute("x", centerX + totalWidth / 2 - edge.tagPresentation.unitWidth / 2);
        unit.setAttribute("y", centerY + 0.5);
      }
    }

    function layoutTagsOnEdges(graphRoot, edges) {
      const tagGroups = new Map(
        Array.from(graphRoot.querySelectorAll(".tag-group")).map((group) => [
          group.getAttribute("data-edge-id"),
          group
        ])
      );
      const routePaths = new Map(
        Array.from(graphRoot.querySelectorAll(".edge-group")).map((group) => [
          group.getAttribute("data-edge-id"),
          group.querySelector(".edge-route")
        ])
      );
      const placedBoxes = [];

      edges.forEach((edge) => {
        const tagGroup = tagGroups.get(edge.id);
        const route = routePaths.get(edge.id);

        if (!tagGroup || !route) {
          return;
        }

        if (edge.fixedTagCenter && edge.tagCenter) {
          positionTagGroup(tagGroup, edge, edge.tagCenter.x, edge.tagCenter.y, edge.tagWidth, edge.tagHeight);
          placedBoxes.push({
            left: edge.tagCenter.x - edge.tagWidth / 2,
            right: edge.tagCenter.x + edge.tagWidth / 2,
            top: edge.tagCenter.y - edge.tagHeight / 2,
            bottom: edge.tagCenter.y + edge.tagHeight / 2
          });
          return;
        }

        const chosen = pickTagPlacement(edge, route, placedBoxes);

        edge.tagCenter = {
          x: chosen.centerX,
          y: chosen.centerY
        };
        positionTagGroup(tagGroup, edge, chosen.centerX, chosen.centerY, edge.tagWidth, edge.tagHeight);
        placedBoxes.push(chosen);
      });
    }

    function initTagTooltips(graphRoot) {
      // #region debug-point A:tippy-availability
      reportDebugEvent("A", "initTagTooltips", "enter initTagTooltips", {
        hasTippy: typeof window.tippy === "function"
      });
      // #endregion
      if (typeof window.tippy !== "function") {
        console.warn("Tippy.js is not available, tag tooltips cannot be initialized.");
        return;
      }

      destroyTooltips();

      const tooltipTargets = Array.from(graphRoot.querySelectorAll("[data-tooltip-html]"));
      // #region debug-point B:tooltip-targets
      reportDebugEvent("B", "initTagTooltips", "resolved tooltip targets", {
        targetCount: tooltipTargets.length,
        scheme: state.scheme,
        mode: state.mode
      });
      // #endregion
      state.tooltipInstances = tooltipTargets.map((target) => {
        const instance = window.tippy(target, {
          content: target.getAttribute("data-tooltip-html"),
          allowHTML: true,
          trigger: "mouseenter focus",
          arrow: true,
          theme: "topology",
          placement: "top",
          delay: [0, 0],
          duration: [120, 80],
          interactive: false,
          maxWidth: "none",
          appendTo: () => document.body,
          onShow(instanceRef) {
            hideOtherTooltips(instanceRef);
            // #region debug-point D:tippy-show
            reportDebugEvent("D", "tippy:onShow", "tooltip show triggered", {
              referenceTag: instanceRef.reference?.getAttribute?.("data-debug-tag") || "",
              rect: instanceRef.reference?.getBoundingClientRect?.()
                ? {
                    x: Math.round(instanceRef.reference.getBoundingClientRect().x),
                    y: Math.round(instanceRef.reference.getBoundingClientRect().y),
                    width: Math.round(instanceRef.reference.getBoundingClientRect().width),
                    height: Math.round(instanceRef.reference.getBoundingClientRect().height)
                  }
                : null
            });
            // #endregion
          }
        });

        if (target.classList.contains("node-group")) {
          target.addEventListener("mouseleave", () => instance.hide());
        }

        return instance;
      });
    }

    function renderLayerLabels(graphRoot, layers, width) {
      return;
    }

    function renderOrbitRing(graphRoot, orbitRing) {
      if (!orbitRing) {
        return;
      }

      graphRoot.appendChild(createSvg("circle", {
        cx: orbitRing.x,
        cy: orbitRing.y,
        r: orbitRing.radius,
        class: "orbit-ring"
      }));

    function renderEdge(edgeLayer, tagLayer, edge) {
      const isMigrationCoreEdge = edge.flow === "horizontal-right"
        && edge.sourceNode?.role === "initiator"
        && edge.targetNode?.role === "initiator";
      const group = createSvg("g", {
        class: `edge-group${isMigrationCoreEdge ? " is-migration-core" : ""}`,
        "data-edge-id": edge.id
      });

      const route = createSvg("path", {
        d: edge.path,
        class: "edge-route"
      });
      const hit = createSvg("path", {
        d: edge.path,
        class: "edge-hit"
      });

      group.appendChild(route);
      group.appendChild(hit);

      const activate = () => setHoverEdge(edge.id);
      const deactivate = () => clearHoverState();

      group.addEventListener("mouseenter", activate);
      group.addEventListener("mouseleave", deactivate);

      edgeLayer.appendChild(group);

      if (edge.renderTag === false) {
        return;
      }

      const tagGroup = createSvg("g", {
        class: `tag-group ${edge.tagVariant === "error" ? "is-error" : ""}`,
        "data-edge-id": edge.id,
        "data-edge-ids": (edge.tagInteractiveEdgeIds || [edge.id]).join(",")
      });

      const tagX = edge.tagCenter.x - edge.tagWidth / 2;
      const tagY = edge.tagCenter.y - edge.tagHeight / 2;
      const tagUnderlay = createSvg("rect", {
        x: tagX - 2,
        y: tagY - 2,
        width: edge.tagWidth + 4,
        height: edge.tagHeight + 4,
        rx: 5,
        ry: 5,
        "data-tag-part": "underlay",
        class: "tag-underlay"
      });
      const tagRect = createSvg("rect", {
        x: tagX,
        y: tagY,
        width: edge.tagWidth,
        height: edge.tagHeight,
        rx: 3,
        ry: 3,
        "data-tag-part": "body",
        class: "tag-bg"
      });
      const tagValue = createSvg("text", {
        x: edge.tagCenter.x,
        y: edge.tagCenter.y + 0.5,
        "data-tag-part": "value",
        class: "tag-value"
      });
      tagValue.textContent = edge.tagPresentation.valueText;
      const tagHit = createSvg("rect", {
        x: tagX - 4,
        y: tagY - 4,
        width: edge.tagWidth + 8,
        height: edge.tagHeight + 8,
        rx: 6,
        ry: 6,
        class: "tag-hit",
        "data-tag-part": "hit"
      });
      if (edge.tagTooltip) {
        tagHit.setAttribute("data-tooltip-html", buildTooltipHtml(edge.tagTooltip));
      }
      if (state.scheme === "scheme3") {
        tagHit.setAttribute("data-debug-tag", edge.id);
      }

      tagGroup.appendChild(tagUnderlay);
      tagGroup.appendChild(tagRect);
      tagGroup.appendChild(tagValue);

      if (edge.tagPresentation.unitText) {
        const tagUnit = createSvg("text", {
          x: edge.tagCenter.x,
          y: edge.tagCenter.y + 0.5,
          "data-tag-part": "unit",
          class: "tag-unit"
        });
        tagUnit.textContent = edge.tagPresentation.unitText;
        tagGroup.appendChild(tagUnit);
      }
      tagGroup.appendChild(tagHit);

      // #region debug-point B:scheme3-tag-render
      if (state.scheme === "scheme3" && edge.tagTooltip) {
        reportDebugEvent("B", "renderEdge", "rendered scheme3 tooltip tag", {
          edgeId: edge.id,
          targetEdgeIds: edge.tagInteractiveEdgeIds || [edge.id],
          x: Math.round(edge.tagCenter.x),
          y: Math.round(edge.tagCenter.y),
          width: Math.round(edge.tagWidth),
          height: Math.round(edge.tagHeight)
        });
      }
      // #endregion

      const tagActivate = () => {
        // #region debug-point C:tag-hover
        reportDebugEvent("C", "renderEdge:tagActivate", "tag hover entered", {
          edgeId: edge.id,
          hasTooltip: Boolean(edge.tagTooltip),
          hasTippyInstance: Boolean(tagHit._tippy),
          debugTag: tagHit.getAttribute("data-debug-tag") || "",
          rect: {
            x: Math.round(tagHit.getBoundingClientRect().x),
            y: Math.round(tagHit.getBoundingClientRect().y),
            width: Math.round(tagHit.getBoundingClientRect().width),
            height: Math.round(tagHit.getBoundingClientRect().height)
          }
        });
        // #endregion
        const edgeIds = edge.tagInteractiveEdgeIds || [edge.id];
        const nodeIds = new Set();
        edgeIds.forEach((edgeId) => {
          const matchedEdge = state.graph.edges.find((item) => item.id === edgeId);
          if (!matchedEdge) {
            return;
          }
          nodeIds.add(matchedEdge.source);
          nodeIds.add(matchedEdge.target);
        });
        state.hoverActive = {
          kind: "tag",
          key: edge.id,
          edgeIds: new Set(edgeIds),
          nodeIds
        };
        syncActiveState();
      };

      const tagDeactivate = () => {
        deactivate();
      };

      tagHit.addEventListener("mouseenter", tagActivate);
      tagHit.addEventListener("mouseleave", tagDeactivate);
      tagLayer.appendChild(tagGroup);
    }

    function isNodeOptionScheme() {
      return state.scheme === "scheme2" || state.scheme === "scheme4" || state.scheme === "scheme5";
    }

    function splitAmountUnit(amountText) {
      const text = String(amountText || "0元");
      const matched = text.match(/^(.*?)(亿元|万元|元)$/);
      if (matched) {
        return {
          value: matched[1],
          unit: matched[2]
        };
      }
      return {
        value: text,
        unit: ""
      };
    }

    function isZeroAmountText(amountText) {
      const amount = splitAmountUnit(amountText);
      const numericText = String(amount.value || "").replace(/,/g, "").trim();
      const numericValue = Number(numericText);
      return Number.isFinite(numericValue) && numericValue === 0;
    }

    function renderStartAmount(group, x, y, labelText, amountText) {
      const amount = splitAmountUnit(amountText);
      const labelWidth = measureTextWidth(labelText, '400 12px "PingFang SC"');
      const amountWidth = measureTextWidth(amount.value, '500 12px Roboto');
      const label = createSvg("text", {
        x,
        y,
        class: "node-aggregate-summary-label"
      });
      label.textContent = labelText;
      group.appendChild(label);

      const value = createSvg("text", {
        x: x + labelWidth + 2,
        y,
        class: "node-aggregate-summary-value"
      });
      value.textContent = amount.value;
      group.appendChild(value);

      if (amount.unit) {
        const unit = createSvg("text", {
          x: x + labelWidth + 2 + amountWidth + 2,
          y,
          class: "node-aggregate-summary-unit"
        });
        unit.textContent = amount.unit;
        group.appendChild(unit);
      }
    }

    function renderEndAmount(group, rightX, y, amountText) {
      const amount = splitAmountUnit(amountText);
      const unitWidth = amount.unit ? measureTextWidth(amount.unit, '400 12px "PingFang SC"') : 0;

      if (amount.unit) {
        const unit = createSvg("text", {
          x: rightX,
          y,
          class: "node-aggregate-top-unit"
        });
        unit.textContent = amount.unit;
        group.appendChild(unit);
      }

      const value = createSvg("text", {
        x: rightX - unitWidth - (amount.unit ? 2 : 0),
        y,
        class: "node-aggregate-top-value"
      });
      value.textContent = amount.value;
      group.appendChild(value);
    }

    function measureEndAmountWidth(amountText) {
      const amount = splitAmountUnit(amountText);
      const valueWidth = measureTextWidth(amount.value, '500 12px Roboto');
      const unitWidth = amount.unit ? measureTextWidth(amount.unit, '400 12px "PingFang SC"') : 0;
      return valueWidth + unitWidth + (amount.unit ? 2 : 0);
    }

    function renderEndAmountWithClasses(group, rightX, y, amountText, valueClass, unitClass) {
      const amount = splitAmountUnit(amountText);
      const unitWidth = amount.unit ? measureTextWidth(amount.unit, '400 12px "PingFang SC"') : 0;

      if (amount.unit) {
        const unit = createSvg("text", {
          x: rightX,
          y,
          class: unitClass
        });
        unit.textContent = amount.unit;
        group.appendChild(unit);
      }

      const value = createSvg("text", {
        x: rightX - unitWidth - (amount.unit ? 2 : 0),
        y,
        class: valueClass
      });
      value.textContent = amount.value;
      group.appendChild(value);
    }

      group.appendChild(createSvg("line", {
        x1: contentLeft,
        y1: dividerY,

      }));

      const title = createSvg("text", {

      });

      topFlows.forEach((flow, index) => {

        const arrowGap = 4;
        const amountGap = 12;
        const arrowWidth = measureTextWidth(arrowText, '400 12px "PingFang SC"');

        const fromNaturalWidth = measureTextWidth(flow.from, '400 12px "PingFang SC"');
        const toNaturalWidth = measureTextWidth(flow.to, '400 12px "PingFang SC"');
        const namesAvailableWidth = Math.max(42, availableTextWidth - arrowWidth - arrowGap * 2);
        const naturalNamesWidth = fromNaturalWidth + toNaturalWidth;
        const fromMaxWidth = naturalNamesWidth <= namesAvailableWidth
          ? fromNaturalWidth
          : Math.max(42, Math.min(fromNaturalWidth, namesAvailableWidth * (fromNaturalWidth / naturalNamesWidth)));
        const toMaxWidth = Math.max(42, namesAvailableWidth - fromMaxWidth);
        const fromDisplayWidth = Math.min(fromNaturalWidth, fromMaxWidth);
        const fromX = contentLeft;
        const arrowX = fromX + fromDisplayWidth + arrowGap + arrowWidth / 2;
        const toX = arrowX + arrowWidth / 2 + arrowGap;

          group.appendChild(createSvg("line", {

          }));

          const amountHit = createSvg("rect", {
            x: amountStartX - 3,

            rx: 3,

          });
          amountHit.setAttribute("data-tooltip-html", amountFormulaTooltip);

          group.appendChild(createSvg("line", {

          }));

            x: rateStartX - 3,

      renderChildBudgetFlowNodeContent(group, node, schemeFiveLayout);

      group.addEventListener("mouseenter", () => setHoverNode(node.id));
      group.addEventListener("mouseleave", () => clearHoverState());
      group.addEventListener("click", () => activateNodeById(node.id));

      graphRoot.appendChild(group);
    }

    function fitView() {
      if (!state.graph) {
        return;
      }

      syncSvgSize();
      const rect = stage.getBoundingClientRect();
      const bounds = state.graph.bounds;
      const padding = 24;
      const width = bounds.maxX - bounds.minX;
      const height = bounds.maxY - bounds.minY;
      const scale = Math.min(
        (rect.width - padding * 2) / width,
        (rect.height - padding * 2) / height
      );

      state.camera.scale = Math.max(0.45, Math.min(scale, 1.12));
      state.camera.x = (rect.width - width * state.camera.scale) / 2 - bounds.minX * state.camera.scale;
      state.camera.y = (rect.height - height * state.camera.scale) / 2 - bounds.minY * state.camera.scale;
      applyCamera();
    }

    function applyCamera() {
      viewportLayer.setAttribute(
        "transform",
        `translate(${state.camera.x} ${state.camera.y}) scale(${state.camera.scale})`
      );
    }

    function syncSvgSize() {
      svg.setAttribute("width", Math.round(stage.clientWidth));
      svg.setAttribute("height", Math.round(stage.clientHeight));
    }

    function zoomAt(factor, clientX, clientY) {
      const rect = svg.getBoundingClientRect();
      const anchorX = clientX - rect.left;
      const anchorY = clientY - rect.top;
      const prevScale = state.camera.scale;
      const nextScale = Math.max(0.35, Math.min(prevScale * factor, 2.4));
      const graphX = (anchorX - state.camera.x) / prevScale;
      const graphY = (anchorY - state.camera.y) / prevScale;

      state.camera.scale = nextScale;
      state.camera.x = anchorX - graphX * nextScale;
      state.camera.y = anchorY - graphY * nextScale;
      applyCamera();
    }

    function setActiveEdge(edgeId) {
      const edge = state.graph.edges.find((item) => item.id === edgeId);
      if (!edge) {
        return null;
      }

      return {
        kind: "edge",
        key: edgeId,
        edgeIds: new Set([edgeId]),
        nodeIds: new Set([edge.source, edge.target])
      };
    }

    function setActiveNode(nodeId) {
      const nodeIds = new Set([nodeId]);
      const edgeIds = new Set();

      state.graph.edges.forEach((edge) => {
        if (edge.source === nodeId || edge.target === nodeId) {
          edgeIds.add(edge.id);
          nodeIds.add(edge.source);
          nodeIds.add(edge.target);
        }
      });

      return {
        kind: "node",
        key: nodeId,
        edgeIds,
        nodeIds
      };
    }

    function syncActiveState() {
      state.active = state.hoverActive || state.selectedActive;
      applyActiveState();
    }

    function setHoverEdge(edgeId) {
      state.hoverActive = setActiveEdge(edgeId);
      syncActiveState();
    }

    function setHoverNode(nodeId) {
      state.hoverActive = setActiveNode(nodeId);
      syncActiveState();
    }

    function clearHoverState() {
      if (!state.hoverActive) {
        return;
      }
      state.hoverActive = null;
      syncActiveState();
    }

    function setSelectedNode(nodeId) {
      if (!isNodeOptionScheme()) {
        return;
      }

      const nextActive = setActiveNode(nodeId);
      const isSameSelection = state.selectedActive
        && state.selectedActive.kind === nextActive.kind
        && state.selectedActive.key === nextActive.key;

      state.selectedActive = isSameSelection ? null : nextActive;
      syncActiveState();
    }

    function clearSelectedState() {
      if (!state.selectedActive) {
        return;
      }

      state.selectedActive = null;
      syncActiveState();
    }

    function syncNodeOptionPanel() {
      const showNodeOptionPanel = isNodeOptionScheme();
      nodeOptionPanel.hidden = !showNodeOptionPanel;

      nodeOptionInputs.forEach((input) => {
        input.checked = Boolean(state.nodeOptions[input.dataset.nodeOption]);
      });
    }

    function destroyDrawerTooltips() {
      state.drawerTooltipInstances.forEach((instance) => instance.destroy());
      state.drawerTooltipInstances = [];
    }

    function getAggregatePanelTitle(detail) {
      const levelName = getLayerLevelName(detail?.layerLabel || "一级");
      const layerVariant = detail?.layerVariant || "";

      if (layerVariant === "supply" || /下游|供给方/.test(detail?.layerLabel || "")) {
        return `${levelName}供给方明细`;
      }
      if (layerVariant === "demand" || /上游|需求方/.test(detail?.layerLabel || "")) {
        return `${levelName}需求方明细`;
      }
      return `${detail?.layerLabel || levelName}明细`;
    }

    function getNextLayerLevelName(levelName) {
      const order = ["一级", "二级", "三级", "四级", "五级"];
      const index = order.indexOf(levelName);
      return index >= 0 && index < order.length - 1 ? order[index + 1] : `${levelName}下级`;
    }

    function getDrawerRoleName(layerVariant, layerLabel = "") {
      if (layerVariant === "supply" || /下游|供给方/.test(layerLabel)) {
        return "供给方";
      }
      return "需求方";
    }

    function getDrawerLevelName(layerLabel, layerIndex, layerVariant, dataset = state.graph?.dataset) {
      if (dataset) {
        return getSchemeFiveLayerLevelName(dataset, layerIndex, layerLabel, layerVariant);
      }
      return getLayerLevelName(layerLabel);
    }

    function getDrawerNodeTypeLabel(node, side, dataset = getRawDatasetForDrawer()) {
      const layerInfo = getNodeLayerInfo(node, dataset);
      const layerVariant = side || layerInfo.layerVariant;
      const levelName = getDrawerLevelName(layerInfo.layerLabel, layerInfo.layerIndex, layerVariant, dataset);
      return `${levelName}${getDrawerRoleName(layerVariant, layerInfo.layerLabel)}`;
    }

    function getDrawerTitleTagText(node) {
      const visual = getSchemeFiveNodeVisual(node, state.graph?.dataset);
      return visual?.tagText || "";
    }

    function formatDrawerTitleText(titleText) {
      const text = String(titleText || "");
      return text.startsWith("当前选中：") ? text : `当前选中：${text}`;
    }

    function setDrawerTitle(titleText, tagText = "") {
      const tagVariant = /供给方/.test(tagText)
        ? "supply"
        : /需求方/.test(tagText)
          ? "demand"
          : /发起方/.test(tagText)
            ? "initiator"
            : "";
      aggregateDrawerTitle.innerHTML = `
        <span class="aggregate-drawer-title-text">${escapeHtml(formatDrawerTitleText(titleText))}</span>
        ${tagText ? `<span class="aggregate-drawer-title-tag ${tagVariant ? `is-${tagVariant}` : ""}">${escapeHtml(tagText)}</span>` : ""}
      `;
    }

    function renderAggregateSummaryValue(amountText) {
      const amount = splitAmountUnit(amountText);
      return `
        <span>${escapeHtml(amount.value)}</span>
        ${amount.unit ? `<span class="aggregate-summary-unit">${escapeHtml(amount.unit)}</span>` : ""}
      `;
    }

    function renderSummaryCards(cards) {

      return `
        <div class="aggregate-summary-grid${hasDiff ? " has-diff" : ""}" data-tod-summary-cards="${encodedCards}">
          ${cards.map((card) => `
            <div class="aggregate-summary-card${card.subtext ? " is-diff" : ""}">
              <div class="aggregate-summary-label">${escapeHtml(card.label)}</div>
              <div class="aggregate-summary-metric-row">
                <div class="aggregate-summary-value">${renderAggregateSummaryValue(card.value)}</div>
                ${card.subtext ? `
                  <span class="aggregate-summary-divider" aria-hidden="true"></span>
                  <span class="aggregate-summary-subtext">${escapeHtml(card.subtext)}</span>
                ` : ""}
              </div>
            </div>
          `).join("")}
        </div>

    function renderTableAmountValue(amountText) {

    const RELATION_TAG_VISIBLE_COUNT = 2;

    function renderRelationNodeTags(nodes = []) {
      if (!nodes.length) {
        return `<span class="tod-drawer-table-empty">-</span>`;
      }

      const visibleNodes = nodes.slice(0, RELATION_TAG_VISIBLE_COUNT);
      const hiddenCount = Math.max(0, nodes.length - visibleNodes.length);
      return `
        <div class="tod-drawer-tag-list" title="${escapeHtml(nodes.join("、"))}">
          ${visibleNodes.map((node) => `
            <span class="tod-drawer-table-tag">
              <span class="tod-drawer-table-tag-text">${escapeHtml(node)}</span>
            </span>
          `).join("")}
          ${hiddenCount ? `<span class="tod-drawer-table-tag is-more">+${hiddenCount}</span>` : ""}
        </div>
      `;
    }

    function getRoleTagVariant(text) {
      if (/供给方/.test(text || "")) {
        return "supply";
      }
      if (/发起方/.test(text || "")) {
        return "initiator";
      }
      return "demand";
    }

    function renderNodeTypeTag(text) {
      const variant = getRoleTagVariant(text);
      return `<span class="aggregate-table-node-type-tag is-${variant}">${escapeHtml(text)}</span>`;
    }

    function renderFallbackDrawerTable(payload) {
      if (payload.mode === "aggregate") {
        const showRelationColumns = payload.showRelationColumns !== false;
        const rows = payload.rows.length
          ? payload.rows.map((row) => `
            <tr>
              <td class="is-fixed-left"><div class="aggregate-table-node" title="${escapeHtml(row.name)}">${escapeHtml(row.name)}</div></td>

              <thead>

      return `

          <table class="aggregate-table is-node-drawer-table">

              <tr>

                <th style="text-align: right;">收入调整总金额</th>
                <th style="text-align: right;">收支偏差金额</th>
                <th style="text-align: right;">收支偏差比例</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderDrawerTable(payload) {
      const encodedPayload = escapeHtml(JSON.stringify(payload));
      return `<div class="tod-drawer-table-wrap is-${escapeHtml(payload.mode)}" data-tod-table="${encodedPayload}">${renderFallbackDrawerTable(payload)}</div>`;
    }

    function renderChildBudgetFlowList(flows, signedAmount = false) {
      const rows = (flows || []).length
        ? flows.map((flow) => `
          <div class="child-flow-row">
            <span class="child-flow-name" title="${escapeHtml(flow.from)}">${escapeHtml(flow.from)}</span>

    function renderNodeDrawerDetailTabs(detail) {

        <div class="drawer-detail-tabs" data-drawer-detail-tabs>
          <div class="drawer-detail-tab-list" role="tablist" aria-label="明细切换">

    function requestTodDrawerSummaryRender() {
      requestAnimationFrame(() => {
        window.renderTodDrawerSidebar?.();
        window.dispatchEvent(new CustomEvent("tod-drawer-summary:render"));
        updateDrawerSummaryLayout();
      });
    }

    function getDrawerResizableAreaWidth() {
      if (!card) {
        return 0;
      }

      const cardRect = card.getBoundingClientRect();
      const dividerWidth = parseFloat(getComputedStyle(card).getPropertyValue("--drawer-divider-width")) || 1;
      return Math.max(0, cardRect.width - dividerWidth);
    }

    function updateDrawerSummaryLayout() {
      const drawerWidth = aggregateDrawer.getBoundingClientRect().width;
      aggregateDrawer.classList.toggle("is-summary-narrow", drawerWidth > 0 && drawerWidth < 560);
    }

    function applyDrawerWidthRatio(nextRatio = state.drawerRatio) {
      if (!card || !drawerResizer) {
        return;
      }

      const clampedRatio = Math.max(1 / 3, Math.min(2 / 3, nextRatio));
      const availableWidth = getDrawerResizableAreaWidth();
      state.drawerRatio = clampedRatio;
      drawerResizer.setAttribute("aria-valuenow", String(Math.round(clampedRatio * 100)));

      if (availableWidth <= 0) {
        return;
      }

      const drawerWidth = availableWidth * clampedRatio;
      const topologyWidth = availableWidth - drawerWidth;
      card.style.setProperty("--drawer-width", `${drawerWidth}px`);
      card.style.setProperty("--topology-pane-width", `${topologyWidth}px`);
      updateDrawerSummaryLayout();
      requestAnimationFrame(() => {
        updateDrawerSummaryLayout();
        fitView();
      });
    }

    function syncDrawerResizeState() {
      const shouldShowResizer = state.view === "topology" && !aggregateDrawer.classList.contains("is-collapsed");
      card?.classList.toggle("has-open-drawer", shouldShowResizer);
      if (drawerResizer) {
        drawerResizer.hidden = !shouldShowResizer;
      }

      if (shouldShowResizer) {
        requestAnimationFrame(() => applyDrawerWidthRatio(state.drawerRatio));
      }
    }

    function renderAggregateSummary(costTotalText, incomeTotalText) {
      return renderSummaryCards([
        { label: "成本调整总金额", value: costTotalText },
        { label: "收入调整总金额", value: incomeTotalText }

    function buildAggregateTableRows(items) {
      if (!items.length) {
        return `
          <tr>
            <td colspan="4" class="aggregate-table-muted">暂无数据</td>
          </tr>
        `;
      }

      return items.map((item) => `
        <tr>

          </td>
