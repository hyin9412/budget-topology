<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topology Routing Demo</title>
  <link rel="stylesheet" href="./vendor/tippy.css" />
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --panel: #ffffff;
      --panel-border: #e5e8ef;
      --header-bg: #0b0e13;
      --header-text: #f5f7fa;
      --text: #1f2329;
      --muted: #6b7280;
      --line: #d6dde8;
      --line-hover: #c2ccd9;
      --line-active: #1890ff;
      --node-border: #cfd7e3;
      --node-fill: #ffffff;
      --node-start: #1664ff;
      --node-accent: #1890ff;
      --tag-positive-bg: #fff1f0;
      --tag-positive-border: #ffb5ad;
      --tag-positive-text: #cf4d40;
      --tag-negative-bg: #edf8ee;
      --tag-negative-border: #a9d7b4;
      --tag-negative-text: #2d8d52;
      --dim-opacity: 0.3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: var(--text);
      font-family: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }

    .page {
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .page-shell {
      width: min(1176px, calc(100vw - 48px));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .page-topbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 10px;
    }

    .scheme-switch {
      display: inline-flex;
      align-items: stretch;
      min-width: 320px;
      height: 32px;
      border-radius: 4px;
      background: #ffffff;
      box-shadow: 0 0 0 1px #dde2e9;
      overflow: hidden;
    }

    .scheme-label {
      display: inline-flex;
      flex-shrink: 0;
      align-items: center;
      align-self: stretch;
      border-right: 1px solid #dde2e9;
      background: #ffffff;
      padding: 5px 12px;
      color: #42464e;
      font-size: 13px;
      line-height: 22px;
      letter-spacing: 0.04px;
    }

    .scheme-select-wrap {
      position: relative;
      display: flex;
      flex: 1;
      align-items: center;
      background: #ffffff;
    }

    .scheme-select {
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
      background: transparent;
      padding: 5px 32px 5px 12px;
      color: #42464e;
      font-size: 13px;
      line-height: 22px;
      letter-spacing: 0.04px;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .scheme-select:focus {
      box-shadow: inset 0 0 0 1px #1664ff;
    }

    .scheme-select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      width: 12px;
      height: 12px;
      transform: translateY(-50%);
      color: #737a87;
      font-size: 12px;
      line-height: 12px;
      pointer-events: none;
    }

    .card {
      width: 100%;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid #eaedf1;
      padding: 7px 15px 8px;
      min-height: 38px;
      background: #ffffff;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .title {
      color: #020814;
      font-size: 14px;
      line-height: 22px;
      font-weight: 500;
      letter-spacing: 0.04px;
      white-space: nowrap;
    }

    .subtitle {
      display: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 16px;
    }

    .mode-switch {
      display: inline-flex;
      align-items: flex-start;
      column-gap: 2px;
      border-radius: 4px;
      background: #f1f3f5;
      padding: 3px;
      height: 32px;
    }

    .mode-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #42464e;
      padding: 2px 12px;
      line-height: 22px;
      letter-spacing: 0.04px;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .mode-btn.is-active {
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.07), 0 1px 1px rgba(0, 0, 0, 0.05),
        0 0 0 1px rgba(213, 219, 227, 0.7);
      background: #ffffff;
      color: #1664ff;
      font-weight: 500;
    }

    .legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      color: #42464e;
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .legend-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      border-radius: 999px;
      padding: 0 7px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .legend-chip.positive {
      background: rgba(255, 241, 240, 0.96);
      border-color: rgba(255, 181, 173, 0.9);
      color: var(--tag-positive-text);
    }

    .legend-chip.negative {
      background: rgba(237, 248, 238, 0.96);
      border-color: rgba(169, 215, 180, 0.95);
      color: var(--tag-negative-text);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 1px #cfd7e3;
    }

    .legend-dot.start {
      background: #ffffff;
      box-shadow: inset 0 0 0 1px #3d7dfe, 0 0 0 1px rgba(61, 125, 254, 0.2);
    }

    .legend-dot.start::after {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffffff;
    }

    .legend-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 12px;
      height: 12px;
      color: #42464e;
      font-size: 12px;
      line-height: 1;
    }

    .legend-node {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      padding: 1px;
    }

    .legend-node.start {
      background: rgba(61, 125, 254, 0.2);
      border: 1px solid rgba(61, 125, 254, 0.12);
    }

    .legend-node.start::after {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid #3d7dfe;
    }

    .legend-node.regular {
      background: #dde2e9;
    }

    .legend-node.regular::after {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffffff;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 400px;
      background: #fcfdfe;
    }

    .canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #fcfdfe;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .canvas.is-dragging {
      cursor: grabbing;
    }

    .hud {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      gap: 16px;
      pointer-events: none;
    }

    .zoom-panel {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      row-gap: 1px;
      border-radius: 4px;
      box-shadow: 0 0 0 1px #dde2e9, 0 2px 1px rgba(0, 0, 0, 0.08);
      background: #eaedf1;
      overflow: hidden;
      pointer-events: auto;
    }

    .zoom-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 0;
      background: #ffffff;
      color: #4e5969;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .zoom-btn:hover {
      color: var(--line-active);
      background: #f7f9fc;
    }

    .zoom-btn:active {
      background: #f1f3f5;
    }

    .zoom-icon {
      width: 16px;
      height: 16px;
      display: block;
    }

    .grid-line {
      stroke: rgba(15, 23, 42, 0.04);
      stroke-width: 1;
    }

    .grid-line.major {
      stroke: rgba(15, 23, 42, 0.06);
    }

    .edge-group,
    .node-group,
    .tag-group {
      transition: opacity 0.14s ease;
    }

    .layer-backdrop {
      transition: opacity 0.14s ease;
    }

    .edge-route {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.14s ease, stroke-width 0.14s ease, opacity 0.14s ease;
      marker-end: url(#arrow-default);
    }

    .edge-group.is-active .edge-route {
      stroke: var(--line-hover);
      marker-end: url(#arrow-hover);
    }

    .edge-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
    }

    .tag-bg {
      fill: #ebf1ff;
      stroke: #6e9fff;
      stroke-width: 1;
      transition: fill 0.14s ease, stroke 0.14s ease, opacity 0.14s ease;
    }

    .tag-underlay {
      fill: #ffffff;
      stroke: none;
    }

    .tag-value {
      fill: #1664ff;
      font-size: 10px;
      font-weight: 500;
      dominant-baseline: middle;
      text-anchor: middle;
      pointer-events: none;
      transition: fill 0.14s ease, opacity 0.14s ease;
    }

    .tag-unit {
      fill: #737a87;
      font-size: 10px;
      font-weight: 400;
      dominant-baseline: middle;
      text-anchor: middle;
      pointer-events: none;
      transition: fill 0.14s ease, opacity 0.14s ease;
    }

    .tag-group.is-error .tag-bg {
      fill: #ffecec;
      stroke: #ff706d;
    }

    .tag-group.is-error .tag-value {
      fill: #d7312a;
    }

    .tag-hit {
      fill: rgba(255, 255, 255, 0.01);
      pointer-events: auto;
      cursor: pointer;
    }

    .tippy-box[data-theme~='topology'] {
      background: #ffffff;
      color: #1f2937;
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.12);
      font-size: 12px;
      line-height: 1.5;
    }

    .tippy-box[data-theme~='topology'] .tippy-content {
      padding: 8px 10px;
      white-space: normal;
    }

    .tippy-box[data-theme~='topology'] > .tippy-arrow {
      color: #ffffff;
    }

    .tooltip-lines {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .tooltip-line {
      white-space: nowrap;
    }

    .tooltip-amount {
      font-weight: 700;
    }

    .node-shadow {
      fill: rgba(24, 144, 255, 0.08);
      opacity: 0;
      transition: opacity 0.14s ease;
    }

    .node-card {
      fill: var(--node-fill);
      stroke: #dde2e9;
      stroke-width: 1;
      transition: stroke 0.14s ease, stroke-width 0.14s ease, fill 0.14s ease, transform 0.14s ease;
    }

    .node-group.is-start .node-card {
      stroke: #8eb6ff;
    }

    .node-group.is-initiator .node-card {
      stroke: #1664ff;
      stroke-width: 1.2;
    }

    .node-group.is-initiator .node-title {
      fill: #1664ff;
      font-weight: 500;
    }

    .node-title {
      fill: #0c0d0e;
      font-size: 12px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-meta-label {
      fill: #42464e;
      font-size: 10px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-meta-value {
      fill: #42464e;
      font-size: 10px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-meta-unit {
      fill: #737a87;
      font-size: 10px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node-meta-divider,
    .node-meta-strike {
      stroke: #c7ccd6;
      stroke-width: 1;
      shape-rendering: crispEdges;
    }

    .node-meta-divider {
      stroke: #eaedf1;
    }

    .orbit-ring {
      fill: none;
      stroke: rgba(24, 144, 255, 0.16);
      stroke-width: 1;
      stroke-dasharray: 6 8;
    }

    @media (max-width: 1080px) {
      .page {
        padding: 16px;
      }

      .page-shell,
      .card {
        width: 100%;
      }

      .page-topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .scheme-switch,
      .mode-switch {
        width: 100%;
      }

      .mode-btn {
        flex: 1;
      }


      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar {
        width: 100%;
        justify-content: flex-start;
      }

      .zoom-panel {
        align-self: flex-end;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-shell">
      <div class="page-topbar">
        <div class="scheme-switch">
          <div class="scheme-label">方案</div>
          <div class="scheme-select-wrap">
            <select id="scheme-select" class="scheme-select" aria-label="选择方案">
              <option value="scheme1">方案一：线上方案+高亮</option>
              <option value="scheme2">方案二：弧线连接+高亮</option>
              <option value="scheme3">方案三：合计展示重叠金额+高亮</option>
            </select>
            <span class="scheme-select-arrow">⌄</span>
          </div>
        </div>

        <div class="mode-switch">
          <button id="mode-tree" class="mode-btn is-active" type="button">普通数据</button>
          <button id="mode-mesh" class="mode-btn" type="button">复杂数据</button>
        </div>
      </div>

      <section class="card">
      <header class="header">
        <div class="title-wrap">
          <div class="title">调整链路</div>
        </div>
        <div class="toolbar">
          <div class="legend">
            <span class="legend-item">
              <span class="legend-icon">◉</span>
              <span>点击节点配置/查看明细</span>
            </span>
            <span class="legend-item">
              <span class="legend-node start"></span>
              <span>发起方节点</span>
            </span>
            <span class="legend-item">
              <span class="legend-node regular"></span>
              <span>上下游节点</span>
            </span>
          </div>
        </div>
      </header>

      <div class="stage">
        <svg id="topology-canvas" class="canvas" aria-label="Interactive topology demo">
          <defs>
            <marker id="arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6dde8"></path>
            </marker>
            <marker id="arrow-hover" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2ccd9"></path>
            </marker>
            <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#1890ff"></path>
            </marker>
          </defs>
          <g id="viewport-layer"></g>
        </svg>

        <div class="hud">
          <div class="zoom-panel">
            <button id="zoom-in" class="zoom-btn" type="button" aria-label="Zoom in">
              <img src="./icon/放大.svg" class="zoom-icon" alt="" />
            </button>
            <button id="zoom-out" class="zoom-btn" type="button" aria-label="Zoom out">
              <img src="./icon/缩小.svg" class="zoom-icon" alt="" />
            </button>
            <button id="zoom-fit" class="zoom-btn" type="button" aria-label="Fit view">
              <img src="./icon/适配.svg" class="zoom-icon" alt="" />
            </button>
          </div>
        </div>
      </div>
      </section>
    </div>
  </div>

  <script src="./vendor/popper.min.js"></script>
  <script src="./vendor/tippy-bundle.umd.min.js"></script>

    function measureTextWidth(text, font = "700 12px Inter") {
      measureContext.font = font;
      return measureContext.measureText(text).width;
    }

    function truncateTextToWidth(text, maxWidth, font = "500 12px Inter") {
      const safeText = String(text || "");
      if (measureTextWidth(safeText, font) <= maxWidth) {
        return safeText;
      }

      const ellipsis = "...";
      const ellipsisWidth = measureTextWidth(ellipsis, font);
      if (ellipsisWidth >= maxWidth) {
        return ellipsis;
      }

      let low = 0;
      let high = safeText.length;

      while (low < high) {
        const middle = Math.ceil((low + high) / 2);
        const candidate = `${safeText.slice(0, middle)}${ellipsis}`;
        if (measureTextWidth(candidate, font) <= maxWidth) {
          low = middle;
        } else {
          high = middle - 1;
        }
      }

      return `${safeText.slice(0, low)}${ellipsis}`;
    }

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")

    function buildTooltipHtml(rawText) {
      const lines = String(rawText || "")
        .split("\n")
        .map((line) => line.trim())
        .filter(Boolean);

      if (!lines.length) {

      const formatTooltipLine = (line) => {
        const match = line.match(/^(.*?[：:]\s*)([+-]?\d+(?:\.\d+)?元)$/);
        if (!match) {
          return escapeHtml(line);
        }

        return `${escapeHtml(match[1])}<span class="tooltip-amount">${escapeHtml(match[2])}</span>`;
      };

      return `<div class="tooltip-lines">${lines
        .map((line) => `<div class="tooltip-line">${formatTooltipLine(line)}</div>`)
        .join("")}</div>`;
    }

    function createSvg(tag, attrs = {}) {
      const node = document.createElementNS(SVG_NS, tag);
      Object.entries(attrs).forEach(([key, value]) => {

    function buildPortX(node, count, index) {
      if (count <= 1) {
        return node.x;
      }

      const usable = Math.max(node.width - PORT_INSET * 2, 24);
      const step = usable / (count - 1);
      return node.x - usable / 2 + step * index;
    }

    function buildBiasedPortX(node, side) {
      if (side === "left") {
        return node.x - node.width / 2 + PORT_INSET;
      }

      if (side === "right") {
        return node.x + node.width / 2 - PORT_INSET;
      }

      return node.x;
    }

    function buildPortClearance(node, count) {
      if (count <= 1) {
        return node.width - PORT_INSET * 2;
      }
      return Math.max((node.width - PORT_INSET * 2) / (count - 1), 24);
    }

    function smoothCurvePath(points) {
      const filtered = points.filter((point, index) => {
        if (index === 0) {
          return true;
        }
        const prev = points[index - 1];
        return prev.x !== point.x || prev.y !== point.y;
      });

      if (filtered.length < 2) {
        return "";
      }

      let d = `M ${filtered[0].x} ${filtered[0].y}`;

      if (filtered.length === 2) {
        d += ` L ${filtered[1].x} ${filtered[1].y}`;
        return d;
      }

      const start = filtered[0];
      const end = filtered[filtered.length - 1];
      const next = filtered[1];
      const prev = filtered[filtered.length - 2];

      const startDx = next.x - start.x;
      const startDy = next.y - start.y;
      const endDx = end.x - prev.x;
      const endDy = end.y - prev.y;

      const startLength = Math.hypot(startDx, startDy) || 1;
      const endLength = Math.hypot(endDx, endDy) || 1;
      const totalLength = Math.hypot(end.x - start.x, end.y - start.y);
      const handle = Math.max(22, Math.min(72, totalLength * 0.22));

      const cp1x = start.x + (startDx / startLength) * handle;
      const cp1y = start.y + (startDy / startLength) * handle;
      const cp2x = end.x - (endDx / endLength) * handle;
      const cp2y = end.y - (endDy / endLength) * handle;

      d += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${end.x} ${end.y}`;

      return d;
    }

    function buildRoundedOrthogonalPath(points, radius = CORNER_RADIUS) {
      const filtered = points.filter((point, index) => {
        if (index === 0) {
          return true;
        }
        const prev = points[index - 1];
        return prev.x !== point.x || prev.y !== point.y;
      });

      if (filtered.length < 2) {
        return "";
      }

      let d = `M ${filtered[0].x} ${filtered[0].y}`;

      for (let index = 1; index < filtered.length - 1; index += 1) {
        const prev = filtered[index - 1];
        const current = filtered[index];
        const next = filtered[index + 1];
        const inDx = current.x - prev.x;
        const inDy = current.y - prev.y;
        const outDx = next.x - current.x;
        const outDy = next.y - current.y;
        const inLength = Math.hypot(inDx, inDy);
        const outLength = Math.hypot(outDx, outDy);

        if (!inLength || !outLength) {
          continue;
        }

        const sameDirection = (inDx === 0 && outDx === 0) || (inDy === 0 && outDy === 0);
        if (sameDirection) {
          d += ` L ${current.x} ${current.y}`;
          continue;
        }

        const cornerRadius = Math.min(radius, inLength / 2, outLength / 2);
        const before = {
          x: current.x - (inDx / inLength) * cornerRadius,
          y: current.y - (inDy / inLength) * cornerRadius
        };
        const after = {
          x: current.x + (outDx / outLength) * cornerRadius,
          y: current.y + (outDy / outLength) * cornerRadius
        };

        d += ` L ${before.x} ${before.y}`;
        d += ` Q ${current.x} ${current.y} ${after.x} ${after.y}`;
      }

      const end = filtered[filtered.length - 1];
      d += ` L ${end.x} ${end.y}`;

      return d;
    }

    function normalizeNodes(rawNodes) {
      const map = new Map();
      rawNodes.forEach((node) => {
        const hasMeta = Boolean(node.meta);
        map.set(node.id, {
          ...node,
          width: NODE_WIDTH,
          height: node.role === "initiator" || hasMeta ? 46 : 28
        });
      });

    }

    function parseNodeMeta(metaText) {
      if (!metaText) {
        return null;
      }

      const normalized = String(metaText).replace(/\s+/g, " ").trim();
      const matched = normalized.match(/^(.*?)[ :：]+([+-]?[\d,.]+)元\s+([+-]?[\d,.]+)%$/);

      if (!matched) {
        return {
          label: normalized,
          amount: "",
          rate: "",
          structured: false
        };
      }

      return {
        label: matched[1].trim(),
        amount: matched[2],
        rate: matched[3],
        structured: true
      };
    }

    function getNearestLayerIndex(y, layers) {
      let bestIndex = 0;
      let bestDistance = Number.POSITIVE_INFINITY;

      layers.forEach((layer, index) => {
        const distance = Math.abs(layer.y - y);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      });

      return bestIndex;
    }

    function compactNodesByLayer(dataset, nodeMap, gapByLayer = []) {
      if (!dataset.compactLayers || !dataset.layers?.length) {
        return;
      }

      const buckets = dataset.layers.map(() => []);

      nodeMap.forEach((node) => {
        const layerIndex = getNearestLayerIndex(node.y, dataset.layers);
        node.layerIndex = layerIndex;
        buckets[layerIndex].push(node);
      });

      buckets.forEach((nodes, layerIndex) => {
        if (!nodes.length) {
          return;
        }

        const layerY = dataset.layers[layerIndex].y;
        nodes.forEach((node) => {
          node.y = layerY;
        });

        if (nodes.length === 1) {
          return;
        }

        nodes.sort((a, b) => a.x - b.x);

        const layerGap = LAYER_NODE_GAP + (gapByLayer[layerIndex] || 0);
        const totalWidth = nodes.reduce((sum, node) => sum + node.width, 0) + layerGap * (nodes.length - 1);
        const preferredCenter = nodes.reduce((sum, node) => sum + node.x, 0) / nodes.length;
        const minCenter = totalWidth / 2 + LAYER_SIDE_PADDING;
        const maxCenter = dataset.canvas.width - totalWidth / 2 - LAYER_SIDE_PADDING;
        const layerCenter = minCenter <= maxCenter
          ? Math.max(minCenter, Math.min(maxCenter, preferredCenter))
          : preferredCenter;
        let left = layerCenter - totalWidth / 2;

        nodes.forEach((node) => {
          node.x = left + node.width / 2;
          left += node.width + layerGap;
        });
      });
    }

    function applyFixedReferenceNodeLayout(dataset, nodeMap) {
      if (!dataset.scheme1ReferenceXs || !dataset.layers?.length) {
        return false;
      }

      nodeMap.forEach((node) => {
        const layerIndex = getNearestLayerIndex(node.y, dataset.layers);
        node.layerIndex = layerIndex;
        node.y = dataset.layers[layerIndex].y;

        if (Object.prototype.hasOwnProperty.call(dataset.scheme1ReferenceXs, node.id)) {
          node.x = dataset.scheme1ReferenceXs[node.id];
        }
      });

      return true;
    }

    function getOrderedLayerNodes(nodeMap, layerIndex) {
      return Array.from(nodeMap.values())
        .filter((node) => node.layerIndex === layerIndex)
        .sort((nodeA, nodeB) => nodeA.x - nodeB.x);
    }

    function resolveLayerPositionsForAnchor(layerNodes, anchorIndex, desiredX, canvasWidth, gap = LAYER_NODE_GAP) {
      if (!layerNodes.length || anchorIndex < 0 || anchorIndex >= layerNodes.length) {
        return null;
      }

      const offsets = new Array(layerNodes.length).fill(0);

      for (let index = anchorIndex - 1; index >= 0; index -= 1) {
        offsets[index] = offsets[index + 1]
          - (layerNodes[index].width + layerNodes[index + 1].width) / 2
          - gap;
      }

      for (let index = anchorIndex + 1; index < layerNodes.length; index += 1) {
        offsets[index] = offsets[index - 1]
          + (layerNodes[index - 1].width + layerNodes[index].width) / 2
          + gap;
      }

      const leftEdgeAtZero = offsets[0] - layerNodes[0].width / 2;
      const rightEdgeAtZero = offsets[offsets.length - 1] + layerNodes[layerNodes.length - 1].width / 2;
      const minAnchorX = LAYER_SIDE_PADDING - leftEdgeAtZero;
      const maxAnchorX = canvasWidth - LAYER_SIDE_PADDING - rightEdgeAtZero;
      const anchorX = minAnchorX <= maxAnchorX
        ? Math.max(minAnchorX, Math.min(maxAnchorX, desiredX))
        : desiredX;

      return offsets.map((offset) => offset + anchorX);
    }

    function alignNodeToVerticalAnchor(dataset, nodeMap, layerIndex, anchorNodeId, desiredX) {
      const layerNodes = getOrderedLayerNodes(nodeMap, layerIndex);
      const anchorIndex = layerNodes.findIndex((node) => node.id === anchorNodeId);

      if (anchorIndex === -1) {
        return;
      }

      const nextXs = resolveLayerPositionsForAnchor(
        layerNodes,
        anchorIndex,
        desiredX,
        dataset.canvas.width
      );

      if (!nextXs) {
        return;
      }

      layerNodes.forEach((node, index) => {
        node.x = nextXs[index];
      });
    }

    function applySchemeOneFanAlignment(dataset, nodeMap, rawEdges) {
      const fanInGroups = new Map();
      const fanOutGroups = new Map();

      rawEdges.forEach((edge) => {
        const source = nodeMap.get(edge.source);
        const target = nodeMap.get(edge.target);
        const layerDistance = Math.abs(source.layerIndex - target.layerIndex);

        if (layerDistance !== 1) {
          return;
        }

        const fanInKey = `${target.id}:${source.layerIndex}`;
        const fanOutKey = `${source.id}:${target.layerIndex}`;

        if (!fanInGroups.has(fanInKey)) {
          fanInGroups.set(fanInKey, {
            target,
            sourceLayerIndex: source.layerIndex,
            sourceIds: new Set()
          });
        }
        fanInGroups.get(fanInKey).sourceIds.add(source.id);

        if (!fanOutGroups.has(fanOutKey)) {
          fanOutGroups.set(fanOutKey, {
            source,
            targetLayerIndex: target.layerIndex,
            targetIds: new Set()
          });
        }
        fanOutGroups.get(fanOutKey).targetIds.add(target.id);
      });

      const rules = [];

      fanInGroups.forEach((group) => {
        const sourceIds = Array.from(group.sourceIds);
        if (sourceIds.length < 3 || sourceIds.length % 2 === 0) {
          return;
        }

        const orderedSources = sourceIds
          .map((nodeId) => nodeMap.get(nodeId))
          .sort((nodeA, nodeB) => nodeA.x - nodeB.x);
        const medianSource = orderedSources[Math.floor(orderedSources.length / 2)];

        rules.push({
          layerIndex: group.sourceLayerIndex,
          anchorNodeId: medianSource.id,
          desiredX: group.target.x,
          weight: orderedSources.length
        });
      });

      fanOutGroups.forEach((group) => {
        const targetIds = Array.from(group.targetIds);
        if (targetIds.length < 3 || targetIds.length % 2 === 0) {
          return;
        }

        const orderedTargets = targetIds
          .map((nodeId) => nodeMap.get(nodeId))
          .sort((nodeA, nodeB) => nodeA.x - nodeB.x);
        const medianTarget = orderedTargets[Math.floor(orderedTargets.length / 2)];

        rules.push({
          layerIndex: group.targetLayerIndex,
          anchorNodeId: medianTarget.id,
          desiredX: group.source.x,
          weight: orderedTargets.length
        });
      });

      rules
        .sort((ruleA, ruleB) => ruleB.weight - ruleA.weight)
        .forEach((rule) => {
          alignNodeToVerticalAnchor(
            dataset,
            nodeMap,
            rule.layerIndex,
            rule.anchorNodeId,
            rule.desiredX
          );
        });
    }

    function resolveTagPresentation(rawAmount) {
      const value = String(rawAmount || "").trim();
      const normalized = value.replace(/\s+/g, "");
      const matched = normalized.match(/^([+-]?[\d,]+(?:\.\d+)?)(元)?$/);

      if (!matched) {
        const fallbackText = "****";
        return {
          variant: "error",
          valueText: fallbackText,
          unitText: "",
          valueWidth: Math.ceil(measureTextWidth(fallbackText, '500 10px "PingFang SC"')),
          unitWidth: 0,
          width: Math.max(31, Math.ceil(measureTextWidth(fallbackText, '500 10px "PingFang SC"')) + 10),
          height: 20
        };
      }

      const valueText = matched[1];
      const unitText = "元";
      const valueWidth = Math.ceil(measureTextWidth(valueText, '500 10px "PingFang SC"'));
      const unitWidth = Math.ceil(measureTextWidth(unitText, '400 10px "PingFang SC"'));

      return {
        variant: "normal",
        valueText,
        unitText,
        valueWidth,
        unitWidth,
        width: Math.max(70, valueWidth + unitWidth + 12),
        height: 20
      };
    }

    function resolveLabelTagPresentation(labelText) {
      const valueText = String(labelText || "").trim();
      const valueWidth = Math.ceil(measureTextWidth(valueText, '500 10px "PingFang SC"'));

      return {
        variant: "normal",
        valueText,
        unitText: "",
        valueWidth,
        unitWidth: 0,

      };
    }

    function parseAmountNumber(rawAmount) {
      const normalized = String(rawAmount || "").replace(/\s+/g, "").replace(/元/g, "").replace(/,/g, "");
      const parsed = Number(normalized);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatAmountNumber(value) {
      const safeValue = Number(value) || 0;
      const sign = safeValue > 0 ? "+" : safeValue < 0 ? "-" : "";
      return `${sign}${Math.abs(safeValue).toFixed(2)}元`;
    }

    function pointOnRectTowards(node, toX, toY) {
      const dx = toX - node.x;
      const dy = toY - node.y;
      const halfW = node.width / 2;
      const halfH = node.height / 2;

      if (!dx && !dy) {
        return { x: node.x, y: node.y };
      }

      const scaleX = dx === 0 ? Number.POSITIVE_INFINITY : halfW / Math.abs(dx);
      const scaleY = dy === 0 ? Number.POSITIVE_INFINITY : halfH / Math.abs(dy);
      const scale = Math.min(scaleX, scaleY);

      return {
        x: node.x + dx * scale,
        y: node.y + dy * scale
      };
    }

    function normalizeAngle(angle) {
      const full = Math.PI * 2;
      return ((angle % full) + full) % full;
    }

    function buildRadialEdgePath(sourcePoint, orbitPoint, corePoint, angle) {
      const ux = Math.cos(angle);
      const uy = Math.sin(angle);
      const tx = -uy;
      const ty = ux;
      const sweep = Math.sin(angle) >= 0 ? 1 : -1;

      const cp1 = {
        x: sourcePoint.x - ux * 92 + tx * 18 * sweep,
        y: sourcePoint.y - uy * 92 + ty * 18 * sweep
      };
      const cp2 = {
        x: orbitPoint.x + tx * 34 * sweep,
        y: orbitPoint.y + ty * 34 * sweep
      };
      const radialMid = {
        x: orbitPoint.x * 0.62 + corePoint.x * 0.38 + tx * 8 * sweep,
        y: orbitPoint.y * 0.62 + corePoint.y * 0.38 + ty * 8 * sweep
      };

      return [
        `M ${sourcePoint.x} ${sourcePoint.y}`,
        `C ${cp1.x} ${cp1.y}, ${cp2.x} ${cp2.y}, ${orbitPoint.x} ${orbitPoint.y}`,
        `Q ${radialMid.x} ${radialMid.y}, ${corePoint.x} ${corePoint.y}`
      ].join(" ");
    }

    function buildRadialGraph(dataset) {
      const nodeMap = normalizeNodes(dataset.nodes);
      const edges = dataset.edges.map((edge) => ({ ...edge }));
      const core = nodeMap.get(dataset.coreId);

      nodeMap.forEach((node) => {
        node.outgoing = [];
        node.incoming = [];
      });

      nodeMap.forEach((node) => {
        if (node.id !== core.id) {
          node.x = core.x + node.radius * Math.cos(node.angle);
          node.y = core.y + node.radius * Math.sin(node.angle);
        }
      });

      edges.forEach((edge) => {
        nodeMap.get(edge.source).outgoing.push(edge);
        nodeMap.get(edge.target).incoming.push(edge);
      });

      const sortedOrbitEdges = edges
        .map((edge) => {
          const source = nodeMap.get(edge.source);
          return {
            edge,
            baseAngle: normalizeAngle(Math.atan2(source.y - core.y, source.x - core.x))
          };
        })
        .sort((a, b) => a.baseAngle - b.baseAngle);

      const minAngleGap = TAG_ORBIT_MIN_GAP / TAG_ORBIT_RADIUS;
      let lastAngle = null;

      sortedOrbitEdges.forEach(({ edge, baseAngle }) => {
        let tagAngle = baseAngle;

        if (lastAngle !== null && tagAngle - lastAngle < minAngleGap) {
          tagAngle = lastAngle + minAngleGap;
        }

        edge.tagAngle = tagAngle;
        lastAngle = tagAngle;
      });

      edges.forEach((edge) => {
        const source = nodeMap.get(edge.source);
        const target = nodeMap.get(edge.target);
        const angle = edge.tagAngle;
        const orbitPoint = {
          x: core.x + TAG_ORBIT_RADIUS * Math.cos(angle),
          y: core.y + TAG_ORBIT_RADIUS * Math.sin(angle)
        };
        const sourcePoint = pointOnRectTowards(source, orbitPoint.x, orbitPoint.y);
        const corePoint = pointOnRectTowards(core, orbitPoint.x, orbitPoint.y);

        edge.sourceNode = source;
        edge.targetNode = target;
        edge.sourcePortX = sourcePoint.x;
        edge.sourcePortY = sourcePoint.y;
        edge.targetPortX = corePoint.x;
        edge.targetPortY = corePoint.y;
        edge.path = buildRadialEdgePath(sourcePoint, orbitPoint, corePoint, angle);
        edge.points = [sourcePoint, orbitPoint, corePoint];
        edge.tagAnchor = "orbit-ring";
        edge.tagCenter = orbitPoint;
        edge.tagPresentation = resolveTagPresentation(edge.amount);
        edge.tagVariant = edge.tagPresentation.variant;
        edge.tagWidth = edge.tagPresentation.width;
        edge.tagHeight = edge.tagPresentation.height;
      });

      return {
        dataset,
        nodeMap,
        edges,
        orbitRing: {
          x: core.x,
          y: core.y,
          radius: TAG_ORBIT_RADIUS
        },
        bounds: {
          minX: 80,
          minY: 70,
          maxX: dataset.canvas.width - 80,
          maxY: dataset.canvas.height - 70
        }
      };
    }

    function buildLayoutFromNodeMap(dataset, nodeMap, edgeSeed, gapByLayer) {
      const hasReferenceLayout = applyFixedReferenceNodeLayout(dataset, nodeMap);

      if (!hasReferenceLayout) {
        compactNodesByLayer(dataset, nodeMap, gapByLayer);
      }

      if (dataset.scheme1FanAlignment !== false) {
        applySchemeOneFanAlignment(dataset, nodeMap, edgeSeed);
      }

      return buildRegularGraphLayout(
        dataset,
        nodeMap,
        edgeSeed.map((edge) => ({ ...edge }))
      );
    }

    function getSchemeOneLayerExpansion(overlaps, layerIndex, layerNodeCounts) {
      if ((layerNodeCounts[layerIndex] || 0) <= 1) {
        return 0;
      }

      let requiredExpansion = 0;

      overlaps.forEach(([a, b]) => {
        const overlap = getBoxOverlapMetrics(a, b);
        const requiredGap = Math.ceil(overlap.width + TAG_BOX_GAP + 12);

        if (requiredGap <= 0) {
          return;
        }

        const sameSourceLayer = a.sourceLayerIndex === layerIndex
          && b.sourceLayerIndex === layerIndex
          && a.sourceId !== b.sourceId;
        const sameTargetLayer = a.targetLayerIndex === layerIndex
          && b.targetLayerIndex === layerIndex
          && a.targetId !== b.targetId;

        if (sameSourceLayer || sameTargetLayer) {
          requiredExpansion = Math.max(requiredExpansion, requiredGap);
        }
      });

      return requiredExpansion;
    }

    function buildSchemeOneGraph(dataset) {
      const nodeMap = normalizeNodes(dataset.nodes);
      const edgeSeed = dataset.edges.map((edge) => ({ ...edge }));
      const layerGapByLayer = (dataset.layers || []).map(() => 0);
      const layerNodeCounts = (dataset.layers || []).map(() => 0);

      nodeMap.forEach((node) => {
        const layerIndex = getNearestLayerIndex(node.y, dataset.layers || []);
        node.layerIndex = layerIndex;
        layerNodeCounts[layerIndex] += 1;
      });

      if (dataset.scheme1ReferenceXs) {
        const layoutResult = buildLayoutFromNodeMap(dataset, nodeMap, edgeSeed, layerGapByLayer);

        return {
          dataset,
          nodeMap,
          edges: layoutResult.edges,
          bounds: layoutResult.bounds
        };
      }

      let layoutResult = buildLayoutFromNodeMap(dataset, nodeMap, edgeSeed, layerGapByLayer);

      for (let layerIndex = 1; layerIndex < (dataset.layers || []).length; layerIndex += 1) {
        if ((layerNodeCounts[layerIndex] || 0) <= 1) {
          continue;
        }

        for (let pass = 0; pass < MAX_SCHEME_ONE_TAG_LAYOUT_PASSES; pass += 1) {
          layoutResult = buildLayoutFromNodeMap(dataset, nodeMap, edgeSeed, layerGapByLayer);
          const overlaps = collectTagOverlapPairs(layoutResult.tagBoxes);
          const expansion = getSchemeOneLayerExpansion(overlaps, layerIndex, layerNodeCounts);

          if (!expansion) {
            break;
          }

          layerGapByLayer[layerIndex] += Math.max(LAYER_GAP_EXPAND_STEP, expansion);
        }
      }

      layoutResult = buildLayoutFromNodeMap(dataset, nodeMap, edgeSeed, layerGapByLayer);

      return {
        dataset,
        nodeMap,
        edges: layoutResult.edges,
        bounds: layoutResult.bounds
      };
    }

    function buildGraph(modeKey) {
      const dataset = datasets[modeKey];

      if (dataset.layout === "radial-core") {
        return buildRadialGraph(dataset);
      }

      if (state.scheme === "scheme1" || state.scheme === "scheme3") {
        return buildSchemeOneGraph(dataset);
      }

      const nodeMap = normalizeNodes(dataset.nodes);
      const edgeSeed = dataset.edges.map((edge) => ({ ...edge }));
      const layerGapByLayer = (dataset.layers || []).map(() => 0);
      const layerNodeCounts = (dataset.layers || []).map(() => 0);
      nodeMap.forEach((node) => {
        const layerIndex = getNearestLayerIndex(node.y, dataset.layers || []);
        layerNodeCounts[layerIndex] += 1;
      });

      let layoutResult = null;
      const maxPasses = dataset.compactLayers ? MAX_TAG_LAYOUT_PASSES : 1;

      for (let pass = 0; pass < maxPasses; pass += 1) {
        compactNodesByLayer(dataset, nodeMap, layerGapByLayer);
        const edges = edgeSeed.map((edge) => ({ ...edge }));
        layoutResult = buildRegularGraphLayout(dataset, nodeMap, edges);

        const overlaps = collectTagOverlapPairs(layoutResult.tagBoxes);
        if (!overlaps.length) {
          break;
        }

        const expandableLayers = getExpandableLayers(overlaps, layerNodeCounts);
        if (!expandableLayers.length) {
          break;
        }

        expandableLayers.forEach((layerIndex) => {
          layerGapByLayer[layerIndex] += LAYER_GAP_EXPAND_STEP;
        });
      }

      return {
        dataset,
        nodeMap,
        edges: layoutResult.edges,
        bounds: layoutResult.bounds
      };
    }

    function clearElement(element) {
      while (element.firstChild) {
        element.removeChild(element.firstChild);
      }
    }

    function destroyTooltips() {
      state.tooltipInstances.forEach((instance) => instance.destroy());
      state.tooltipInstances = [];
    }

    function getTagPreferredRatio() {
      return 0.5;
    }

    function boxesOverlap(a, b, gap = TAG_BOX_GAP) {
      return !(
        a.right + gap <= b.left ||
        b.right + gap <= a.left ||
        a.bottom + gap <= b.top ||
        b.bottom + gap <= a.top
      );
    }

    function pickTagPlacement(edge, route, placedBoxes) {
      const totalLength = route.getTotalLength();
      const preferredRatio = getTagPreferredRatio(edge);
      const tryOffsets = [0, 0.04, -0.04, 0.08, -0.08, 0.12, -0.12, 0.16, -0.16];

      for (const offset of tryOffsets) {
        const ratio = Math.max(0.22, Math.min(0.78, preferredRatio + offset));
        const point = route.getPointAtLength(totalLength * ratio);
        const box = {
          left: point.x - edge.tagWidth / 2,
          right: point.x + edge.tagWidth / 2,
          top: point.y - edge.tagHeight / 2,
          bottom: point.y + edge.tagHeight / 2,
          centerX: point.x,
          centerY: point.y,
          ratio
        };

        if (!placedBoxes.some((placed) => boxesOverlap(box, placed))) {
          return box;
        }
      }

      const fallbackPoint = route.getPointAtLength(totalLength * preferredRatio);
      return {
        left: fallbackPoint.x - edge.tagWidth / 2,
        right: fallbackPoint.x + edge.tagWidth / 2,
        top: fallbackPoint.y - edge.tagHeight / 2,
        bottom: fallbackPoint.y + edge.tagHeight / 2,
        centerX: fallbackPoint.x,
        centerY: fallbackPoint.y,
        ratio: preferredRatio
      };
    }

    function computeEdgeTagBoxes(edges) {
      const placedBoxes = [];

      edges.forEach((edge) => {
        if (edge.fixedTagCenter && edge.tagCenter) {
          placedBoxes.push({
            left: edge.tagCenter.x - edge.tagWidth / 2,
            right: edge.tagCenter.x + edge.tagWidth / 2,
            top: edge.tagCenter.y - edge.tagHeight / 2,
            bottom: edge.tagCenter.y + edge.tagHeight / 2,
            centerX: edge.tagCenter.x,
            centerY: edge.tagCenter.y,
            ratio: 0.5,
            edgeId: edge.id,
            sourceId: edge.source,
            targetId: edge.target,
            sourceLayerIndex: edge.sourceNode.layerIndex,
            targetLayerIndex: edge.targetNode.layerIndex
          });
          return;
        }

        const route = createSvg("path", { d: edge.path });
        const chosen = pickTagPlacement(edge, route, placedBoxes);

        edge.tagCenter = {
          x: chosen.centerX,
          y: chosen.centerY
        };
        placedBoxes.push({
          ...chosen,
          edgeId: edge.id,
          sourceId: edge.source,
          targetId: edge.target,
          sourceLayerIndex: edge.sourceNode.layerIndex,
          targetLayerIndex: edge.targetNode.layerIndex
        });
      });

      return placedBoxes;
    }

    function collectTagOverlapPairs(boxes) {
      const overlaps = [];

      for (let i = 0; i < boxes.length; i += 1) {
        for (let j = i + 1; j < boxes.length; j += 1) {
          if (boxesOverlap(boxes[i], boxes[j], 0)) {
            overlaps.push([boxes[i], boxes[j]]);
          }
        }
      }

      return overlaps;
    }

    function getBoxOverlapMetrics(a, b) {
      return {
        width: Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left)),
        height: Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top))
      };
    }

    function getExpandableLayers(overlaps, layerNodeCounts) {
      const layers = new Set();

      overlaps.forEach(([a, b]) => {
        let added = false;

        if (a.sourceLayerIndex === b.sourceLayerIndex && a.sourceId !== b.sourceId) {
          if ((layerNodeCounts[a.sourceLayerIndex] || 0) > 1) {
            layers.add(a.sourceLayerIndex);
            added = true;
          }
        }

        if (a.targetLayerIndex === b.targetLayerIndex && a.targetId !== b.targetId) {
          if ((layerNodeCounts[a.targetLayerIndex] || 0) > 1) {
            layers.add(a.targetLayerIndex);
            added = true;
          }
        }

        if (!added) {
          [a.sourceLayerIndex, a.targetLayerIndex, b.sourceLayerIndex, b.targetLayerIndex].forEach((layerIndex) => {
            if ((layerNodeCounts[layerIndex] || 0) > 1) {
              layers.add(layerIndex);
            }
          });
        }
      });

      return Array.from(layers);
    }

    function getOverlapExpansionByLayer(overlaps, layerNodeCounts) {
      const expansionByLayer = new Map();

      overlaps.forEach(([a, b]) => {
        const overlap = getBoxOverlapMetrics(a, b);
        const requiredGap = Math.ceil(overlap.width + TAG_BOX_GAP + 12);

        if (requiredGap <= 0) {
          return;
        }

        let assigned = false;

        if (a.sourceLayerIndex === b.sourceLayerIndex && a.sourceId !== b.sourceId) {
          if ((layerNodeCounts[a.sourceLayerIndex] || 0) > 1) {
            expansionByLayer.set(
              a.sourceLayerIndex,
              Math.max(expansionByLayer.get(a.sourceLayerIndex) || 0, requiredGap)
            );
            assigned = true;
          }
        }

        if (a.targetLayerIndex === b.targetLayerIndex && a.targetId !== b.targetId) {
          if ((layerNodeCounts[a.targetLayerIndex] || 0) > 1) {
            expansionByLayer.set(
              a.targetLayerIndex,
              Math.max(expansionByLayer.get(a.targetLayerIndex) || 0, requiredGap)
            );
            assigned = true;
          }
        }

        if (!assigned) {
          const candidateLayers = [
            a.sourceLayerIndex,
            a.targetLayerIndex,
            b.sourceLayerIndex,
            b.targetLayerIndex
          ].filter((layerIndex, index, array) =>
            array.indexOf(layerIndex) === index && (layerNodeCounts[layerIndex] || 0) > 1
          );

          if (!candidateLayers.length) {
            return;
          }

          const distributedGap = Math.ceil(requiredGap / candidateLayers.length);
          candidateLayers.forEach((layerIndex) => {
            expansionByLayer.set(
              layerIndex,
              Math.max(expansionByLayer.get(layerIndex) || 0, distributedGap)
            );
          });
        }
      });

      return expansionByLayer;
    }

    function buildTagBoxesFromFixedCenters(edges) {
      return edges.map((edge) => ({
        left: edge.tagCenter.x - edge.tagWidth / 2,
        right: edge.tagCenter.x + edge.tagWidth / 2,
        top: edge.tagCenter.y - edge.tagHeight / 2,
        bottom: edge.tagCenter.y + edge.tagHeight / 2,
        centerX: edge.tagCenter.x,
        centerY: edge.tagCenter.y,
        ratio: 0.5,
        edgeId: edge.id,
        sourceId: edge.source,
        targetId: edge.target,
        sourceLayerIndex: edge.sourceNode.layerIndex,
        targetLayerIndex: edge.targetNode.layerIndex
      }));
    }

    function buildTagCandidateBox(edge, point) {
      return {
        left: point.x - edge.tagWidth / 2,
        right: point.x + edge.tagWidth / 2,
        top: point.y - edge.tagHeight / 2,
        bottom: point.y + edge.tagHeight / 2,
        centerX: point.x,
        centerY: point.y
      };
    }

    function scoreTagCandidateBox(box, placedBoxes) {
      return placedBoxes.reduce((score, placed) => {
        const overlap = getBoxOverlapMetrics(box, placed);
        return score + overlap.width * overlap.height;
      }, 0);
    }

    function pushUniqueTagCandidate(candidates, point) {
      const key = `${point.x.toFixed(2)}:${point.y.toFixed(2)}`;
      if (candidates.some((candidate) => candidate.key === key)) {
        return;
      }

      candidates.push({
        key,
        x: point.x,
        y: point.y
      });
    }

    function buildSchemeOneTagCandidates(edge, sharedSourceCount, sharedTargetCount) {
      const candidates = [];
      const spanLeft = Math.min(edge.sourcePortX, edge.targetPortX);
      const spanRight = Math.max(edge.sourcePortX, edge.targetPortX);
      const horizontalPadding = edge.tagWidth / 2 + 8;
      const horizontalMinX = spanLeft + horizontalPadding;
      const horizontalMaxX = spanRight - horizontalPadding;
      const hasHorizontalRoom = horizontalMinX <= horizontalMaxX;
      const sourceTowardsTarget = edge.targetPortX >= edge.sourcePortX;
      const sourceSideX = hasHorizontalRoom
        ? (sourceTowardsTarget ? horizontalMinX : horizontalMaxX)
        : (edge.sourcePortX + edge.targetPortX) / 2;
      const targetSideX = hasHorizontalRoom
        ? (sourceTowardsTarget ? horizontalMaxX : horizontalMinX)
        : (edge.sourcePortX + edge.targetPortX) / 2;
      const centerX = hasHorizontalRoom
        ? Math.max(horizontalMinX, Math.min(horizontalMaxX, (edge.sourcePortX + edge.targetPortX) / 2))
        : (edge.sourcePortX + edge.targetPortX) / 2;
      const sourceVerticalY = edge.sourcePortY + (edge.busY - edge.sourcePortY) * 0.56;
      const targetVerticalY = edge.targetPortY + (edge.busY - edge.targetPortY) * 0.56;

      if (sharedTargetCount > 1) {
        pushUniqueTagCandidate(candidates, { x: sourceSideX, y: edge.busY });
        pushUniqueTagCandidate(candidates, { x: edge.sourcePortX, y: sourceVerticalY });
        pushUniqueTagCandidate(candidates, { x: centerX, y: edge.busY });
        pushUniqueTagCandidate(candidates, { x: targetSideX, y: edge.busY });
      } else if (sharedSourceCount > 1) {
        pushUniqueTagCandidate(candidates, { x: targetSideX, y: edge.busY });
        pushUniqueTagCandidate(candidates, { x: edge.targetPortX, y: targetVerticalY });
        pushUniqueTagCandidate(candidates, { x: centerX, y: edge.busY });
        pushUniqueTagCandidate(candidates, { x: sourceSideX, y: edge.busY });
      } else {
        pushUniqueTagCandidate(candidates, { x: centerX, y: edge.busY });
        pushUniqueTagCandidate(candidates, { x: sourceSideX, y: edge.busY });
        pushUniqueTagCandidate(candidates, { x: targetSideX, y: edge.busY });
      }

      pushUniqueTagCandidate(candidates, { x: edge.sourcePortX, y: sourceVerticalY });
      pushUniqueTagCandidate(candidates, { x: edge.targetPortX, y: targetVerticalY });

      if (hasHorizontalRoom) {
        pushUniqueTagCandidate(candidates, {
          x: horizontalMinX + (horizontalMaxX - horizontalMinX) * 0.25,
          y: edge.busY
        });
        pushUniqueTagCandidate(candidates, {
          x: horizontalMinX + (horizontalMaxX - horizontalMinX) * 0.75,
          y: edge.busY
        });
      }

      return candidates;
    }

    function buildSchemeThreeTagCandidates(edge) {
      if (Math.abs(edge.sourcePortX - edge.targetPortX) < 1) {
        return [{
          key: `${edge.targetPortX.toFixed(2)}:${((edge.sourcePortY + edge.targetPortY) / 2).toFixed(2)}`,
          x: edge.targetPortX,
          y: (edge.sourcePortY + edge.targetPortY) / 2
        }];
      }

      return [{
        key: `${edge.targetPortX.toFixed(2)}:${((edge.targetPortY + edge.busY) / 2).toFixed(2)}`,
        x: edge.targetPortX,
        y: (edge.targetPortY + edge.busY) / 2
      }];
    }

    function setEdgeTagData(edge, tagData) {
      edge.tagPresentation = tagData.presentation;
      edge.tagVariant = tagData.presentation.variant;
      edge.tagWidth = tagData.presentation.width;
      edge.tagHeight = tagData.presentation.height;
      edge.tagCenter = tagData.center;
      edge.fixedTagCenter = true;
      edge.tagInteractiveEdgeIds = tagData.edgeIds;
      edge.tagTooltip = tagData.tooltip || "";
      edge.renderTag = true;
    }

    function assignSchemeThreeTagsOnBus(busEdges, nodeMap) {
      const groupsByTarget = new Map();
      const placedBoxes = [];

      busEdges.forEach((edge) => {
        if (!groupsByTarget.has(edge.target)) {
          groupsByTarget.set(edge.target, []);
        }
        groupsByTarget.get(edge.target).push(edge);
        edge.renderTag = false;
      });

      const tagGroups = Array.from(groupsByTarget.values())
        .map((group) => ({
          edges: group,
          primary: group[0],
          priority: group.length,
          targetX: group[0].targetPortX
        }))
        .sort((groupA, groupB) => {
          if (groupA.priority !== groupB.priority) {
            return groupB.priority - groupA.priority;
          }
          return groupA.targetX - groupB.targetX;
        });

      tagGroups.forEach(({ edges, primary }) => {
        const targetNode = nodeMap.get(primary.target);
        const totalAmount = edges.reduce((sum, edge) => sum + parseAmountNumber(edge.amount), 0);
        const isAggregate = edges.length > 1;
        const presentation = isAggregate
          ? resolveLabelTagPresentation(`合计：${formatAmountNumber(totalAmount)}`)
          : resolveTagPresentation(primary.amount);
        const candidates = buildSchemeThreeTagCandidates(primary);

        let chosenBox = null;

        candidates.forEach((candidate) => {
          if (chosenBox) {
            return;
          }

          const box = buildTagCandidateBox({
            ...primary,
            tagWidth: presentation.width,
            tagHeight: presentation.height
          }, candidate);

          if (!placedBoxes.some((placed) => boxesOverlap(box, placed))) {
            chosenBox = box;
          }
        });

        if (!chosenBox) {
          let bestScore = Number.POSITIVE_INFINITY;
          candidates.forEach((candidate) => {
            const box = buildTagCandidateBox({
              ...primary,
              tagWidth: presentation.width,
              tagHeight: presentation.height
            }, candidate);
            const score = scoreTagCandidateBox(box, placedBoxes);
            if (score < bestScore) {
              bestScore = score;
              chosenBox = box;
            }
          });
        }

        if (!chosenBox) {
          chosenBox = buildTagCandidateBox({
            ...primary,
            tagWidth: presentation.width,
            tagHeight: presentation.height
          }, {
            x: primary.targetPortX,
            y: primary.targetPortY + (primary.busY - primary.targetPortY) * 0.7
          });
        }

        const tooltip = isAggregate
          ? [
            `总金额：${formatAmountNumber(totalAmount)}`,
            ...edges.map((edge) => {
              const sourceNode = nodeMap.get(edge.source);
              return `${sourceNode.title} -> ${targetNode.title}：${edge.amount}`;
            })
          ].join("\n")
          : "";

        setEdgeTagData(primary, {
          presentation,
          center: {
            x: chosenBox.centerX,
            y: chosenBox.centerY
          },
          edgeIds: edges.map((edge) => edge.id),
          tooltip
        });

        placedBoxes.push(chosenBox);
      });
    }

    function assignSegmentTagsOnBus(busEdges) {
      const sourceCounts = new Map();
      const targetCounts = new Map();
      const placedBoxes = [];

      busEdges.forEach((edge) => {
        sourceCounts.set(edge.source, (sourceCounts.get(edge.source) || 0) + 1);
        targetCounts.set(edge.target, (targetCounts.get(edge.target) || 0) + 1);
      });

      const edgeCandidates = busEdges
        .map((edge) => {
          const candidates = buildSchemeOneTagCandidates(
            edge,
            sourceCounts.get(edge.source) || 1,
            targetCounts.get(edge.target) || 1
          );

          return {
            edge,
            candidates,
            span: Math.abs(edge.targetPortX - edge.sourcePortX),
            priority: Math.max(sourceCounts.get(edge.source) || 1, targetCounts.get(edge.target) || 1)
          };
        })
        .sort((itemA, itemB) => {
          if (itemA.priority !== itemB.priority) {
            return itemB.priority - itemA.priority;
          }
          if (itemA.candidates.length !== itemB.candidates.length) {
            return itemA.candidates.length - itemB.candidates.length;
          }
          return itemA.span - itemB.span;
        });

      edgeCandidates.forEach(({ edge, candidates }) => {
        let chosenBox = null;

        for (const candidate of candidates) {
          const box = buildTagCandidateBox(edge, candidate);
          if (!placedBoxes.some((placed) => boxesOverlap(box, placed))) {
            chosenBox = box;
            break;
          }
        }

        if (!chosenBox) {
          let bestScore = Number.POSITIVE_INFINITY;

          candidates.forEach((candidate) => {
            const box = buildTagCandidateBox(edge, candidate);
            const score = scoreTagCandidateBox(box, placedBoxes);
            if (score < bestScore) {
              bestScore = score;
              chosenBox = box;
            }
          });
        }

        if (!chosenBox) {
          chosenBox = buildTagCandidateBox(edge, {
            x: (edge.sourcePortX + edge.targetPortX) / 2,
            y: edge.busY
          });
        }

        edge.tagCenter = {
          x: chosenBox.centerX,
          y: chosenBox.centerY
        };
        edge.tagSegment = null;
        edge.fixedTagCenter = true;
        placedBoxes.push(chosenBox);
      });
    }

    function buildSharedBusEdgePoints(edge) {
      return [
        { x: edge.sourcePortX, y: edge.sourcePortY },
        { x: edge.sourcePortX, y: edge.busY },
        { x: edge.targetPortX, y: edge.busY },
        { x: edge.targetPortX, y: edge.targetPortY }
      ];
    }

    function buildRegularGraphLayoutSchemeOne(dataset, nodeMap, edges) {
      nodeMap.forEach((node) => {
        node.outgoingTop = [];
        node.outgoingBottom = [];
        node.incomingTop = [];
        node.incomingBottom = [];
      });

      edges.forEach((edge) => {
        const source = nodeMap.get(edge.source);
        const target = nodeMap.get(edge.target);
        const isUpwardFlow = target.y < source.y;

        edge.sourceNode = source;
        edge.targetNode = target;
        edge.isUpwardFlow = isUpwardFlow;
        edge.sourcePortSide = isUpwardFlow ? "top" : "bottom";
        edge.targetPortSide = isUpwardFlow ? "bottom" : "top";

        if (edge.sourcePortSide === "top") {
          source.outgoingTop.push(edge);
        } else {
          source.outgoingBottom.push(edge);
        }

        if (edge.targetPortSide === "top") {
          target.incomingTop.push(edge);
        } else {
          target.incomingBottom.push(edge);
        }
      });

      const busGroups = new Map();

      edges.forEach((edge) => {
        const source = edge.sourceNode;
        const target = edge.targetNode;
        const minLayerIndex = Math.min(source.layerIndex, target.layerIndex);
        const maxLayerIndex = Math.max(source.layerIndex, target.layerIndex);
        const busY = (dataset.layers[minLayerIndex].y + dataset.layers[maxLayerIndex].y) / 2;
        const busKey = `${minLayerIndex}-${maxLayerIndex}`;
        const sourcePortCount = edge.sourcePortSide === "top"
          ? source.outgoingTop.length || 1
          : source.outgoingBottom.length || 1;
        const targetPortCount = edge.targetPortSide === "top"
          ? target.incomingTop.length || 1
          : target.incomingBottom.length || 1;

        edge.sourcePortIndex = 0;
        edge.targetPortIndex = 0;
        edge.sourcePortCount = sourcePortCount;
        edge.targetPortCount = targetPortCount;
        edge.sourcePortX = source.x;
        edge.targetPortX = target.x;
        edge.sourcePortY = edge.sourcePortSide === "top"
          ? source.y - source.height / 2
          : source.y + source.height / 2;
        edge.targetPortY = edge.targetPortSide === "top"
          ? target.y - target.height / 2
          : target.y + target.height / 2;
        edge.busY = busY;
        edge.busKey = busKey;
        edge.tagPresentation = resolveTagPresentation(edge.amount);
        edge.tagVariant = edge.tagPresentation.variant;
        edge.tagWidth = edge.tagPresentation.width;
        edge.tagHeight = edge.tagPresentation.height;

        if (!busGroups.has(busKey)) {
          busGroups.set(busKey, []);
        }
        busGroups.get(busKey).push(edge);
      });

      busGroups.forEach((group) => {
        assignSegmentTagsOnBus(group);

        group.forEach((edge) => {
          edge.points = buildSharedBusEdgePoints(edge);
          edge.path = buildRoundedOrthogonalPath(edge.points);
        });
      });

      const tagBoxes = buildTagBoxesFromFixedCenters(edges);

      const bounds = {
        minX: Infinity,
        minY: Infinity,
        maxX: -Infinity,
        maxY: -Infinity
      };

      nodeMap.forEach((node) => {
        bounds.minX = Math.min(bounds.minX, node.x - node.width / 2 - NODE_PADDING_X);
        bounds.minY = Math.min(bounds.minY, node.y - node.height / 2 - NODE_PADDING_X);
        bounds.maxX = Math.max(bounds.maxX, node.x + node.width / 2 + NODE_PADDING_X);
        bounds.maxY = Math.max(bounds.maxY, node.y + node.height / 2 + NODE_PADDING_X);
      });

      edges.forEach((edge) => {
        edge.points.forEach((point) => {
          bounds.minX = Math.min(bounds.minX, point.x);
          bounds.minY = Math.min(bounds.minY, point.y);
          bounds.maxX = Math.max(bounds.maxX, point.x);
          bounds.maxY = Math.max(bounds.maxY, point.y);
        });
      });

      tagBoxes.forEach((box) => {
        bounds.minX = Math.min(bounds.minX, box.left - 8);
        bounds.minY = Math.min(bounds.minY, box.top - 8);
        bounds.maxX = Math.max(bounds.maxX, box.right + 8);
        bounds.maxY = Math.max(bounds.maxY, box.bottom + 8);
      });

      return {
        edges,
        bounds,
        tagBoxes
      };
    }

    function buildRegularGraphLayoutSchemeThree(dataset, nodeMap, edges) {
      nodeMap.forEach((node) => {
        node.outgoingTop = [];
        node.outgoingBottom = [];
        node.incomingTop = [];
        node.incomingBottom = [];
      });

      edges.forEach((edge) => {
        const source = nodeMap.get(edge.source);
        const target = nodeMap.get(edge.target);
        const isUpwardFlow = target.y < source.y;

        edge.sourceNode = source;
        edge.targetNode = target;
        edge.isUpwardFlow = isUpwardFlow;
        edge.sourcePortSide = isUpwardFlow ? "top" : "bottom";
        edge.targetPortSide = isUpwardFlow ? "bottom" : "top";
        edge.renderTag = false;

        if (edge.sourcePortSide === "top") {
          source.outgoingTop.push(edge);
        } else {
          source.outgoingBottom.push(edge);
        }

        if (edge.targetPortSide === "top") {
          target.incomingTop.push(edge);
        } else {
          target.incomingBottom.push(edge);
        }
      });

      const busGroups = new Map();

      edges.forEach((edge) => {
        const source = edge.sourceNode;
        const target = edge.targetNode;
        const minLayerIndex = Math.min(source.layerIndex, target.layerIndex);
        const maxLayerIndex = Math.max(source.layerIndex, target.layerIndex);
        const busY = (dataset.layers[minLayerIndex].y + dataset.layers[maxLayerIndex].y) / 2;
        const busKey = `${minLayerIndex}-${maxLayerIndex}`;
        const sourcePortCount = edge.sourcePortSide === "top"
          ? source.outgoingTop.length || 1
          : source.outgoingBottom.length || 1;
        const targetPortCount = edge.targetPortSide === "top"
          ? target.incomingTop.length || 1
          : target.incomingBottom.length || 1;

        edge.sourcePortIndex = 0;
        edge.targetPortIndex = 0;
        edge.sourcePortCount = sourcePortCount;
        edge.targetPortCount = targetPortCount;
        edge.sourcePortX = source.x;
        edge.targetPortX = target.x;
        edge.sourcePortY = edge.sourcePortSide === "top"
          ? source.y - source.height / 2
          : source.y + source.height / 2;
        edge.targetPortY = edge.targetPortSide === "top"
          ? target.y - target.height / 2
          : target.y + target.height / 2;
        edge.busY = busY;
        edge.busKey = busKey;
        edge.tagPresentation = resolveTagPresentation(edge.amount);
        edge.tagVariant = edge.tagPresentation.variant;
        edge.tagWidth = edge.tagPresentation.width;
        edge.tagHeight = edge.tagPresentation.height;

        if (!busGroups.has(busKey)) {
          busGroups.set(busKey, []);
        }
        busGroups.get(busKey).push(edge);
      });

      busGroups.forEach((group) => {
        assignSchemeThreeTagsOnBus(group, nodeMap);

        group.forEach((edge) => {
          edge.points = buildSharedBusEdgePoints(edge);
          edge.path = buildRoundedOrthogonalPath(edge.points);
        });
      });

      const tagBoxes = buildTagBoxesFromFixedCenters(edges.filter((edge) => edge.renderTag));

      const bounds = {
        minX: Infinity,
        minY: Infinity,
        maxX: -Infinity,
        maxY: -Infinity
      };

      nodeMap.forEach((node) => {
        bounds.minX = Math.min(bounds.minX, node.x - node.width / 2 - NODE_PADDING_X);
        bounds.minY = Math.min(bounds.minY, node.y - node.height / 2 - NODE_PADDING_X);
        bounds.maxX = Math.max(bounds.maxX, node.x + node.width / 2 + NODE_PADDING_X);
        bounds.maxY = Math.max(bounds.maxY, node.y + node.height / 2 + NODE_PADDING_X);
      });

      edges.forEach((edge) => {
        edge.points.forEach((point) => {
          bounds.minX = Math.min(bounds.minX, point.x);
          bounds.minY = Math.min(bounds.minY, point.y);
          bounds.maxX = Math.max(bounds.maxX, point.x);
          bounds.maxY = Math.max(bounds.maxY, point.y);
        });
      });

      tagBoxes.forEach((box) => {
        bounds.minX = Math.min(bounds.minX, box.left - 8);
        bounds.minY = Math.min(bounds.minY, box.top - 8);
        bounds.maxX = Math.max(bounds.maxX, box.right + 8);
        bounds.maxY = Math.max(bounds.maxY, box.bottom + 8);
      });

      return {
        edges,
        bounds,
        tagBoxes
      };
    }

    function buildRegularGraphLayoutLegacy(dataset, nodeMap, edges) {
      const outgoingMap = new Map();
      const incomingMap = new Map();

      nodeMap.forEach((node) => {
        outgoingMap.set(node.id, []);
        incomingMap.set(node.id, []);
      });

      edges.forEach((edge) => {
        outgoingMap.get(edge.source).push(edge);
        incomingMap.get(edge.target).push(edge);
      });

      outgoingMap.forEach((list, nodeId) => {
        list.sort((a, b) => {
          const nodeA = nodeMap.get(a.target);
          const nodeB = nodeMap.get(b.target);
          if (nodeA.y !== nodeB.y) {
            return nodeA.y - nodeB.y;
          }
          return nodeA.x - nodeB.x;
        });
        nodeMap.get(nodeId).outgoing = list;
      });

      incomingMap.forEach((list, nodeId) => {
        list.sort((a, b) => {
          const nodeA = nodeMap.get(a.source);
          const nodeB = nodeMap.get(b.source);
          if (nodeA.y !== nodeB.y) {
            return nodeA.y - nodeB.y;
          }
          return nodeA.x - nodeB.x;
        });
        nodeMap.get(nodeId).incoming = list;
      });

      const laneGroups = new Map();

      edges.forEach((edge) => {
        const source = nodeMap.get(edge.source);
        const target = nodeMap.get(edge.target);
        const sourceIndex = source.outgoing.findIndex((item) => item.id === edge.id);
        const targetIndex = target.incoming.findIndex((item) => item.id === edge.id);
        const sourcePortCount = source.outgoing.length || 1;
        const targetPortCount = target.incoming.length || 1;
        const isUpwardFlow = target.y < source.y;
        const sourcePortSide = isUpwardFlow ? "top" : "bottom";
        const targetPortSide = isUpwardFlow ? "bottom" : "top";

        edge.sourcePortIndex = Math.max(sourceIndex, 0);
        edge.targetPortIndex = Math.max(targetIndex, 0);
        edge.sourcePortCount = sourcePortCount;
        edge.targetPortCount = targetPortCount;
        edge.isUpwardFlow = isUpwardFlow;
        edge.sourcePortSide = sourcePortSide;
        edge.targetPortSide = targetPortSide;
        edge.sourcePortX = source.x;
        edge.targetPortX = target.x;
        edge.sourcePortY = sourcePortSide === "top"
          ? source.y - source.height / 2
          : source.y + source.height / 2;
        edge.targetPortY = targetPortSide === "top"
          ? target.y - target.height / 2
          : target.y + target.height / 2;

        const sourceExitY = sourcePortSide === "top"
          ? edge.sourcePortY - EXCLUSIVE_SEGMENT
          : edge.sourcePortY + EXCLUSIVE_SEGMENT;
        const targetEntryY = targetPortSide === "top"
          ? edge.targetPortY - EXCLUSIVE_SEGMENT
          : edge.targetPortY + EXCLUSIVE_SEGMENT;

        edge.sourceExitY = sourceExitY;
        edge.targetEntryY = targetEntryY;

        const corridorKey = [
          Math.round(sourceExitY),
          Math.round(targetEntryY),
          Math.round(Math.min(sourceExitY, targetEntryY)),
          Math.round(Math.max(sourceExitY, targetEntryY))
        ].join(":");

        if (!laneGroups.has(corridorKey)) {
          laneGroups.set(corridorKey, []);
        }
        laneGroups.get(corridorKey).push(edge);
      });

      laneGroups.forEach((group) => {
        group.sort((a, b) => {
          if (a.sourcePortX !== b.sourcePortX) {
            return a.sourcePortX - b.sourcePortX;
          }
          return a.targetPortX - b.targetPortX;
        });

        const laneCount = group.length;

        group.forEach((edge, index) => {
          const sourceExitY = edge.sourceExitY;
          const targetEntryY = edge.targetEntryY;
          const middle = (sourceExitY + targetEntryY) / 2;
          const spread = (index - (laneCount - 1) / 2) * LANE_GAP;
          const laneTop = Math.min(sourceExitY, targetEntryY) + 10;
          const laneBottom = Math.max(sourceExitY, targetEntryY) - 10;

          let laneY = middle + spread;
          if (laneBottom >= laneTop) {
            laneY = Math.max(laneTop, Math.min(laneBottom, laneY));
          } else {
            laneY = middle;
          }

          edge.laneY = laneY;
        });
      });

      edges.forEach((edge) => {
        const source = nodeMap.get(edge.source);
        const target = nodeMap.get(edge.target);
        const sourceExitY = edge.sourceExitY;
        const targetEntryY = edge.targetEntryY;

        edge.points = [
          { x: edge.sourcePortX, y: edge.sourcePortY },
          { x: edge.sourcePortX, y: sourceExitY },
          { x: edge.sourcePortX, y: edge.laneY },
          { x: edge.targetPortX, y: edge.laneY },
          { x: edge.targetPortX, y: targetEntryY },
          { x: edge.targetPortX, y: edge.targetPortY }
        ];
        edge.path = smoothCurvePath(edge.points);
        edge.tagPresentation = resolveTagPresentation(edge.amount);
        edge.tagVariant = edge.tagPresentation.variant;
        edge.tagWidth = edge.tagPresentation.width;
        edge.tagHeight = edge.tagPresentation.height;
        edge.sourceNode = source;
        edge.targetNode = target;
      });

      const tagBoxes = computeEdgeTagBoxes(edges);

      const bounds = {
        minX: Infinity,
        minY: Infinity,
        maxX: -Infinity,
        maxY: -Infinity
      };

      nodeMap.forEach((node) => {
        bounds.minX = Math.min(bounds.minX, node.x - node.width / 2 - NODE_PADDING_X);
        bounds.minY = Math.min(bounds.minY, node.y - node.height / 2 - NODE_PADDING_X);
        bounds.maxX = Math.max(bounds.maxX, node.x + node.width / 2 + NODE_PADDING_X);
        bounds.maxY = Math.max(bounds.maxY, node.y + node.height / 2 + NODE_PADDING_X);
      });

      return {
        edges,
        bounds,
        tagBoxes
      };
    }

    function buildRegularGraphLayout(dataset, nodeMap, edges) {
      if (state.scheme === "scheme1") {
        return buildRegularGraphLayoutSchemeOne(dataset, nodeMap, edges);
      }

      if (state.scheme === "scheme3") {
        return buildRegularGraphLayoutSchemeThree(dataset, nodeMap, edges);
      }

      return buildRegularGraphLayoutLegacy(dataset, nodeMap, edges);
    }

    function positionTagGroup(tagGroup, edge, centerX, centerY, width, height) {
      const underlay = tagGroup.querySelector('[data-tag-part="underlay"]');
      const body = tagGroup.querySelector('[data-tag-part="body"]');
      const value = tagGroup.querySelector('[data-tag-part="value"]');
      const unit = tagGroup.querySelector('[data-tag-part="unit"]');
      const hit = tagGroup.querySelector('[data-tag-part="hit"]');
      const left = centerX - width / 2;
      const top = centerY - height / 2;

      if (underlay) {
        underlay.setAttribute("x", left - 2);
        underlay.setAttribute("y", top - 2);
      }

      if (body) {
        body.setAttribute("x", left);
        body.setAttribute("y", top);
      }

      if (hit) {
        hit.setAttribute("x", left - 4);
        hit.setAttribute("y", top - 4);
      }

      if (value) {
        if (edge.tagPresentation.unitText) {
          const totalWidth = edge.tagPresentation.valueWidth + edge.tagPresentation.unitWidth + 1;
          value.setAttribute("x", centerX - totalWidth / 2 + edge.tagPresentation.valueWidth / 2);
        } else {
          value.setAttribute("x", centerX);
        }
        value.setAttribute("y", centerY + 0.5);
      }

      if (unit) {
        const totalWidth = edge.tagPresentation.valueWidth + edge.tagPresentation.unitWidth + 1;
        unit.setAttribute("x", centerX + totalWidth / 2 - edge.tagPresentation.unitWidth / 2);
        unit.setAttribute("y", centerY + 0.5);
      }
    }

    function layoutTagsOnEdges(graphRoot, edges) {
      const tagGroups = new Map(
        Array.from(graphRoot.querySelectorAll(".tag-group")).map((group) => [
          group.getAttribute("data-edge-id"),
          group
        ])
      );
      const routePaths = new Map(
        Array.from(graphRoot.querySelectorAll(".edge-group")).map((group) => [
          group.getAttribute("data-edge-id"),
          group.querySelector(".edge-route")
        ])
      );
      const placedBoxes = [];

      edges.forEach((edge) => {
        const tagGroup = tagGroups.get(edge.id);
        const route = routePaths.get(edge.id);

        if (!tagGroup || !route) {
          return;
        }

        if (edge.fixedTagCenter && edge.tagCenter) {
          positionTagGroup(tagGroup, edge, edge.tagCenter.x, edge.tagCenter.y, edge.tagWidth, edge.tagHeight);
          placedBoxes.push({
            left: edge.tagCenter.x - edge.tagWidth / 2,
            right: edge.tagCenter.x + edge.tagWidth / 2,
            top: edge.tagCenter.y - edge.tagHeight / 2,
            bottom: edge.tagCenter.y + edge.tagHeight / 2
          });
          return;
        }

        const chosen = pickTagPlacement(edge, route, placedBoxes);

        edge.tagCenter = {
          x: chosen.centerX,
          y: chosen.centerY
        };
        positionTagGroup(tagGroup, edge, chosen.centerX, chosen.centerY, edge.tagWidth, edge.tagHeight);
        placedBoxes.push(chosen);
      });
    }

    function initTagTooltips(graphRoot) {
      // #region debug-point A:tippy-availability
      reportDebugEvent("A", "initTagTooltips", "enter initTagTooltips", {
        hasTippy: typeof window.tippy === "function"
      });
      // #endregion
      if (typeof window.tippy !== "function") {
        console.warn("Tippy.js is not available, tag tooltips cannot be initialized.");
        return;
      }

      destroyTooltips();

      const tooltipTargets = Array.from(graphRoot.querySelectorAll("[data-tooltip-html]"));
      // #region debug-point B:tooltip-targets
      reportDebugEvent("B", "initTagTooltips", "resolved tooltip targets", {
        targetCount: tooltipTargets.length,
        scheme: state.scheme,
        mode: state.mode
      });
      // #endregion
      state.tooltipInstances = tooltipTargets.map((target) => window.tippy(target, {
        content: target.getAttribute("data-tooltip-html"),
        allowHTML: true,
        trigger: "mouseenter focus",
        arrow: true,
        theme: "topology",
        placement: "top",
        delay: [0, 0],
        duration: [120, 80],
        interactive: false,
        maxWidth: "none",
        appendTo: () => document.body,
        onShow(instance) {
          // #region debug-point D:tippy-show
          reportDebugEvent("D", "tippy:onShow", "tooltip show triggered", {
            referenceTag: instance.reference?.getAttribute?.("data-debug-tag") || "",
            rect: instance.reference?.getBoundingClientRect?.()
              ? {
                  x: Math.round(instance.reference.getBoundingClientRect().x),
                  y: Math.round(instance.reference.getBoundingClientRect().y),
                  width: Math.round(instance.reference.getBoundingClientRect().width),
                  height: Math.round(instance.reference.getBoundingClientRect().height)
                }
              : null
          });
          // #endregion
        }
      }));
    }

    function renderLayerLabels(graphRoot, layers, width) {

    }

    function renderOrbitRing(graphRoot, orbitRing) {
      if (!orbitRing) {
        return;
      }

      graphRoot.appendChild(createSvg("circle", {
        cx: orbitRing.x,
        cy: orbitRing.y,

      }));
